<title>كتالوج سنتر عبدالله - الإصدار 3.0.0</title>

<style>
/* ================================================================
   [01] VARIABLES
   ================================================================ */
:root {
    --color-primary: #2980b9;
    --color-primary-dark: #1f6391;
    --color-primary-light: #5dade2;
    --color-success: #1a7a3f;
    --color-success-light: #27ae60;
    --color-danger: #c0392b;
    --color-danger-light: #e74c3c;
    --color-warning: #b8651a;
    --color-warning-light: #e67e22;
    --color-whatsapp: #128C7E;
    --color-whatsapp-dark: #075E54;
    --color-info: #1e5a85;

    --bg-main: #f0f4f9;
    --bg-card: #ffffff;
    --bg-input: #f8fafc;
    --bg-muted: #e8ecf1;
    --bg-badge: #dde4ed;

    --text-primary: #1a2634;
    --text-secondary: #3d4852;
    --text-muted: #5a6772;

    --border-color: #d5dce3;
    --border-hover: #2980b9;

    --shadow-sm: 0 2px 10px rgba(0,0,0,0.05);
    --shadow-md: 0 4px 15px rgba(0,0,0,0.06);
    --shadow-lg: 0 10px 25px rgba(0,0,0,0.10);
    --shadow-xl: 0 10px 30px rgba(0,0,0,0.15);

    --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px;
    --radius-xl: 20px; --radius-full: 40px;

    --space-xs: 4px; --space-sm: 8px; --space-md: 12px;
    --space-lg: 16px; --space-xl: 24px; --space-2xl: 32px;

    --font-sm: 12px; --font-base: 14px; --font-md: 15px;
    --font-lg: 17px; --font-xl: 20px; --font-2xl: 24px;

    --transition-fast: 0.15s ease;
    --transition-base: 0.25s ease;

    --z-modal: 9999; --z-cart: 9999; --z-toast: 10001; --z-confirm: 10002;
}

@media (prefers-color-scheme: dark) {
    :root {
        --bg-main: #14171c; --bg-card: #1f242c;
        --bg-input: #2a303a; --bg-muted: #323842;
        --bg-badge: #3a414d;
        --text-primary: #f1f5f9;
        --text-secondary: #cbd5e0;
        --text-muted: #a0aec0;
        --border-color: #4a5568;
    }
}

/* ================================================================
   [02] BASE
   ================================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }

body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: var(--bg-main);
    color: var(--text-primary);
    padding: var(--space-xl);
    min-height: 100vh;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}

.skip-link {
    position: absolute; top: -100px; left: 50%;
    transform: translateX(-50%);
    background: var(--color-primary); color: #fff;
    padding: var(--space-md) var(--space-xl);
    border-radius: var(--radius-sm);
    z-index: var(--z-toast);
    text-decoration: none;
    font-weight: 600;
    transition: top var(--transition-fast);
}
.skip-link:focus { top: 10px; }
:focus-visible { outline: 3px solid var(--color-primary); outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
    }
}

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }

.container { max-width: 1400px; margin: auto; }

.sr-only {
    position: absolute; width: 1px; height: 1px;
    padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
}

/* ================================================================
   [03] BANNER
   ================================================================ */
.connection-banner {
    display: none;
    padding: var(--space-md) var(--space-lg);
    border-radius: var(--radius-md);
    margin-bottom: var(--space-lg);
    font-weight: 600; text-align: center;
    font-size: var(--font-base);
}
.connection-banner.show { display: block; }
.connection-banner.offline { background: #fff3cd; color: #664d03; border: 1px solid #ffda6a; }
.connection-banner.syncing { background: #cff4fc; color: #055160; border: 1px solid #9eeaf9; }
.connection-banner.error { background: #f8d7da; color: #842029; border: 1px solid #f1aeb5; }
.connection-banner.success { background: #d1e7dd; color: #0f5132; border: 1px solid #a3cfbb; }

/* ================================================================
   [04] HEADER
   ================================================================ */
.header {
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: var(--space-lg);
    margin-bottom: var(--space-xl);
    background: var(--bg-card); padding: var(--space-lg) var(--space-xl);
    border-radius: var(--radius-lg); box-shadow: var(--shadow-sm);
}
.header-title {
    font-size: var(--font-2xl); color: var(--text-primary);
    display: flex; flex-direction: column; gap: 2px;
}
.header-title .title-main {
    display: flex; align-items: center; gap: var(--space-sm);
    font-weight: 800;
}
.header-title .title-meta {
    display: flex; gap: var(--space-sm); align-items: center;
    font-size: var(--font-sm); color: var(--text-secondary);
    font-weight: 600; letter-spacing: 0.3px;
}
.header-title .title-version {
    background: var(--bg-badge); padding: 2px 10px;
    border-radius: 20px;
    color: var(--text-secondary);
    font-weight: 700;
}
.header-title .title-update { color: var(--color-success); }
.header-actions { display: flex; gap: var(--space-sm); }
.header-btn {
    background: var(--bg-input); border: 2px solid var(--border-color);
    padding: var(--space-sm) var(--space-lg);
    border-radius: var(--radius-full); cursor: pointer;
    display: flex; align-items: center; gap: 6px;
    transition: border-color var(--transition-base), color var(--transition-base), background var(--transition-base);
    font-weight: 600; color: var(--text-primary);
    font-family: inherit; font-size: var(--font-base);
}
.header-btn:hover { border-color: var(--border-hover); color: var(--color-primary); }
.badge-count {
    background: var(--color-danger-light); color: #fff;
    border-radius: 20px; padding: 2px 8px;
    font-size: var(--font-sm); font-weight: 700;
    min-width: 22px; text-align: center;
}

/* ================================================================
   [05] SEARCH & FILTERS
   ================================================================ */
.search-panel {
    background: var(--bg-card); padding: var(--space-lg) var(--space-xl);
    border-radius: var(--radius-lg); box-shadow: var(--shadow-sm);
    margin-bottom: var(--space-lg);
}
.search-row {
    display: flex; flex-wrap: wrap; gap: var(--space-md); align-items: center;
}
.search-input-wrap {
    flex: 2; min-width: 220px;
    position: relative; display: flex; align-items: center;
}
.search-input-wrap svg {
    position: absolute; right: 14px;
    color: var(--text-muted); pointer-events: none;
}
.search-input-wrap input {
    width: 100%; padding: 10px 40px 10px 18px;
    border: 2px solid var(--border-color);
    border-radius: var(--radius-full);
    font-size: var(--font-md); outline: none;
    background: var(--bg-input); 
    color: var(--text-primary); font-family: inherit;
    transition: border-color var(--transition-base), background var(--transition-base);
}
.search-input-wrap input:focus { border-color: var(--color-primary); background: var(--bg-card); }
.clear-search {
    position: absolute; left: 8px;
    background: none; border: none; cursor: pointer;
    color: var(--text-muted); font-size: 20px;
    width: 28px; height: 28px; border-radius: 50%;
    display: none;
    align-items: center; justify-content: center;
}
.clear-search.show { display: flex; }
.clear-search:hover { background: var(--bg-muted); color: var(--color-danger-light); }

.search-row select {
    padding: 10px 16px;
    border: 2px solid var(--border-color);
    border-radius: var(--radius-full);
    font-size: var(--font-base); outline: none;
    background: var(--bg-input); cursor: pointer;
    color: var(--text-primary); font-family: inherit;
}
.search-row select:focus { border-color: var(--color-primary); background: var(--bg-card); }

.filter-toggle {
    padding: 10px 20px;
    border: 2px solid var(--border-color);
    border-radius: var(--radius-full);
    background: var(--bg-input); cursor: pointer;
    font-weight: 600; color: var(--text-primary);
    font-family: inherit; font-size: var(--font-base);
    display: inline-flex; align-items: center; gap: 6px;
    transition: all var(--transition-base);
}
.filter-toggle:hover { border-color: var(--color-primary); color: var(--color-primary); }
.filter-toggle.active { background: var(--color-primary); color: #fff; border-color: var(--color-primary); }

.total-info {
    background: var(--bg-badge); padding: 6px 16px;
    border-radius: var(--radius-full);
    font-size: var(--font-base); font-weight: 700; color: var(--text-primary);
    margin-right: auto; white-space: nowrap;
}

.filters-panel {
    display: none; margin-top: var(--space-lg);
    padding-top: var(--space-lg);
    border-top: 2px dashed var(--border-color);
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: var(--space-lg);
}
.filters-panel.open { display: grid; }
.filter-group { display: flex; flex-direction: column; gap: var(--space-sm); }
.filter-group label { font-size: var(--font-base); font-weight: 700; color: var(--text-primary); }
.filter-group .chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
    padding: 6px 14px; border-radius: var(--radius-full);
    border: 2px solid var(--border-color);
    background: var(--bg-input); cursor: pointer;
    font-size: 13px; font-weight: 600; color: var(--text-secondary);
    font-family: inherit;
}
.chip:hover { border-color: var(--color-primary); color: var(--color-primary); }
.chip.active { background: var(--color-primary); color: #fff; border-color: var(--color-primary); }

.range-inputs { display: flex; align-items: center; gap: var(--space-sm); }
.range-inputs input {
    width: 100%; padding: 8px 12px;
    border: 2px solid var(--border-color);
    border-radius: var(--radius-sm);
    font-size: var(--font-base); outline: none;
    background: var(--bg-input); color: var(--text-primary);
    font-family: inherit;
}
.range-inputs input:focus { border-color: var(--color-primary); background: var(--bg-card); }
.range-inputs span { color: var(--text-muted); font-weight: 700; }

.reset-filters {
    padding: 8px 16px; border-radius: var(--radius-full);
    background: var(--color-danger-light); color: #fff;
    border: none; cursor: pointer;
    font-weight: 600; font-family: inherit; font-size: var(--font-base);
    align-self: flex-end;
}
.reset-filters:hover { background: var(--color-danger); }

/* ================================================================
   [06] GRID
   ================================================================ */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
    gap: var(--space-xl);
    min-height: 100px;
}
.sentinel { height: 1px; width: 100%; }

/* ================================================================
   [07] CARD
   ================================================================ */
.card {
    background: var(--bg-card); border-radius: var(--radius-lg);
    padding: var(--space-lg); box-shadow: var(--shadow-md);
    border: 1px solid rgba(0,0,0,0.04);
    display: flex; flex-direction: column;
    position: relative;
    transform: translateY(15px);
    opacity: 0;
    animation: cardFadeIn 0.35s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    contain: layout style paint;
    content-visibility: auto;
    contain-intrinsic-size: auto 380px;
    transition: transform var(--transition-base), box-shadow var(--transition-base);
}
.card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }
.card:focus-within { box-shadow: 0 0 0 3px rgba(41, 128, 185, 0.25), var(--shadow-md); }

@keyframes cardFadeIn {
    from { transform: translateY(15px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
}

.card .product-image-wrap {
    width: 100%; height: 180px;
    background: var(--bg-muted); border-radius: var(--radius-md);
    overflow: hidden; margin-bottom: var(--space-md);
    display: flex; align-items: center; justify-content: center;
    position: relative;
    aspect-ratio: 16 / 10;
}
.card .product-image {
    width: 100%; height: 100%; object-fit: contain;
    display: block;
    transition: transform var(--transition-base);
}
.card:hover .product-image { transform: scale(1.05); }

.card .priority-badge {
    position: absolute; top: 10px; left: 10px;
    background: linear-gradient(135deg, #d97706, #b45309);
    color: #fff; font-size: 11px; font-weight: 800;
    padding: 4px 12px; border-radius: 20px; z-index: 2;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
}

.card .code {
    font-size: var(--font-sm); color: var(--text-secondary);
    direction: ltr; text-align: left;
    background: var(--bg-muted); padding: 4px 12px;
    border-radius: 30px; align-self: flex-start;
    margin-bottom: var(--space-sm); font-weight: 600;
    max-width: 100%; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap;
}

.card-title-btn {
    display: block;
    width: 100%;
    font-size: var(--font-lg); color: var(--text-primary);
    margin-bottom: var(--space-sm); line-height: 1.4;
    min-height: 46px; cursor: pointer;
    font-weight: 700;
    font-family: inherit;
    text-align: right;
    background: none;
    border: none;
    padding: 0;
}
.card-title-btn:hover { color: var(--color-primary); }
.card-title-btn:focus-visible { 
    outline: 2px solid var(--color-primary); 
    outline-offset: 2px;
    border-radius: 4px;
}
.card-title-btn mark {
    background: rgba(41, 128, 185, 0.25);
    color: var(--color-primary-dark);
    padding: 0 2px; border-radius: 3px;
}

.card .prices { display: flex; gap: var(--space-sm); flex-wrap: wrap; margin-bottom: var(--space-sm); }
.card .prices span {
    padding: 5px 12px; border-radius: 30px;
    font-size: 13px; font-weight: 700;
}
.card .prices .cash { color: var(--color-success); background: #d4f5e0; }
.card .prices .inst { color: var(--color-info); background: #d6e9f7; }

.card .qty { font-size: 13px; color: var(--text-secondary); margin-bottom: var(--space-sm); }
.card .qty strong { color: var(--color-warning); font-size: 14px; }
.card .qty strong.low-stock { color: var(--color-danger-light); }

.card .status-badge {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 5px 14px; border-radius: var(--radius-full);
    font-size: 13px; font-weight: 700;
    align-self: flex-start;
}
.card .status-badge.available { background: #d4edda; color: #155724; }
.card .status-badge.unavailable { background: #f8d7da; color: #721c24; }

.card .card-actions {
    display: flex; gap: 6px; margin-top: auto;
    padding-top: var(--space-md);
    border-top: 1px solid var(--bg-muted);
}
.card .card-actions button {
    padding: 8px 10px; border: none;
    border-radius: 30px; cursor: pointer;
    font-size: 13px; font-weight: 700;
    display: inline-flex; align-items: center; justify-content: center;
    gap: 4px; flex: 1; font-family: inherit;
}
.card .card-actions button:active { transform: scale(0.97); }
.card .btn-whatsapp { background: var(--color-whatsapp); color: #fff; flex: 2; }
.card .btn-whatsapp:hover { background: var(--color-whatsapp-dark); }
.card .btn-cart { background: var(--bg-badge); color: var(--text-primary); }
.card .btn-cart:hover { background: var(--color-primary); color: #fff; }
.card .btn-cart.in-cart { background: var(--color-success-light); color: #fff; }
.card .btn-wishlist { 
    background: var(--bg-badge); 
    color: var(--text-secondary); 
    flex: 0.7;
    min-width: 44px;
    position: relative;
}
.card .btn-wishlist:hover { background: #fce7e7; color: var(--color-danger-light); }
.card .btn-wishlist.in-wishlist { background: #fce7e7; color: var(--color-danger-light); }

/* ================================================================
   [08] SKELETON
   ================================================================ */
.skeleton-card {
    background: var(--bg-card); border-radius: var(--radius-lg);
    padding: var(--space-lg); box-shadow: var(--shadow-md);
    border: 1px solid var(--bg-muted);
    min-height: 340px;
    display: flex; flex-direction: column; gap: var(--space-md);
    contain: layout style paint;
}
.skeleton-line {
    position: relative;
    overflow: hidden;
    background: var(--bg-muted);
    border-radius: 10px;
}
.skeleton-line::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, var(--bg-badge), transparent);
    animation: shimmer 1.4s infinite;
}
@keyframes shimmer {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
}
.skeleton-line.img { height: 180px; width: 100%; }
.skeleton-line.title { height: 20px; width: 80%; }
.skeleton-line.price { height: 18px; width: 60%; }
.skeleton-line.qty { height: 16px; width: 40%; }
.skeleton-line.status { height: 20px; width: 50%; }

/* ================================================================
   [09] LOAD MORE
   ================================================================ */
.load-more-area {
    display: flex; justify-content: center; align-items: center;
    padding: var(--space-xl) 0; min-height: 70px;
}
.load-more-btn {
    padding: var(--space-md) var(--space-2xl);
    background: var(--color-primary); color: #fff;
    border: none; border-radius: var(--radius-full);
    font-size: var(--font-md); font-weight: 700;
    cursor: pointer; display: inline-flex; align-items: center; gap: var(--space-sm);
    font-family: inherit;
}
.load-more-btn:hover:not(:disabled) { background: var(--color-primary-dark); }
.load-more-btn:active:not(:disabled) { transform: scale(0.98); }
.load-more-btn:disabled { opacity: 0.6; cursor: wait; }
.spinner {
    display: inline-block; width: 20px; height: 20px;
    border: 3px solid rgba(255,255,255,0.3);
    border-top-color: #fff; border-radius: 50%;
    animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.end-message, .error-box, .no-results {
    text-align: center; padding: var(--space-2xl);
    color: var(--text-muted); grid-column: 1 / -1;
}
.error-box { 
    color: var(--color-danger); 
    background: #f8d7da; 
    border-radius: var(--radius-md);
    border: 1px solid #f1aeb5;
}
.error-box p { margin-bottom: var(--space-md); }
.error-box button {
    padding: 10px 25px;
    background: var(--color-danger-light); color: #fff;
    border: none; border-radius: 30px; cursor: pointer; font-weight: 700;
    font-family: inherit;
}
.error-box button:hover { background: var(--color-danger); }

/* ================================================================
   [10] MODAL
   ================================================================ */
.modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    z-index: var(--z-modal);
    justify-content: center; align-items: center;
    padding: var(--space-xl);
}
.modal-overlay.open { display: flex; }
.modal-box {
    background: var(--bg-card); border-radius: var(--radius-xl);
    max-width: 600px; width: 100%;
    padding: var(--space-2xl);
    max-height: 90vh; overflow-y: auto;
    position: relative; 
    animation: slideUp var(--transition-base);
    scrollbar-gutter: stable;
}
@keyframes slideUp {
    from { transform: translateY(30px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
}
.modal-close {
    position: absolute; top: 12px; left: 18px;
    background: var(--bg-muted); border: none; cursor: pointer;
    color: var(--text-primary); width: 36px; height: 36px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    z-index: 2;
}
.modal-close:hover { background: var(--border-color); }

.modal-image-wrap {
    width: 100%; background: var(--bg-muted);
    border-radius: var(--radius-lg);
    overflow: hidden; margin-bottom: var(--space-lg);
    min-height: 250px; max-height: 450px;
    display: flex; align-items: center; justify-content: center;
    position: relative;
}
.modal-image-wrap.hidden { display: none; }
.modal-image {
    max-width: 100%; max-height: 450px;
    width: auto; height: auto; object-fit: contain;
    display: block;
}
.modal-image-wrap.no-image::after {
    content: 'لا توجد صورة';
    color: var(--text-muted);
    font-size: var(--font-base);
}

.modal-box h2 {
    font-size: var(--font-xl); margin-bottom: var(--space-md);
    color: var(--text-primary); padding-left: 40px;
}
.modal-box .detail-row {
    display: flex; justify-content: space-between;
    padding: 10px 0; border-bottom: 1px solid var(--bg-muted);
    font-size: var(--font-md);
}
.modal-box .detail-row:last-of-type { border-bottom: none; }

.modal-actions { display: flex; gap: var(--space-sm); margin-top: var(--space-xl); flex-wrap: wrap; }
.modal-actions button {

.modal-actions .btn-secondary { background: var(--bg-badge); color: var(--text-primary); }

/* ================================================================
   [11] CART
   ================================================================ */
.cart-overlay {

}
.cart-overlay.open { display: block; }
.cart-sidebar {

}
.cart-sidebar.open { left: 0; }
.cart-header {
    display: flex; justify-content: space-between; align-items: center;
    padding-bottom: var(--space-lg);

}
.cart-header h2 { font-size: var(--font-xl); color: var(--text-primary); }
.cart-header button {
    background: var(--bg-muted); border: none; cursor: pointer;
    color: var(--text-primary); padding: 8px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
}
.cart-header button:hover { background: var(--border-color); }

.cart-type-toggle {
    display: flex; gap: 4px;
    padding: 4px; background: var(--bg-muted);
    border-radius: var(--radius-full);
    margin-bottom: var(--space-md);
}
.cart-type-toggle button {
    flex: 1; padding: 10px 12px;
    border: none; background: transparent;
    border-radius: var(--radius-full);
    font-weight: 700; cursor: pointer;
    color: var(--text-secondary);
    font-family: inherit; font-size: var(--font-base);
}
.cart-type-toggle button.active {
    background: var(--color-primary); color: #fff;
    box-shadow: 0 2px 8px rgba(41,128,185,0.3);
}
.cart-type-toggle button.active[data-type="installment"] {
    background: var(--color-warning-light);
    box-shadow: 0 2px 8px rgba(230,126,34,0.3);
}

.cart-items { flex: 1; overflow-y: auto; margin-bottom: var(--space-md); }
.cart-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: var(--space-md) 0;
    border-bottom: 1px solid var(--bg-muted);
}
.cart-item-info { flex: 1; min-width: 0; }
.cart-item-info h4 {
    font-size: var(--font-base); color: var(--text-primary);
    margin-bottom: 4px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.cart-item-info p { font-size: var(--font-sm); color: var(--text-muted); }
.cart-item-actions { display: flex; align-items: center; gap: 4px; }
.cart-item-actions button {
    width: 28px; height: 28px; border-radius: 50%; border: none;
    background: var(--bg-badge); cursor: pointer; font-weight: bold;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-primary); font-family: inherit;
}
.cart-item-actions button:hover { background: var(--color-primary); color: #fff; }
.cart-item-actions span { min-width: 24px; text-align: center; font-weight: 700; }
.cart-empty { text-align: center; padding: var(--space-2xl) var(--space-lg); color: var(--text-muted); }

.installment-progress {
    padding: var(--space-md);
    background: linear-gradient(135deg, #fef3c7, #fde68a);
    border-radius: var(--radius-md);
    margin-bottom: var(--space-md);
    border: 1px solid #f5d9a0;
}
.installment-progress.hidden { display: none; }
.installment-progress.complete {
    background: linear-gradient(135deg, #d1fae5, #a7f3d0);
    border-color: #6ee7b7;
}
.installment-progress .progress-label {
    font-size: 13px; font-weight: 700;
    display: flex; justify-content: space-between;
    margin-bottom: 6px; color: #78350f;
}
.installment-progress.complete .progress-label { color: #065f46; }
.installment-progress .progress-bar-wrap {
    height: 10px; background: #fff;
    border-radius: 5px; overflow: hidden;
}
.installment-progress .progress-bar-fill {
    height: 100%; 
    background: linear-gradient(90deg, #f59e0b, #d97706);
    transition: width 0.4s ease; border-radius: 5px;
}
.installment-progress.complete .progress-bar-fill {
    background: linear-gradient(90deg, #10b981, #059669);
}
.installment-progress .progress-hint {
    font-size: 12px; margin-top: 8px;
    color: #78350f; font-weight: 600;
}
.installment-progress.complete .progress-hint { color: #065f46; }

.plan-panel {
    padding: var(--space-md);
    background: var(--bg-muted);
    border-radius: var(--radius-md);
    margin-bottom: var(--space-md);
}
.plan-panel.hidden { display: none; }
.plan-panel h4 {
    font-size: var(--font-base); margin-bottom: var(--space-sm);
    color: var(--text-primary);
    display: flex; align-items: center; gap: 6px;
}
.plan-row { display: flex; gap: 8px; margin-bottom: var(--space-md); }
.plan-row button {
    flex: 1; padding: 10px;
    border: 2px solid var(--border-color);
    background: var(--bg-card);
    border-radius: var(--radius-md);
    font-weight: 700; cursor: pointer;
    color: var(--text-secondary);
    font-family: inherit; font-size: var(--font-base);
}
.plan-row button.active {
    background: var(--color-warning-light); color: #fff;
    border-color: var(--color-warning-light);
}
.plan-duration {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: var(--space-sm);
}
.plan-duration input[type="range"] {
    flex: 1; accent-color: var(--color-warning-light);
}
.plan-duration .duration-value {
    min-width: 90px; text-align: center;
    font-weight: 700; color: var(--color-warning);
    font-size: var(--font-md);
}
.plan-summary {
    padding-top: var(--space-sm);
    border-top: 1px dashed var(--border-color);
    font-size: 13px; color: var(--text-secondary);
}
.plan-summary .plan-payment {
    font-size: var(--font-xl); font-weight: 800;
    color: var(--color-success);
}
.plan-error {
    color: var(--color-danger-light); font-size: 12px;
    margin-top: 8px; font-weight: 600;
    min-height: 16px;
}

.cart-total {
    padding-top: var(--space-lg);
    border-top: 2px solid var(--bg-muted);
    display: flex; justify-content: space-between;
    font-size: var(--font-lg); font-weight: 700;
    color: var(--text-primary); margin-bottom: var(--space-md);
}
.cart-checkout {
    width: 100%; padding: var(--space-lg);
    background: var(--color-whatsapp); color: #fff;
    border: none; border-radius: var(--radius-md);
    font-size: var(--font-md); font-weight: 700;
    cursor: pointer; display: flex; align-items: center;
    justify-content: center; gap: var(--space-sm);
    font-family: inherit;
}
.cart-checkout:hover:not(:disabled) { background: var(--color-whatsapp-dark); }
.cart-checkout:disabled { opacity: 0.5; cursor: not-allowed; }

/* ================================================================
   [12] TOAST
   ================================================================ */
.toast-container {
    position: fixed; top: var(--space-xl); right: var(--space-xl);
    z-index: var(--z-toast);
    display: flex; flex-direction: column; gap: var(--space-sm);
    pointer-events: none;
}
.toast {
    pointer-events: auto;
    background: var(--bg-card); padding: var(--space-md) var(--space-lg);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-xl);
    border-right: 4px solid var(--color-primary);
    display: flex; align-items: center; gap: var(--space-sm);
    font-size: var(--font-base); font-weight: 600;
    color: var(--text-primary);
    animation: slideInRight var(--transition-base);
    max-width: 350px;
    transition: opacity var(--transition-base), transform var(--transition-base);
}
.toast.success { border-right-color: var(--color-success-light); }
.toast.error { border-right-color: var(--color-danger-light); }
.toast.warning { border-right-color: var(--color-warning-light); }
@keyframes slideInRight {
    from { transform: translateX(100px); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
}

/* ================================================================
   [12.5] CONFIRM MODAL
   ================================================================ */
.confirm-modal {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    z-index: var(--z-confirm);
    justify-content: center; align-items: center;
    padding: var(--space-xl);
}
.confirm-modal.open { display: flex; }
.confirm-box {
    background: var(--bg-card);
    border-radius: var(--radius-xl);
    padding: 28px;
    max-width: 400px; width: 100%;
    text-align: center;
    animation: slideUp 0.3s ease;
    box-shadow: var(--shadow-xl);
}
.confirm-icon {
    font-size: 48px; margin-bottom: 12px; line-height: 1;
}
.confirm-title {
    font-size: var(--font-xl); margin-bottom: 10px;
    color: var(--text-primary); font-weight: 800;
}
.confirm-message {
    color: var(--text-secondary);
    margin-bottom: 22px;
    font-size: var(--font-base);
    line-height: 1.7;
}
.confirm-actions { display: flex; gap: 10px; }
.confirm-actions button {
    flex: 1; padding: 12px;
    border: none; border-radius: var(--radius-md);
    font-size: var(--font-md); font-weight: 700;
    cursor: pointer; font-family: inherit;
}
.confirm-cancel {
    background: var(--bg-badge); color: var(--text-primary);
}
.confirm-cancel:hover { background: var(--border-color); }
.confirm-ok { background: var(--color-primary); color: #fff; }
.confirm-ok:hover { background: var(--color-primary-dark); }
.confirm-ok.danger { background: var(--color-danger-light); }
.confirm-ok.danger:hover { background: var(--color-danger); }

/* ================================================================
   [13] RESPONSIVE
   ================================================================ */
@media (max-width: 768px) {
    body { padding: var(--space-lg); }
    .header { flex-direction: column; }
    .search-row { flex-direction: column; align-items: stretch; }
    .search-input-wrap { min-width: unset; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: var(--space-md); }
    .cart-sidebar { width: 100%; left: -100%; }
    .toast-container { top: 10px; right: 10px; left: 10px; }
    .toast { max-width: unset; }
    .total-info { margin-right: 0; text-align: center; }
    .card .product-image-wrap { height: 140px; }
    .modal-image-wrap { max-height: 300px; min-height: 180px; }
    .modal-image { max-height: 300px; }
    .confirm-box { padding: 22px; }
    .confirm-icon { font-size: 40px; }
}
@media (max-width: 480px) {
    .grid { grid-template-columns: 1fr; }
    .header-title { font-size: var(--font-xl); }
}
</style>

    IMG_WHITELIST: [

    ]
});

/* ================================================================
   [JS-02] UTILS
   ================================================================ */
const Utils = (function() {
    'use strict';

    // ✅ FIX #68: cache للـ formatter
    const _numberFormatter = new Intl.NumberFormat('ar-EG');
    const _escapeDiv = document.createElement('div');

    function escapeHtml(text) {
        if (text === undefined || text === null) return '';
        // ✅ FIX #68: إعادة استخدام نفس الـ div
        _escapeDiv.textContent = String(text);
        return _escapeDiv.innerHTML;
    }

    function debounce(fn, delay) {
        let timer = null;
        return function(...args) {
            clearTimeout(timer);
            timer = setTimeout(() => fn.apply(this, args), delay);
        };
    }

    function formatNumber(n) {
        // ✅ FIX #77: استخدام formatter مخزّن
        return _numberFormatter.format(Number(n) || 0);
    }

    function toNumber(v, fallback = 0) {
        const n = Number(v);
        return isNaN(n) || !isFinite(n) ? fallback : n;
    }

    function safeGetItem(key, fallback) {
        try {
            const raw = localStorage.getItem(key);
            return raw ? JSON.parse(raw) : fallback;
        } catch (e) { return fallback; }
    }

    function safeSetItem(key, value) {
        try {
            localStorage.setItem(key, JSON.stringify(value));
            return true;
        } catch (e) { return false; }
    }

    function safeRemove(el) {
        if (el && el.parentNode) el.parentNode.removeChild(el);
    }

    function clearElement(el) {
        while (el && el.firstChild) el.removeChild(el.firstChild);
    }

    function highlightText(text, query) {
        if (!query || !text) return escapeHtml(text);
        const escaped = escapeHtml(text);
        const safeQuery = String(query).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const regex = new RegExp(`(${safeQuery})`, 'gi');
        return escaped.replace(regex, '<mark>$1</mark>');
    }

    // ✅ FIX #69: hash أسرع
    function itemsHash(items) {
        if (!Array.isArray(items) || items.length === 0) return 'empty';
        let acc = items.length;
        const len = items.length;
        for (let i = 0; i < len; i++) {
            const it = items[i];
            const part = it.id + '|' + it.cashPrice + '|' + it.installPrice + '|' + it.quantity + '|' + (it.available ? 1 : 0) + '|' + (it.image || '');
            const plen = part.length;
            for (let j = 0; j < plen; j++) {
                acc = ((acc << 5) - acc) + part.charCodeAt(j);
                acc |= 0;
            }
        }
        return len + '_' + Math.abs(acc).toString(36);
    }

    function timeAgo(ms) {
        if (!ms) return '';
        const diff = Date.now() - ms;
        const min = Math.floor(diff / 60000);
        if (min < 1) return 'الآن';
        if (min < 60) return `منذ ${min} دقيقة`;
        const hr = Math.floor(min / 60);
        if (hr < 24) return `منذ ${hr} ساعة`;
        const day = Math.floor(hr / 24);
        return `منذ ${day} يوم`;
    }

    function scheduleIdle(fn, timeout = 100) {
        if ('requestIdleCallback' in window) {
            return requestIdleCallback(fn, { timeout });
        }
        return setTimeout(fn, 0);
    }

    // ✅ FIX #32: تحقق من النطاق المسموح للصور
    function isAllowedImageUrl(url) {
        if (!url || !/^https:\/\//i.test(url)) return false;
        try {
            const host = new URL(url).hostname.toLowerCase();
            return CONFIG.IMG_WHITELIST.some(allowed =>
                host === allowed || host.endsWith('.' + allowed)
            );
        } catch (e) { return false; }
    }

    // ✅ FIX #84: escape لماركداون واتساب
    function escapeWhatsappMarkdown(text) {
        return String(text || '').replace(/([*_~`])/g, '\\$1');
    }

    return {
        escapeHtml, debounce, formatNumber, toNumber,
        safeGetItem, safeSetItem, safeRemove, clearElement,
        highlightText, itemsHash, timeAgo,
        scheduleIdle, isAllowedImageUrl, escapeWhatsappMarkdown
    };
})();

/* ================================================================
   [JS-03] DB - ✅ FIX #53: migration بدل الحذف
   ================================================================ */
const DB = (function() {
    'use strict';
    let dbInstance = null;
    let dbUnavailable = false;
    let initPromise = null;

    function open() {
        if (dbUnavailable) return Promise.reject(new Error('DB unavailable'));
        if (dbInstance) return Promise.resolve(dbInstance);
        if (initPromise) return initPromise;

        initPromise = new Promise((resolve, reject) => {
            if (!('indexedDB' in window)) {
                dbUnavailable = true;
                initPromise = null;
                reject(new Error('IndexedDB غير مدعوم'));
                return;
            }
            let req;
            try {
                req = indexedDB.open(CONFIG.DB_NAME, CONFIG.DB_VERSION);
            } catch (e) {
                dbUnavailable = true;
                initPromise = null;
                reject(e);
                return;
            }

            // ✅ FIX #53: migration حقيقي بدل deleteObjectStore
            req.onupgradeneeded = (e) => {
                const db = e.target.result;
                const oldVersion = e.oldVersion;

                if (!db.objectStoreNames.contains(CONFIG.DB_STORE)) {
                    const store = db.createObjectStore(CONFIG.DB_STORE, { keyPath: 'id' });
                    store.createIndex('name', 'name', { unique: false });
                }
                // migration من v2 إلى v3: أضف index
                if (oldVersion < 3 && db.objectStoreNames.contains(CONFIG.DB_STORE)) {
                    const store = e.target.transaction.objectStore(CONFIG.DB_STORE);
                    if (!store.indexNames.contains('name')) {
                        store.createIndex('name', 'name', { unique: false });
                    }
                }
                if (!db.objectStoreNames.contains(CONFIG.DB_META_STORE)) {
                    db.createObjectStore(CONFIG.DB_META_STORE, { keyPath: 'key' });
                }
            };

            // ✅ FIX #56: onblocked
            req.onblocked = () => {
                console.warn('IndexedDB blocked - أعد تحميل الصفحة');
            };

            req.onsuccess = (e) => {
                dbInstance = e.target.result;
                // ✅ FIX #57: onclose
                dbInstance.onclose = () => { dbInstance = null; initPromise = null; };
                dbInstance.onerror = () => { dbInstance = null; initPromise = null; };
                resolve(dbInstance);
            };
            req.onerror = () => {
                dbUnavailable = true;
                initPromise = null;
                reject(req.error);
            };
        });
        return initPromise;
    }

    async function safeCall(fn, fallback = null) {
        try { return await fn(); }
        catch (e) {
            console.debug('DB op failed:', e && e.message);
            return fallback;
        }
    }

    function saveProducts(items) {
        return safeCall(async () => {
            const db = await open();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(CONFIG.DB_STORE, 'readwrite');
                const store = tx.objectStore(CONFIG.DB_STORE);
                // ✅ FIX #54: clear + put في معاملة واحدة مع مهلة آمنة
                store.clear();
                const len = items.length;
                for (let i = 0; i < len; i++) {
                    const item = items[i];
                    store.put({
                        id: String(item.id),
                        name: String(item.name),
                        cashPrice: Utils.toNumber(item.cashPrice),
                        installPrice: Utils.toNumber(item.installPrice),
                        quantity: Utils.toNumber(item.quantity),
                        available: !!item.available,
                        image: String(item.image || '')
                    });
                }
                tx.oncomplete = () => resolve(len);
                tx.onerror = () => { /* ✅ FIX #55 */ try { tx.abort(); } catch(_) {} reject(tx.error); };
                tx.onabort = () => reject(tx.error || new Error('Transaction aborted'));
            });
        }, 0);
    }

    function getAllProducts() {
        return safeCall(async () => {
            const db = await open();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(CONFIG.DB_STORE, 'readonly');
                const req = tx.objectStore(CONFIG.DB_STORE).getAll();
                req.onsuccess = () => resolve(req.result || []);
                req.onerror = () => reject(req.error);
            });
        }, []);
    }

    function setMeta(key, value) {
        return safeCall(async () => {
            const db = await open();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(CONFIG.DB_META_STORE, 'readwrite');
                tx.objectStore(CONFIG.DB_META_STORE).put({ key, value });
                tx.oncomplete = () => resolve();
                tx.onerror = () => reject(tx.error);
            });
        });
    }

    function getMeta(key) {
        return safeCall(async () => {
            const db = await open();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(CONFIG.DB_META_STORE, 'readonly');
                const req = tx.objectStore(CONFIG.DB_META_STORE).get(key);
                req.onsuccess = () => resolve(req.result ? req.result.value : null);
                req.onerror = () => reject(req.error);
            });
        }, null);
    }

    return { saveProducts, getAllProducts, setMeta, getMeta };
})();

/* ================================================================

const State = (function() {

/* ================================================================
   [JS-05] TOAST
   ================================================================ */
const Toast = (function() {
    'use strict';
    const container = document.getElementById('toastContainer');

    function show(message, type = 'success', duration = 3000) {
        if (!container) return;
        while (container.children.length >= CONFIG.MAX_TOASTS) {
            container.removeChild(container.firstChild);
        }
        const toast = document.createElement('div');
        toast.className = 'toast ' + type;
        toast.setAttribute('role', 'status');
        toast.textContent = message;
        container.appendChild(toast);
        setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transform = 'translateX(100px)';
            // ✅ FIX #93: انتظر transitionend
            const cleanup = () => Utils.safeRemove(toast);
            toast.addEventListener('transitionend', cleanup, { once: true });
            setTimeout(cleanup, 400); // fallback
        }, duration);
    }
    return { show };
})();

/* ================================================================
   [JS-06] CONNECTION
   ================================================================ */
const Connection = (function() {
    'use strict';
    const banner = document.getElementById('connectionBanner');
    let wasOffline = false;
    let bannerTimer = null;

    function setBanner(text, cls, autoHideMs) {
        if (!banner || !banner.parentNode) return;
        if (bannerTimer) clearTimeout(bannerTimer);
        banner.textContent = text;
        banner.className = 'connection-banner show ' + cls;
        if (autoHideMs) {
            bannerTimer = setTimeout(() => { banner.className = 'connection-banner'; }, autoHideMs);
        }
    }

    function update() {
        const state = State.get();
        state.isOffline = !navigator.onLine;
        if (state.isOffline) {
            setBanner('⚠️ أنت غير متصل بالإنترنت - يتم عرض البيانات المخزنة', 'offline');
            wasOffline = true;
        } else if (wasOffline) {
            setBanner('🔄 جاري مزامنة البيانات...', 'syncing');
            wasOffline = false;
            if (window.App && window.App.refreshFromServer) {
                // ✅ FIX #65: await
                window.App.refreshFromServer().then(res => {
                    if (res && res.success) setBanner('✅ تم تحديث البيانات بنجاح', 'success', 2500);
                    else setBanner('⚠️ تعذر التحديث - يتم عرض البيانات المخزنة', 'error', 4000);
                }).catch(() => setBanner('⚠️ تعذر التحديث', 'error', 4000));
            }
        } else {
            banner.className = 'connection-banner';
        }
    }

    window.addEventListener('online', update);
    window.addEventListener('offline', update);
    return { update, setBanner };
})();

/* ================================================================
   [JS-06.5] CONFIRM - ✅ FIX #92: قائمة Promise
   ================================================================ */
const Confirm = (function() {
    'use strict';
    const modal = document.getElementById('confirmModal');
    const iconEl = document.getElementById('confirmIcon');
    const titleEl = document.getElementById('confirmTitle');
    const msgEl = document.getElementById('confirmMessage');
    const okBtn = document.getElementById('confirmOk');
    const cancelBtn = document.getElementById('confirmCancel');
    let activeResolver = null;
    let lastFocused = null;

    function trapFocus(e) {
        if (e.key !== 'Tab') return;
        const focusable = [okBtn, cancelBtn];
        const first = focusable[0];
        const last = focusable[focusable.length - 1];
        if (e.shiftKey && document.activeElement === first) {
            e.preventDefault(); last.focus();
        } else if (!e.shiftKey && document.activeElement === last) {
            e.preventDefault(); first.focus();
        }
    }

    function ask(title, message, options) {
        options = options || {};
        return new Promise((resolve) => {
            // ✅ FIX #92: أغلق أي confirm سابق
            if (activeResolver) {
                activeResolver(false);
                activeResolver = null;
            }
            activeResolver = resolve;
            lastFocused = document.activeElement;
            iconEl.textContent = options.icon || '⚠️';
            titleEl.textContent = title;
            msgEl.textContent = message;
            okBtn.textContent = options.okLabel || 'تأكيد';
            okBtn.className = 'confirm-ok' + (options.danger ? ' danger' : '');
            modal.classList.add('open');
            modal.setAttribute('aria-hidden', 'false');
            modal.addEventListener('keydown', trapFocus);
            setTimeout(() => okBtn.focus(), 50);
        });
    }

    function close(result) {
        modal.classList.remove('open');
        modal.setAttribute('aria-hidden', 'true');
        modal.removeEventListener('keydown', trapFocus);
        if (activeResolver) {
            activeResolver(result);
            activeResolver = null;
        }
        if (lastFocused && lastFocused.focus) lastFocused.focus();
    }

    okBtn.addEventListener('click', () => close(true));
    cancelBtn.addEventListener('click', () => close(false));
    modal.addEventListener('click', (e) => { if (e.target === modal) close(false); });
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && modal.classList.contains('open')) close(false);
    });

    return { ask };
})();

/* ================================================================
   [JS-07] WISHLIST - ✅ FIX #88: حد أقصى + #89: re-sync
   ================================================================ */
const Wishlist = (function() {
    'use strict';
    function getAll() { return Utils.safeGetItem(CONFIG.WISHLIST_KEY, []); }
    function save(items) {
        if (items.length > CONFIG.WISHLIST_MAX) {
            items = items.slice(0, CONFIG.WISHLIST_MAX);
        }
        Utils.safeSetItem(CONFIG.WISHLIST_KEY, items);
        updateBadge();
    }
    function isIn(id) { return getAll().some(i => String(i.id) === String(id)); }
    function toggle(item) {
        const list = getAll();
        const idx = list.findIndex(i => String(i.id) === String(item.id));
        let added;
        if (idx > -1) { list.splice(idx, 1); added = false; }
        else {
            if (list.length >= CONFIG.WISHLIST_MAX) {
                Toast.show(`الحد الأقصى ${CONFIG.WISHLIST_MAX} منتج`, 'warning');
                return false;
            }
            list.push({
                id: String(item.id), name: String(item.name),
                cashPrice: Utils.toNumber(item.cashPrice),
                installPrice: Utils.toNumber(item.installPrice),
                quantity: Utils.toNumber(item.quantity),
                image: String(item.image || '')
            });
            added = true;
        }
        save(list);
        return added;
    }
    // ✅ FIX #89: re-sync مع البيانات الحديثة
    function resync(allItems) {
        const list = getAll();
        const map = new Map(allItems.map(i => [String(i.id), i]));
        let changed = false;
        const fresh = list.map(w => {
            const curr = map.get(String(w.id));
            if (!curr) return w;
            if (curr.name !== w.name || curr.cashPrice !== w.cashPrice || curr.installPrice !== w.installPrice) {
                changed = true;
                return { ...w, name: curr.name, cashPrice: curr.cashPrice, installPrice: curr.installPrice, quantity: curr.quantity };
            }
            return w;
        });
        if (changed) save(fresh);
    }
    function updateBadge() {
        const el = document.getElementById('wishlistCount');
        if (el) {
            const count = getAll().length;
            el.textContent = count;
            el.setAttribute('aria-label', `عدد المنتجات في المفضلة: ${count}`);
        }
    }
    return { getAll, isIn, toggle, updateBadge, resync };
})();

/* ================================================================
   [JS-08] CART - 🔥 FIX #1 (audit): حساب السعر حسب نوع الدفع
   ================================================================ */
const Cart = (function() {
    'use strict';

    const MIN_TOTAL = CONFIG.INSTALLMENT_MIN_TOTAL;
    const MIN_DAILY = CONFIG.INSTALLMENT_MIN_DAILY;
    const MIN_MONTHLY = CONFIG.INSTALLMENT_MIN_MONTHLY;
    const MAX_DAYS = CONFIG.INSTALLMENT_MAX_DAYS;
    const MAX_MONTHS = CONFIG.INSTALLMENT_MAX_MONTHS;

    function getAll() { return Utils.safeGetItem(CONFIG.CART_KEY, []); }

    function getType() {
        const t = Utils.safeGetItem(CONFIG.CART_TYPE_KEY, 'cash');
        return (t === 'installment') ? 'installment' : 'cash';
    }

    function getPlan() {
        const p = Utils.safeGetItem(CONFIG.CART_PLAN_KEY, { frequency: 'daily', duration: 30 });
        // ✅ FIX #83: duration >= 1
        if (!p.duration || p.duration < 1) p.duration = 1;
        return p;
    }

    function save(items) {
        Utils.safeSetItem(CONFIG.CART_KEY, items);
        updateBadge();
        render();
    }

    function setType(type) {
        if (type !== 'cash' && type !== 'installment') return;
        Utils.safeSetItem(CONFIG.CART_TYPE_KEY, type);
        render();
    }

    function setPlan(plan) {
        Utils.safeSetItem(CONFIG.CART_PLAN_KEY, plan);
        render();
    }

    function isIn(id) { return getAll().some(i => String(i.id) === String(id)); }

    function add(item) {
        if (!item.available) {
            Toast.show('هذا المنتج غير متوفر حالياً', 'warning');
            return false;
        }
        const list = getAll();
        const existing = list.find(i => String(i.id) === String(item.id));
        if (existing) {
            // ✅ FIX #80: item.quantity قد تكون 0
            const maxQty = Math.max(1, Utils.toNumber(item.quantity));
            if (existing.quantity >= maxQty) {
                Toast.show('الكمية المطلوبة غير متوفرة', 'warning');
                return false;
            }
            existing.quantity = Utils.toNumber(existing.quantity) + 1;
        } else {
            list.push({
                id: String(item.id), name: String(item.name),
                cashPrice: Utils.toNumber(item.cashPrice),
                installPrice: Utils.toNumber(item.installPrice),
                quantity: 1,
                maxQuantity: Math.max(1, Utils.toNumber(item.quantity)),
                image: String(item.image || '')
            });
        }
        save(list);
        return true;
    }

    function remove(id) {
        save(getAll().filter(i => String(i.id) !== String(id)));
    }

    function toggle(item) {
        if (isIn(item.id)) { remove(item.id); return false; }
        return add(item);
    }

    function changeQty(id, delta) {
        const list = getAll();
        const item = list.find(i => String(i.id) === String(id));
        if (!item) return;
        const newQty = Utils.toNumber(item.quantity) + delta;
        if (newQty < 1) return;
        // ✅ FIX #81: maxQuantity قد تكون 0
        if (item.maxQuantity != null && newQty > item.maxQuantity) {
            Toast.show('لا يمكن تجاوز الكمية المتاحة', 'warning');
            return;
        }
        item.quantity = newQty;
        save(list);
    }

    // 🔥 FIX #1 (audit): حساب حسب نوع الدفع
    function getSubtotal() {
        const type = getType();
        const priceField = (type === 'installment') ? 'installPrice' : 'cashPrice';
        return getAll().reduce(
            (sum, i) => sum + (Utils.toNumber(i[priceField]) * Utils.toNumber(i.quantity)),
            0
        );
    }

    // 🔥 FIX: subtotal للعرض (كاش دائماً) + total للطباعة
    function getCashSubtotal() {
        return getAll().reduce(
            (sum, i) => sum + (Utils.toNumber(i.cashPrice) * Utils.toNumber(i.quantity)),
            0
        );
    }

    function getInstallSubtotal() {
        return getAll().reduce(
            (sum, i) => sum + (Utils.toNumber(i.installPrice) * Utils.toNumber(i.quantity)),
            0
        );
    }

    function calculatePlan() {
        // 🔥 FIX #1: استخدم سعر القسط
        const subtotal = getInstallSubtotal();
        const plan = getPlan();
        const frequency = plan.frequency;
        const minPayment = frequency === 'daily' ? MIN_DAILY : MIN_MONTHLY;

        const absoluteMax = frequency === 'daily' ? MAX_DAYS : MAX_MONTHS;
        const byBudget = minPayment > 0 ? Math.floor(subtotal / minPayment) : 1;
        const safeMaxDuration = Math.max(1, Math.min(absoluteMax, byBudget));
        const reachedMaxLimit = byBudget >= absoluteMax;

        const duration = Math.min(Math.max(1, plan.duration || 1), safeMaxDuration);
        // ✅ FIX #82: قسمة آمنة
        const payment = (subtotal > 0 && duration > 0) ? (subtotal / duration) : 0;

        return {
            subtotal: subtotal,
            frequency: frequency,
            minPayment: minPayment,
            absoluteMax: absoluteMax,
            maxDuration: safeMaxDuration,
            reachedMaxLimit: reachedMaxLimit,
            duration: duration,
            payment: payment,
            meetsMinimum: subtotal >= MIN_TOTAL
        };
    }

    function updateBadge() {
        const el = document.getElementById('cartCount');
        if (el) {
            const count = getAll().length;
            el.textContent = count;
            el.setAttribute('aria-label', `عدد المنتجات في السلة: ${count}`);
        }
    }

    function render() {
        const container = document.getElementById('cartItems');
        const totalEl = document.getElementById('cartTotalPrice');
        const checkoutBtn = document.getElementById('cartCheckout');
        const typeToggle = document.getElementById('cartTypeToggle');
        const progressEl = document.getElementById('installmentProgress');
        const planPanel = document.getElementById('planPanel');

        if (!container) return;

        const list = getAll();
        Utils.clearElement(container);

        if (list.length === 0) {
            const empty = document.createElement('div');
            empty.className = 'cart-empty';
            empty.textContent = 'السلة فارغة';
            container.appendChild(empty);
            if (totalEl) totalEl.textContent = '0 ج.م';
            if (checkoutBtn) checkoutBtn.disabled = true;
            if (progressEl) progressEl.classList.add('hidden');
            if (planPanel) planPanel.classList.add('hidden');
            return;
        }

        const type = getType();

        list.forEach(item => {
            const div = document.createElement('div');
            div.className = 'cart-item';

            const info = document.createElement('div');
            info.className = 'cart-item-info';
            const h4 = document.createElement('h4');
            h4.textContent = item.name;
            const p = document.createElement('p');
            // 🔥 FIX #1: عرض السعر المناسب
            const priceShown = type === 'installment' ? item.installPrice : item.cashPrice;
            const priceLabel = type === 'installment' ? 'قسط' : 'كاش';
            p.textContent = `${Utils.formatNumber(priceShown)} ج.م ${priceLabel} × ${item.quantity}`;
            info.appendChild(h4);
            info.appendChild(p);

            const actions = document.createElement('div');
            actions.className = 'cart-item-actions';

            const minusBtn = document.createElement('button');
            minusBtn.type = 'button';
            minusBtn.textContent = '−';
            minusBtn.setAttribute('aria-label', `إنقاص كمية ${item.name}`);
            minusBtn.addEventListener('click', () => changeQty(item.id, -1));

            const qtySpan = document.createElement('span');
            qtySpan.textContent = item.quantity;
            qtySpan.setAttribute('aria-live', 'polite');

            const plusBtn = document.createElement('button');
            plusBtn.type = 'button';
            plusBtn.textContent = '+';
            plusBtn.setAttribute('aria-label', `زيادة كمية ${item.name}`);
            plusBtn.addEventListener('click', () => changeQty(item.id, 1));

            const removeBtn = document.createElement('button');
            removeBtn.type = 'button';
            removeBtn.textContent = '×';
            removeBtn.style.background = '#fce7e7';
            removeBtn.style.color = 'var(--color-danger-light)';
            removeBtn.setAttribute('aria-label', `حذف ${item.name} من السلة`);
            removeBtn.addEventListener('click', () => remove(item.id));

            actions.appendChild(minusBtn);
            actions.appendChild(qtySpan);
            actions.appendChild(plusBtn);
            actions.appendChild(removeBtn);

            div.appendChild(info);
            div.appendChild(actions);
            container.appendChild(div);
        });

        if (typeToggle) {
            typeToggle.querySelectorAll('button').forEach(btn => {
                const isActive = btn.dataset.type === type;
                btn.classList.toggle('active', isActive);
                btn.setAttribute('aria-checked', isActive ? 'true' : 'false');
            });
        }

        // 🔥 FIX #1: subtotal حسب النوع
        const subtotal = getSubtotal();
        if (totalEl) totalEl.textContent = `${Utils.formatNumber(subtotal)} ج.م`;

        if (type === 'installment' && list.length > 0) {
            if (progressEl) {
                progressEl.classList.remove('hidden');
                // 🔥 FIX: استخدم installSubtotal للتحقق من الحد الأدنى
                const installTotal = getInstallSubtotal();
                const pct = Math.min(100, (installTotal / MIN_TOTAL) * 100);
                const complete = installTotal >= MIN_TOTAL;
                progressEl.classList.toggle('complete', complete);
                progressEl.setAttribute('aria-valuenow', Math.round(pct));
                progressEl.setAttribute('aria-valuemax', '100');
                const amountEl = document.getElementById('progressAmount');
                const fillEl = document.getElementById('progressFill');
                const hintEl = document.getElementById('progressHint');
                if (amountEl) amountEl.textContent = `${Utils.formatNumber(Math.round(installTotal))} / ${Utils.formatNumber(MIN_TOTAL)} ج.م`;
                if (fillEl) fillEl.style.width = pct + '%';
                if (hintEl) {
                    if (complete) hintEl.textContent = '✓ وصلت للحد الأدنى - يمكنك اختيار خطة التقسيط';
                    else hintEl.textContent = `أضف ${Utils.formatNumber(Math.ceil(MIN_TOTAL - installTotal))} ج.م للوصول للحد الأدنى`;
                }
            }

            if (planPanel) {
                const installTotal = getInstallSubtotal();
                if (installTotal >= MIN_TOTAL) {
                    planPanel.classList.remove('hidden');
                    renderPlan();
                } else {
                    planPanel.classList.add('hidden');
                }
            }

            const installTotal = getInstallSubtotal();
            if (checkoutBtn) checkoutBtn.disabled = installTotal < MIN_TOTAL;

        } else {
            if (progressEl) progressEl.classList.add('hidden');
            if (planPanel) planPanel.classList.add('hidden');
            if (checkoutBtn) checkoutBtn.disabled = list.length === 0;
        }
    }

    function renderPlan() {
        const calc = calculatePlan();
        const freq = calc.frequency;

        const freqContainer = document.getElementById('planFrequency');
        if (freqContainer) {
            freqContainer.querySelectorAll('button').forEach(btn => {
                const isActive = btn.dataset.freq === freq;
                btn.classList.toggle('active', isActive);
                btn.setAttribute('aria-checked', isActive ? 'true' : 'false');
            });
        }

        const durationSlider = document.getElementById('planDuration');
        const durationValue = document.getElementById('planDurationValue');
        const periodLabel = document.getElementById('planPeriodLabel');
        const paymentEl = document.getElementById('planPayment');
        const errorEl = document.getElementById('planError');

        if (durationSlider) {
            durationSlider.min = '1';
            durationSlider.max = String(calc.maxDuration);
            durationSlider.value = String(calc.duration);
        }
        if (durationValue) {
            const suffix = freq === 'daily' ? 'يوم' : 'شهر';
            let text = `${calc.duration} ${suffix}`;
            if (calc.duration >= calc.absoluteMax) text += ' (الأقصى)';
            durationValue.textContent = text;
        }
        if (periodLabel) {
            periodLabel.textContent = freq === 'daily' ? 'يوم' : 'شهر';
        }
        if (paymentEl) {
            paymentEl.textContent = Utils.formatNumber(Math.round(calc.payment));
        }
        if (errorEl) {
            if (calc.reachedMaxLimit && calc.duration >= calc.absoluteMax) {
                errorEl.textContent = `وصلت للحد الأقصى (${calc.absoluteMax} ${freq === 'daily' ? 'يوم' : 'شهر'})`;
                errorEl.style.color = 'var(--color-warning-light)';
            } else if (calc.payment < calc.minPayment) {
                errorEl.textContent = `الحد الأدنى للقسط ${freq === 'daily' ? 'اليومي' : 'الشهري'} هو ${Utils.formatNumber(calc.minPayment)} ج.م`;
                errorEl.style.color = 'var(--color-danger-light)';
            } else {
                errorEl.textContent = '';
                errorEl.style.color = '';
            }
        }
    }

    function setFrequency(freq) {
        const plan = getPlan();
        plan.frequency = freq === 'monthly' ? 'monthly' : 'daily';
        const subtotal = getInstallSubtotal();
        const minPayment = plan.frequency === 'daily' ? MIN_DAILY : MIN_MONTHLY;
        const absoluteMax = plan.frequency === 'daily' ? MAX_DAYS : MAX_MONTHS;
        const byBudget = Math.max(1, Math.floor(subtotal / minPayment));
        const safeMax = Math.min(absoluteMax, byBudget);
        // ✅ FIX #83: min 1
        plan.duration = Math.max(1, Math.min(plan.duration || safeMax, safeMax));
        setPlan(plan);
    }

    function setDuration(duration) {
        const plan = getPlan();
        plan.duration = Math.max(1, parseInt(duration, 10) || 1);
        setPlan(plan);
    }

    // 🔥 FIX #84: escape + #1: أسعار صحيحة
    function buildOrderMessage() {
        const list = getAll();
        if (list.length === 0) return '';
        const type = getType();
        const calc = calculatePlan();

        let msg = `*${CONFIG.APP_NAME}*\n`;
        msg += 'مرحباً، أرغب في طلب المنتجات التالية:\n\n';

        let total = 0;
        list.forEach((item, i) => {
            const qty = Utils.toNumber(item.quantity) || 1;
            // 🔥 FIX #1: السعر المناسب حسب النوع
            const price = type === 'installment' ? Utils.toNumber(item.installPrice) : Utils.toNumber(item.cashPrice);
            total += price * qty;
            const safeName = Utils.escapeWhatsappMarkdown(item.name);
            msg += `${i + 1}. ${safeName}\n`;
            msg += `   الكود: ${item.id}\n`;
            msg += `   السعر: ${price} ج.م\n`;
            msg += `   الكمية: ${qty}\n\n`;
        });

        msg += `المجموع: ${total} ج.م\n`;

        if (type === 'installment' && calc.meetsMinimum) {
            const freqLabel = calc.frequency === 'daily' ? 'يومي' : 'شهري';
            const periodLabel = calc.frequency === 'daily' ? 'يوم' : 'شهر';
            msg += `\n*خطة التقسيط:*\n`;
            msg += `- النوع: ${freqLabel}\n`;
            msg += `- المدة: ${calc.duration} ${periodLabel}\n`;
            msg += `- القسط: ${Math.round(calc.payment)} ج.م / ${periodLabel}\n`;
        } else {
            msg += `\n*نوع الدفع:* كاش`;
        }

        // ✅ FIX #85: حد لحجم الرسالة
        if (msg.length > 60000) {
            msg = msg.substring(0, 60000) + '\n...(اقتُطع)';
        }

        return msg;
    }

    return {
        getAll, isIn, add, remove, toggle, changeQty,
        getSubtotal, getCashSubtotal, getInstallSubtotal,
        updateBadge, render,
        getType, setType, getPlan, setPlan,
        setFrequency, setDuration,
        calculatePlan, buildOrderMessage
    };
})();

/* ================================================================
   [JS-09] WHATSAPP - 🔥 FIX #2 (audit): خيار الكاش/القسط للطلب المباشر
   ================================================================ */
const WhatsApp = (function() {
    'use strict';

    // ✅ FIX #86: تحقق من رقم الهاتف
    function isValidPhone(phone) {
        return /^[1-9]\d{7,14}$/.test(String(phone || ''));
    }

    // ✅ FIX #87: noopener
    function openUrl(url) {
        window.open(url, '_blank', 'noopener,noreferrer');
    }

    function buildSingle(item, payType) {
        const type = payType || 'cash';
        const price = type === 'installment' ? item.installPrice : item.cashPrice;
        const typeLabel = type === 'installment' ? 'تقسيط' : 'كاش';
        const safeName = Utils.escapeWhatsappMarkdown(item.name);

        let msg = `*${CONFIG.APP_NAME}*\n`;
        msg += 'مرحباً، أرغب في طلب المنتج التالي:\n\n';
        msg += `${safeName}\n`;
        msg += `الكود: ${item.id}\n`;
        msg += `نوع الدفع: ${typeLabel}\n`;
        msg += `السعر: ${price} ج.م\n`;
        return msg;
    }

    // 🔥 FIX #2: تمرير نوع الدفع
    function orderSingle(item, payType) {
        if (!isValidPhone(CONFIG.WHATSAPP_PHONE)) {
            Toast.show('رقم واتساب غير صالح', 'error');
            return;
        }
        const msg = buildSingle(item, payType);
        const url = `https://wa.me/${CONFIG.WHATSAPP_PHONE}?text=${encodeURIComponent(msg)}`;
        openUrl(url);
    }

    function orderCart() {
        if (!isValidPhone(CONFIG.WHATSAPP_PHONE)) {
            Toast.show('رقم واتساب غير صالح', 'error');
            return;
        }
        const msg = Cart.buildOrderMessage();
        if (!msg) {
            Toast.show('لا توجد منتجات', 'warning');
            return;
        }
        const url = `https://wa.me/${CONFIG.WHATSAPP_PHONE}?text=${encodeURIComponent(msg)}`;
        openUrl(url);
    }

    return { order: orderSingle, orderCart };
})();

/* ================================================================
   [JS-10] API - ✅ FIX #59-67, #4: pagination + success check
   ================================================================ */
const Api = (function() {
    'use strict';

    function buildUrl(offset, limit) {
        const params = new URLSearchParams({
            action: 'getMenu',
            offset: String(offset),
            limit: String(limit)
        });
        return `${CONFIG.API_URL}?${params.toString()}`;
    }

    function normalize(item) {
        return {
            id: String(item.id || '').trim(),
            name: String(item.name || '').trim(),
            cashPrice: Utils.toNumber(item.cashPrice),
            installPrice: Utils.toNumber(item.installPrice),
            quantity: Utils.toNumber(item.quantity),
            available: item.available === true || item.available === 'true' || item.available === 'متوفر',
            image: Utils.isAllowedImageUrl(item.image) ? String(item.image) : ''
        };
    }

    async function fetchPage(offset, limit, signal) {
        const timeoutController = new AbortController();
        const timeoutId = setTimeout(() => timeoutController.abort(), CONFIG.FETCH_TIMEOUT);
        const onAbort = () => { try { timeoutController.abort(); } catch(_) {} };
        // ✅ FIX #60: once
        if (signal) signal.addEventListener('abort', onAbort, { once: true });

        let res;
        try {
            res = await fetch(buildUrl(offset, limit), {
                signal: timeoutController.signal,
                headers: { 'Accept': 'application/json' }
            });
        } catch (e) {
            clearTimeout(timeoutId);
            if (signal) signal.removeEventListener('abort', onAbort);
            if (e.name === 'AbortError') {
                if (signal && signal.aborted) throw e;
                throw new Error('TIMEOUT:انتهت مهلة الاتصال');
            }
            throw new Error('NETWORK:' + e.message);
        }
        clearTimeout(timeoutId);
        if (signal) signal.removeEventListener('abort', onAbort);

        if (!res.ok) throw new Error('HTTP:خطأ في السيرفر (' + res.status + ')');

        const text = await res.text();
        const trimmed = text.trim();
        if (trimmed.startsWith('<')) {
            throw new Error('FORMAT:السيرفر أعاد صفحة HTML بدل بيانات');
        }

        let result;
        try { result = JSON.parse(text); }
        catch (e) { throw new Error('FORMAT:البيانات غير صالحة'); }

        // ✅ FIX #59: فحص success === false
        if (result.success === false) {
            throw new Error('SERVER:' + (result.error || 'خطأ غير معروف'));
        }
        if (result.error) throw new Error('SERVER:' + result.error);

        return {
            items: (result.data || []).map(normalize),
            total: result.total || 0,
            fromCache: result.fromCache || false,
            lastUpdate: String(result.lastUpdate || '')
        };
    }

    // ✅ FIX #4 (audit): pagination كامل
    async function fetchAll(signal) {
        const allItems = [];
        let offset = 0;
        let total = 0;
        let lastUpdate = '';
        let fromCache = false;
        let pageCount = 0;

        while (pageCount < CONFIG.API_MAX_PAGES) {
            if (signal && signal.aborted) throw new DOMException('Aborted', 'AbortError');
            const page = await fetchPage(offset, CONFIG.API_PAGE_SIZE, signal);
            if (page.lastUpdate) lastUpdate = page.lastUpdate;
            fromCache = page.fromCache;
            if (pageCount === 0) total = page.total;

            allItems.push(...page.items);
            pageCount++;

            // إذا استرجعنا أقل من الصفحة، انتهى
            if (page.items.length < CONFIG.API_PAGE_SIZE) break;
            // إذا وصلنا العدد الإجمالي
            if (allItems.length >= total && total > 0) break;

            offset += CONFIG.API_PAGE_SIZE;
        }

        return {
            items: allItems,
            total: total || allItems.length,
            fromCache: fromCache,
            lastUpdate: lastUpdate,
            pages: pageCount
        };
    }

    return { fetchAll };
})();

/* ================================================================
   [JS-11] FILTER & SORT
   ================================================================ */
const FilterSort = (function() {
    'use strict';

    function apply(items, filters, sort, order) {
        let result = items.slice();

        if (filters.search) {
            const q = filters.search.toLowerCase().trim();
            result = result.filter(i =>
                i.id.toLowerCase().includes(q) ||
                i.name.toLowerCase().includes(q)
            );
        }
        if (filters.availability === 'available') result = result.filter(i => i.available);
        else if (filters.availability === 'unavailable') result = result.filter(i => !i.available);
        if (filters.priceMin != null) result = result.filter(i => i.cashPrice >= filters.priceMin);
        if (filters.priceMax != null) result = result.filter(i => i.cashPrice <= filters.priceMax);
        if (filters.qtyMin != null) result = result.filter(i => i.quantity >= filters.qtyMin);
        if (filters.qtyMax != null) result = result.filter(i => i.quantity <= filters.qtyMax);
        if (filters.lowStockOnly) result = result.filter(i => i.available && i.quantity <= CONFIG.LOW_STOCK_THRESHOLD);

        return sortItems(result, sort, order);
    }

    function sortItems(items, sort, order) {
        const dir = order === 'asc' ? 1 : -1;
        return items.sort((a, b) => {
            if (sort === 'priority') {
                const availA = a.available ? 0 : 1;
                const availB = b.available ? 0 : 1;
                if (availA !== availB) return (availA - availB) * dir;
                if (b.quantity !== a.quantity) return (b.quantity - a.quantity) * dir;
                return a.name.localeCompare(b.name, 'ar');
            }
            let va = a[sort], vb = b[sort];
            if (typeof va === 'string' && typeof vb === 'string') {
                return va.localeCompare(vb, 'ar') * dir;
            }
            va = Number(va) || 0; vb = Number(vb) || 0;
            if (va < vb) return -1 * dir;
            if (va > vb) return 1 * dir;
            return 0;
        });
    }

    return { apply };
})();
