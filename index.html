<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="كتالوج منتجات - يعمل أوفلاين">
<meta name="theme-color" content="#3498db">
<title>كتالوج المنتجات</title>

<style>
/* ================================================================
   [01] VARIABLES - المتغيرات العامة
   ================================================================ */
:root {
    --color-primary: #3498db;
    --color-primary-dark: #2980b9;
    --color-success: #27ae60;
    --color-danger: #e74c3c;
    --color-warning: #e67e22;
    --color-whatsapp: #25D366;
    --color-whatsapp-dark: #1da851;
    --color-info: #2980b9;

    --bg-main: #f0f4f9;
    --bg-card: #ffffff;
    --bg-input: #f8fafc;
    --bg-muted: #f0f2f5;
    --bg-badge: #e9edf2;

    --text-primary: #1a2634;
    --text-secondary: #555;
    --text-muted: #95a5a6;

    --border-color: #e9edf2;
    --border-hover: #3498db;

    --shadow-sm: 0 2px 10px rgba(0,0,0,0.04);
    --shadow-md: 0 4px 15px rgba(0,0,0,0.04);
    --shadow-lg: 0 10px 25px rgba(0,0,0,0.08);
    --shadow-xl: 0 10px 30px rgba(0,0,0,0.15);

    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --radius-xl: 20px;
    --radius-full: 40px;

    --space-xs: 4px; --space-sm: 8px; --space-md: 12px;
    --space-lg: 16px; --space-xl: 24px; --space-2xl: 32px;

    --font-sm: 12px; --font-base: 14px; --font-md: 15px;
    --font-lg: 17px; --font-xl: 20px; --font-2xl: 24px;

    --transition-fast: 0.2s ease;
    --transition-base: 0.3s ease;

    --z-modal: 9999; --z-cart: 9999; --z-toast: 10001;
}

@media (prefers-color-scheme: dark) {
    :root {
        --bg-main: #1a1d23;
        --bg-card: #2d3139;
        --bg-input: #363b44;
        --bg-muted: #3d424b;
        --bg-badge: #3d424b;
        --text-primary: #f1f5f9;
        --text-secondary: #a0aec0;
        --text-muted: #718096;
        --border-color: #4a5568;
    }
}

/* ================================================================
   [02] BASE - الأساسيات
   ================================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }

body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: var(--bg-main);
    color: var(--text-primary);
    padding: var(--space-xl);
    min-height: 100vh;
    line-height: 1.5;
    transition: background var(--transition-base), color var(--transition-base);
}

.skip-link {
    position: absolute; top: -100px; left: 50%;
    transform: translateX(-50%);
    background: var(--color-primary); color: #fff;
    padding: var(--space-md) var(--space-xl);
    border-radius: var(--radius-sm);
    z-index: var(--z-toast);
    text-decoration: none;
    transition: top var(--transition-fast);
}
.skip-link:focus { top: 10px; }

:focus-visible { outline: 3px solid var(--color-primary); outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
    }
}

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

.container { max-width: 1400px; margin: auto; }

/* ================================================================
   [03] CONNECTION BANNER - مؤشر الاتصال
   ================================================================ */
.connection-banner {
    display: none;
    padding: var(--space-md) var(--space-lg);
    border-radius: var(--radius-md);
    margin-bottom: var(--space-lg);
    font-weight: 600;
    text-align: center;
    animation: slideDown 0.3s ease;
}
.connection-banner.show { display: block; }
.connection-banner.offline {
    background: #fff3cd;
    color: #856404;
    border: 1px solid #ffeaa7;
}
.connection-banner.syncing {
    background: #d1ecf1;
    color: #0c5460;
    border: 1px solid #bee5eb;
}
@keyframes slideDown {
    from { transform: translateY(-20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
}

/* ================================================================
   [04] HEADER - رأس الصفحة
   ================================================================ */
.header {
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: var(--space-lg);
    margin-bottom: var(--space-xl);
    background: var(--bg-card); padding: var(--space-lg) var(--space-xl);
    border-radius: var(--radius-lg); box-shadow: var(--shadow-sm);
}
.header-title {
    font-size: var(--font-2xl); color: var(--text-primary);
    display: flex; align-items: center; gap: var(--space-sm);
}
.header-actions { display: flex; gap: var(--space-sm); }
.header-btn {
    background: var(--bg-input); border: 2px solid var(--border-color);
    padding: var(--space-sm) var(--space-lg);
    border-radius: var(--radius-full); cursor: pointer;
    display: flex; align-items: center; gap: 6px;
    transition: var(--transition-base);
    font-weight: 600; color: var(--text-primary);
    font-family: inherit; font-size: var(--font-base);
}
.header-btn:hover { border-color: var(--border-hover); color: var(--border-hover); }
.badge-count {
    background: var(--color-danger); color: #fff;
    border-radius: 20px; padding: 2px 8px;
    font-size: var(--font-sm); font-weight: 700;
    min-width: 22px; text-align: center;
}

/* ================================================================
   [05] SEARCH & FILTERS - البحث والفلاتر المتقدمة
   ================================================================ */
.search-panel {
    background: var(--bg-card); padding: var(--space-lg) var(--space-xl);
    border-radius: var(--radius-lg); box-shadow: var(--shadow-sm);
    margin-bottom: var(--space-lg);
}
.search-row {
    display: flex; flex-wrap: wrap; gap: var(--space-md); align-items: center;
}
.search-input-wrap {
    flex: 2; min-width: 220px;
    position: relative;
    display: flex; align-items: center;
}
.search-input-wrap svg {
    position: absolute; right: 14px;
    color: var(--text-muted); pointer-events: none;
}
.search-input-wrap input {
    width: 100%;
    padding: 10px 40px 10px 18px;
    border: 2px solid var(--border-color);
    border-radius: var(--radius-full);
    font-size: var(--font-md); outline: none;
    background: var(--bg-input); transition: var(--transition-base);
    color: var(--text-primary); font-family: inherit;
}
.search-input-wrap input:focus {
    border-color: var(--color-primary); background: var(--bg-card);
}
.clear-search {
    position: absolute; left: 8px;
    background: none; border: none; cursor: pointer;
    color: var(--text-muted); font-size: 20px;
    width: 28px; height: 28px; border-radius: 50%;
    display: none;
}
.clear-search.show { display: flex; align-items: center; justify-content: center; }
.clear-search:hover { background: var(--bg-muted); color: var(--color-danger); }

.search-row select {
    padding: 10px 16px;
    border: 2px solid var(--border-color);
    border-radius: var(--radius-full);
    font-size: var(--font-base); outline: none;
    background: var(--bg-input); cursor: pointer;
    transition: var(--transition-base); color: var(--text-primary);
    font-family: inherit;
}
.search-row select:focus {
    border-color: var(--color-primary); background: var(--bg-card);
}

.filter-toggle {
    padding: 10px 20px;
    border: 2px solid var(--border-color);
    border-radius: var(--radius-full);
    background: var(--bg-input); cursor: pointer;
    font-weight: 600; color: var(--text-primary);
    font-family: inherit; font-size: var(--font-base);
    display: inline-flex; align-items: center; gap: 6px;
    transition: var(--transition-base);
}
.filter-toggle:hover { border-color: var(--color-primary); color: var(--color-primary); }
.filter-toggle.active { background: var(--color-primary); color: #fff; border-color: var(--color-primary); }

.total-info {
    background: var(--bg-badge); padding: 6px 16px;
    border-radius: var(--radius-full);
    font-size: var(--font-base); font-weight: 600; color: var(--text-primary);
    margin-right: auto;
}

/* Advanced Filters Panel */
.filters-panel {
    display: none;
    margin-top: var(--space-lg);
    padding-top: var(--space-lg);
    border-top: 2px dashed var(--border-color);
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: var(--space-lg);
}
.filters-panel.open {
    display: grid;
    animation: slideDown 0.3s ease;
}
.filter-group { display: flex; flex-direction: column; gap: var(--space-sm); }
.filter-group label {
    font-size: var(--font-base); font-weight: 700;
    color: var(--text-secondary);
}
.filter-group .chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
    padding: 6px 14px; border-radius: var(--radius-full);
    border: 2px solid var(--border-color);
    background: var(--bg-input); cursor: pointer;
    font-size: 13px; font-weight: 600; color: var(--text-secondary);
    transition: var(--transition-fast);
    font-family: inherit;
}
.chip:hover { border-color: var(--color-primary); color: var(--color-primary); }
.chip.active { background: var(--color-primary); color: #fff; border-color: var(--color-primary); }

.range-inputs {
    display: flex; align-items: center; gap: var(--space-sm);
}
.range-inputs input {
    width: 100%;
    padding: 8px 12px;
    border: 2px solid var(--border-color);
    border-radius: var(--radius-sm);
    font-size: var(--font-base); outline: none;
    background: var(--bg-input); color: var(--text-primary);
    font-family: inherit;
    transition: var(--transition-base);
}
.range-inputs input:focus { border-color: var(--color-primary); background: var(--bg-card); }
.range-inputs span { color: var(--text-muted); font-weight: 700; }

.reset-filters {
    padding: 8px 16px; border-radius: var(--radius-full);
    background: var(--color-danger); color: #fff;
    border: none; cursor: pointer;
    font-weight: 600; font-family: inherit;
    font-size: var(--font-base);
    align-self: flex-end;
    transition: var(--transition-fast);
}
.reset-filters:hover { opacity: 0.9; }

/* ================================================================
   [06] GRID - الشبكة
   ================================================================ */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
    gap: var(--space-xl);
    min-height: 100px;
}
.sentinel { height: 1px; width: 100%; }

/* ================================================================
   [07] CARD - بطاقة المنتج
   ================================================================ */
.card {
    background: var(--bg-card); border-radius: var(--radius-lg);
    padding: var(--space-lg); box-shadow: var(--shadow-md);
    border: 1px solid rgba(0,0,0,0.02);
    display: flex; flex-direction: column;
    transition: transform var(--transition-base), box-shadow var(--transition-base);
    will-change: transform;
    animation: cardFadeIn 0.4s ease backwards;
    position: relative;
}
.card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }

@keyframes cardFadeIn {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
}

.card .priority-badge {
    position: absolute; top: 10px; left: 10px;
    background: linear-gradient(135deg, #f39c12, #e67e22);
    color: #fff; font-size: 10px; font-weight: 800;
    padding: 3px 10px; border-radius: 20px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
}

.card .code {
    font-size: var(--font-sm); color: var(--text-muted);
    direction: ltr; text-align: left;
    background: var(--bg-muted); padding: 3px 10px;
    border-radius: 30px; align-self: flex-start;
    margin-bottom: var(--space-sm); font-weight: 600;
}
.card h3 {
    font-size: var(--font-lg); color: var(--text-primary);
    margin-bottom: var(--space-sm); line-height: 1.4;
    min-height: 46px; cursor: pointer;
    transition: color var(--transition-fast);
}
.card h3:hover { color: var(--color-primary); }
.card h3 mark {
    background: rgba(52,152,219,0.25);
    color: var(--color-primary);
    padding: 0 2px; border-radius: 3px;
}

.card .prices { display: flex; gap: var(--space-sm); flex-wrap: wrap; margin-bottom: var(--space-sm); }
.card .prices span {
    padding: 5px 12px; border-radius: 30px;
    font-size: 13px; font-weight: 700;
}
.card .prices .cash { color: var(--color-success); background: #eafaf1; }
.card .prices .inst { color: var(--color-info); background: #eaf4fb; }

.card .qty { font-size: 13px; color: var(--text-secondary); margin-bottom: var(--space-sm); }
.card .qty strong { color: var(--color-warning); }
.card .qty strong.low-stock { color: var(--color-danger); }

.card .status-badge {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 5px 14px; border-radius: var(--radius-full);
    font-size: 13px; font-weight: 700;
    align-self: flex-start;
    transition: background var(--transition-fast), color var(--transition-fast);
}
.card .status-badge.available { background: #d4edda; color: #155724; }
.card .status-badge.unavailable { background: #f8d7da; color: #721c24; }

.card .card-actions {
    display: flex; gap: 6px; margin-top: auto;
    padding-top: var(--space-md);
    border-top: 1px solid var(--bg-muted);
}
.card .card-actions button {
    padding: 8px 10px; border: none;
    border-radius: 30px; cursor: pointer;
    font-size: 13px; font-weight: 700;
    display: inline-flex; align-items: center; justify-content: center;
    gap: 4px; transition: var(--transition-fast);
    flex: 1; font-family: inherit;
}
.card .btn-whatsapp { background: var(--color-whatsapp); color: #fff; flex: 2; }
.card .btn-whatsapp:hover { background: var(--color-whatsapp-dark); }
.card .btn-cart { background: var(--bg-badge); color: var(--text-primary); }
.card .btn-cart:hover { background: var(--color-primary); color: #fff; }
.card .btn-cart.in-cart { background: var(--color-success); color: #fff; }
.card .btn-wishlist { background: var(--bg-badge); color: var(--color-danger); flex: 0.6; }
.card .btn-wishlist:hover { background: #fde8e8; }
.card .btn-wishlist.in-wishlist { background: #fde8e8; color: var(--color-danger); }

/* ================================================================
   [08] SKELETON - هياكل التحميل
   ================================================================ */
.skeleton-card {
    background: var(--bg-card); border-radius: var(--radius-lg);
    padding: var(--space-lg); box-shadow: var(--shadow-md);
    border: 1px solid var(--bg-muted);
    min-height: 260px;
    display: flex; flex-direction: column; gap: var(--space-md);
}
.skeleton-line {
    background: linear-gradient(90deg, var(--bg-muted) 25%, var(--bg-badge) 50%, var(--bg-muted) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
    border-radius: 10px;
}
.skeleton-line.title { height: 20px; width: 80%; }
.skeleton-line.price { height: 18px; width: 60%; }
.skeleton-line.qty { height: 16px; width: 40%; }
.skeleton-line.status { height: 20px; width: 50%; }
@keyframes shimmer {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
}

/* ================================================================
   [09] LOAD MORE - زر المزيد
   ================================================================ */
.load-more-area {
    display: flex; justify-content: center; align-items: center;
    padding: var(--space-xl) 0; min-height: 70px;
}
.load-more-btn {
    padding: var(--space-md) var(--space-2xl);
    background: var(--color-primary); color: #fff;
    border: none; border-radius: var(--radius-full);
    font-size: var(--font-md); font-weight: 700;
    cursor: pointer; transition: var(--transition-base);
    display: inline-flex; align-items: center; gap: var(--space-sm);
    box-shadow: 0 4px 15px rgba(52,152,219,0.3);
    font-family: inherit;
}
.load-more-btn:hover:not(:disabled) {
    background: var(--color-primary-dark);
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(52,152,219,0.4);
}
.load-more-btn:disabled { opacity: 0.6; cursor: wait; transform: none; }
.spinner {
    display: inline-block; width: 20px; height: 20px;
    border: 3px solid rgba(255,255,255,0.3);
    border-top-color: #fff; border-radius: 50%;
    animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.end-message {
    text-align: center; color: var(--text-muted);
    font-size: var(--font-base); padding: var(--space-xl); font-weight: 600;
}
.error-box {
    text-align: center; padding: var(--space-2xl);
    color: var(--color-danger); background: #fde8e8;
    border-radius: var(--radius-md); grid-column: 1 / -1;
}
.error-box button {
    margin-top: var(--space-md); padding: 10px 25px;
    background: var(--color-danger); color: #fff;
    border: none; border-radius: 30px; cursor: pointer; font-weight: 700;
    font-family: inherit;
}
.no-results {
    text-align: center; padding: var(--space-2xl);
    color: var(--text-muted); grid-column: 1 / -1;
}

/* ================================================================
   [10] MODAL - نافذة التفاصيل
   ================================================================ */
.modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    z-index: var(--z-modal);
    justify-content: center; align-items: center;
    padding: var(--space-xl);
}
.modal-overlay.open { display: flex; }
.modal-box {
    background: var(--bg-card); border-radius: var(--radius-xl);
    max-width: 550px; width: 100%;
    padding: var(--space-2xl);
    max-height: 90vh; overflow-y: auto;
    position: relative; animation: slideUp var(--transition-base);
    scrollbar-gutter: stable;
}
@keyframes slideUp {
    from { transform: translateY(30px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
}
.modal-close {
    position: absolute; top: 12px; left: 18px;
    background: none; border: none; cursor: pointer;
    color: var(--text-muted); width: 36px; height: 36px;
    border-radius: 50%; transition: var(--transition-fast);
    display: flex; align-items: center; justify-content: center;
}
.modal-close:hover { background: var(--bg-muted); color: var(--text-primary); }
.modal-box h2 {
    font-size: var(--font-xl); margin-bottom: var(--space-md);
    color: var(--text-primary); padding-left: 40px;
}
.modal-box .detail-row {
    display: flex; justify-content: space-between;
    padding: 10px 0; border-bottom: 1px solid var(--bg-muted);
    font-size: var(--font-md);
}
.modal-box .detail-row:last-of-type { border-bottom: none; }
.modal-box .detail-row strong { color: var(--text-primary); }
.modal-actions { display: flex; gap: var(--space-sm); margin-top: var(--space-xl); flex-wrap: wrap; }
.modal-actions button {
    flex: 1; min-width: 100px;
    padding: var(--space-md) var(--space-lg);
    border: none; border-radius: var(--radius-md);
    font-size: var(--font-base); font-weight: 700;
    cursor: pointer; transition: var(--transition-fast);
    font-family: inherit;
}
.modal-actions .btn-primary { background: var(--color-whatsapp); color: #fff; flex: 2; }
.modal-actions .btn-primary:hover { background: var(--color-whatsapp-dark); }
.modal-actions .btn-secondary { background: var(--bg-badge); color: var(--text-primary); }
.modal-actions .btn-secondary:hover { background: #d5dbe3; }

/* ================================================================
   [11] CART - السلة الجانبية
   ================================================================ */
.cart-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.4); z-index: 9998;
}
.cart-overlay.open { display: block; }
.cart-sidebar {
    position: fixed; top: 0; left: -420px;
    width: 400px; max-width: 90vw; height: 100%;
    background: var(--bg-card); z-index: var(--z-cart);
    padding: var(--space-xl); transition: left var(--transition-base);
    display: flex; flex-direction: column;
    box-shadow: 4px 0 20px rgba(0,0,0,0.1);
    overscroll-behavior: contain;
}
.cart-sidebar.open { left: 0; }
.cart-header {
    display: flex; justify-content: space-between; align-items: center;
    padding-bottom: var(--space-lg);
    border-bottom: 2px solid var(--bg-muted);
    margin-bottom: var(--space-lg);
}
.cart-header h2 { font-size: var(--font-xl); color: var(--text-primary); }
.cart-header button {
    background: none; border: none; cursor: pointer;
    color: var(--text-muted); padding: 4px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    transition: var(--transition-fast);
}
.cart-header button:hover { background: var(--bg-muted); color: var(--text-primary); }
.cart-items { flex: 1; overflow-y: auto; }
.cart-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: var(--space-md) 0;
    border-bottom: 1px solid var(--bg-muted);
}
.cart-item-info h4 { font-size: var(--font-base); color: var(--text-primary); margin-bottom: 4px; }
.cart-item-info p { font-size: var(--font-sm); color: var(--text-muted); }
.cart-item-actions { display: flex; align-items: center; gap: 6px; }
.cart-item-actions button {
    width: 28px; height: 28px; border-radius: 50%; border: none;
    background: var(--bg-badge); cursor: pointer; font-weight: bold;
    display: flex; align-items: center; justify-content: center;
    transition: var(--transition-fast); color: var(--text-primary);
}
.cart-item-actions button:hover { background: var(--color-primary); color: #fff; }
.cart-item-actions span { min-width: 24px; text-align: center; font-weight: 700; }
.cart-empty { text-align: center; padding: var(--space-2xl) var(--space-lg); color: var(--text-muted); }
.cart-total {
    padding-top: var(--space-lg);
    border-top: 2px solid var(--bg-muted);
    display: flex; justify-content: space-between;
    font-size: var(--font-lg); font-weight: 700;
    color: var(--text-primary); margin-bottom: var(--space-md);
}
.cart-checkout {
    width: 100%; padding: var(--space-lg);
    background: var(--color-whatsapp); color: #fff;
    border: none; border-radius: var(--radius-md);
    font-size: var(--font-md); font-weight: 700;
    cursor: pointer; transition: var(--transition-fast);
    display: flex; align-items: center; justify-content: center; gap: var(--space-sm);
    font-family: inherit;
}
.cart-checkout:hover:not(:disabled) { background: var(--color-whatsapp-dark); }
.cart-checkout:disabled { opacity: 0.5; cursor: not-allowed; }

/* ================================================================
   [12] TOAST - الإشعارات
   ================================================================ */
.toast-container {
    position: fixed; top: var(--space-xl); right: var(--space-xl);
    z-index: var(--z-toast);
    display: flex; flex-direction: column; gap: var(--space-sm);
    pointer-events: none;
}
.toast {
    pointer-events: auto;
    background: var(--bg-card); padding: var(--space-md) var(--space-lg);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-xl);
    border-right: 4px solid var(--color-primary);
    display: flex; align-items: center; gap: var(--space-sm);
    font-size: var(--font-base); font-weight: 600;
    color: var(--text-primary);
    animation: slideInRight var(--transition-base);

}
.toast.success { border-right-color: var(--color-success); }
.toast.error { border-right-color: var(--color-danger); }
.toast.warning { border-right-color: var(--color-warning); }
@keyframes slideInRight {
    from { transform: translateX(100px); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
}

/* ================================================================
   [13] RESPONSIVE - التجاوب
   ================================================================ */
@media (max-width: 768px) {
    body { padding: var(--space-lg); }
    .header { flex-direction: column; }

}
</style>

<script>
/* ================================================================
   [JS-01] CONFIG - الإعدادات العامة
   ================================================================ */
const CONFIG = Object.freeze({
    API_URL: 'https://script.google.com/macros/s/AKfycbxD8yE9o2-GQd0K8WDxdpfXD0C7O3LK6d9DINFxPeB7P2i95XrWzcaFDSQE0pP0bd1Q/exec',
    WHATSAPP_PHONE: '201234567890',
    PAGE_SIZE: 20,
    DB_NAME: 'catalog_db',
    DB_VERSION: 1,
    DB_STORE: 'products',
    DB_META_STORE: 'meta',
    CACHE_TTL: 24 * 60 * 60 * 1000,        // 24 ساعة صلاحية البيانات
    REVALIDATE_THRESHOLD: 30 * 60 * 1000,  // إعادة التحقق بعد 30 دقيقة
    CART_KEY: 'cart_v3',
    WISHLIST_KEY: 'wishlist_v3',
    SEARCH_DEBOUNCE: 300,
    MAX_TOASTS: 4,
    LOW_STOCK_THRESHOLD: 3                 // حد المخزون المنخفض
});

/* ================================================================
   [JS-02] UTILS - دوال مساعدة
   ================================================================ */
const Utils = (function() {
    'use strict';

    function escapeHtml(text) {
        if (text === undefined || text === null) return '';
        const div = document.createElement('div');
        div.textContent = String(text);
        return div.innerHTML;
    }

    function debounce(fn, delay) {
        let timer = null;
        return function(...args) {
            clearTimeout(timer);
            timer = setTimeout(() => fn.apply(this, args), delay);
        };
    }

    function formatNumber(n) {
        return (Number(n) || 0).toLocaleString('ar-EG');
    }

    function toNumber(v, fallback = 0) {
        const n = Number(v);
        return isNaN(n) ? fallback : n;
    }

    function safeGetItem(key, fallback) {
        try {
            const raw = localStorage.getItem(key);
            return raw ? JSON.parse(raw) : fallback;
        } catch (e) { return fallback; }
    }

    function safeSetItem(key, value) {
        try {
            localStorage.setItem(key, JSON.stringify(value));
            return true;
        } catch (e) { return false; }
    }

    function safeRemove(el) {
        if (el && el.parentNode) el.parentNode.removeChild(el);
    }

    function clearElement(el) {
        while (el && el.firstChild) el.removeChild(el.firstChild);
    }

    // تمييز نتائج البحث في النص
    function highlightText(text, query) {
        if (!query || !text) return escapeHtml(text);
        const escaped = escapeHtml(text);
        const safeQuery = String(query).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const regex = new RegExp(`(${safeQuery})`, 'gi');
        return escaped.replace(regex, '<mark>$1</mark>');
    }

    // فحص تساوي مصفوفتين من المنتجات (hash بسيط)
    function itemsHash(items) {
        if (!Array.isArray(items) || items.length === 0) return 'empty';
        // نجمع الكود + السعر + الكمية لأول 20 عنصر + الطول الإجمالي
        let hash = items.length + '-';
        const sample = items.slice(0, 20);
        sample.forEach(i => {
            hash += `${i.id}:${i.cashPrice}:${i.quantity}|`;
        });
        return hash;
    }

    return {
        escapeHtml, debounce, formatNumber, toNumber,
        safeGetItem, safeSetItem, safeRemove, clearElement,
        highlightText, itemsHash
    };
})();

/* ================================================================
   [JS-03] DB - IndexedDB (تخزين أوفلاين)
   ================================================================ */
const DB = (function() {
    'use strict';

    let dbInstance = null;

    // فتح قاعدة البيانات
    function open() {
        if (dbInstance) return Promise.resolve(dbInstance);

        return new Promise((resolve, reject) => {
            if (!('indexedDB' in window)) {
                reject(new Error('IndexedDB غير مدعوم في هذا المتصفح'));
                return;
            }

            const req = indexedDB.open(CONFIG.DB_NAME, CONFIG.DB_VERSION);

            req.onupgradeneeded = (e) => {
                const db = e.target.result;
                if (!db.objectStoreNames.contains(CONFIG.DB_STORE)) {
                    const store = db.createObjectStore(CONFIG.DB_STORE, { keyPath: 'id' });
                    store.createIndex('name', 'name', { unique: false });
                    store.createIndex('cashPrice', 'cashPrice', { unique: false });
                    store.createIndex('quantity', 'quantity', { unique: false });
                    store.createIndex('available', 'available', { unique: false });
                }
                if (!db.objectStoreNames.contains(CONFIG.DB_META_STORE)) {
                    db.createObjectStore(CONFIG.DB_META_STORE, { keyPath: 'key' });
                }
            };

            req.onsuccess = (e) => {
                dbInstance = e.target.result;
                resolve(dbInstance);
            };

            req.onerror = () => reject(new Error('فشل فتح قاعدة البيانات: ' + req.error));
        });
    }

    // حفظ المنتجات (استبدال كامل - أسرع من التحديث الفردي)
    async function saveProducts(items) {
        const db = await open();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(CONFIG.DB_STORE, 'readwrite');
            const store = tx.objectStore(CONFIG.DB_STORE);

            // مسح كل البيانات القديمة أولاً
            store.clear();

            // إضافة كل المنتجات
            items.forEach(item => {
                store.put({
                    id: String(item.id),
                    name: String(item.name),
                    cashPrice: Utils.toNumber(item.cashPrice),
                    installPrice: Utils.toNumber(item.installPrice),
                    quantity: Utils.toNumber(item.quantity),
                    available: !!item.available
                });
            });

            tx.oncomplete = () => resolve(items.length);
            tx.onerror = () => reject(tx.error);
        });
    }

    // جلب كل المنتجات
    async function getAllProducts() {
        const db = await open();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(CONFIG.DB_STORE, 'readonly');
            const store = tx.objectStore(CONFIG.DB_STORE);
            const req = store.getAll();

            req.onsuccess = () => resolve(req.result || []);
            req.onerror = () => reject(req.error);
        });
    }

    // عدد المنتجات
    async function countProducts() {
        const db = await open();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(CONFIG.DB_STORE, 'readonly');
            const store = tx.objectStore(CONFIG.DB_STORE);
            const req = store.count();
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => reject(req.error);
        });
    }

    // حفظ/قراءة meta (hash + timestamp)
    async function setMeta(key, value) {
        const db = await open();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(CONFIG.DB_META_STORE, 'readwrite');
            tx.objectStore(CONFIG.DB_META_STORE).put({ key, value });
            tx.oncomplete = () => resolve();
            tx.onerror = () => reject(tx.error);
        });
    }

    async function getMeta(key) {
        const db = await open();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(CONFIG.DB_META_STORE, 'readonly');
            const req = tx.objectStore(CONFIG.DB_META_STORE).get(key);
            req.onsuccess = () => resolve(req.result ? req.result.value : null);
            req.onerror = () => reject(req.error);
        });
    }

    // مسح كل شيء
    async function clearAll() {
        const db = await open();
        return new Promise((resolve, reject) => {
            const tx = db.transaction([CONFIG.DB_STORE, CONFIG.DB_META_STORE], 'readwrite');
            tx.objectStore(CONFIG.DB_STORE).clear();
            tx.objectStore(CONFIG.DB_META_STORE).clear();
            tx.oncomplete = () => resolve();
            tx.onerror = () => reject(tx.error);
        });
    }

    return {
        open, saveProducts, getAllProducts, countProducts,
        setMeta, getMeta, clearAll
    };
})();

/* ================================================================
   [JS-04] STATE - الحالة العامة
   ================================================================ */
const State = (function() {
    'use strict';

    const state = {
        allItems: [],       // كل المنتجات بعد الجلب
        filteredItems: [],  // بعد البحث والفلاتر
        visibleCount: 0,    // عدد المعروض حالياً
        total: 0,
        isLoading: false,
        isOffline: false,
        filters: {
            search: '',
            availability: 'all',
            priceMin: null,
            priceMax: null,
            qtyMin: null,
            qtyMax: null,
            lowStockOnly: false
        },
        sort: 'priority',
        order: 'desc',
        abortController: null
    };

    function get() { return state; }

    return { get };
})();

/* ================================================================
   [JS-05] TOAST - الإشعارات
   ================================================================ */
const Toast = (function() {
    'use strict';
    const container = document.getElementById('toastContainer');

    function show(message, type = 'success', duration = 3000) {
        if (!container) return;
        while (container.children.length >= CONFIG.MAX_TOASTS) {
            container.removeChild(container.firstChild);
        }
        const toast = document.createElement('div');
        toast.className = 'toast ' + type;
        toast.textContent = message;
        toast.setAttribute('role', 'status');
        container.appendChild(toast);
        setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transform = 'translateX(100px)';
            setTimeout(() => Utils.safeRemove(toast), 300);
        }, duration);
    }

    return { show };
})();

/* ================================================================
   [JS-06] CONNECTION - إدارة حالة الاتصال
   ================================================================ */
const Connection = (function() {
    'use strict';
    const banner = document.getElementById('connectionBanner');
    let wasOffline = false;

    function update() {
        const state = State.get();
        state.isOffline = !navigator.onLine;

        if (state.isOffline) {
            banner.textContent = '⚠️ أنت غير متصل بالإنترنت - يتم عرض البيانات المخزنة';
            banner.className = 'connection-banner show offline';
            wasOffline = true;
        } else if (wasOffline) {
            // عاد الاتصال
            banner.textContent = '🔄 جاري مزامنة البيانات...';
            banner.className = 'connection-banner show syncing';
            setTimeout(() => {
                banner.className = 'connection-banner';
            }, 3000);
            wasOffline = false;
            // إعادة تحميل من السيرفر
            if (window.App && window.App.refreshFromServer) {
                window.App.refreshFromServer();
            }
        } else {
            banner.className = 'connection-banner';
        }
    }

    window.addEventListener('online', update);
    window.addEventListener('offline', update);

    return { update };
})();

/* ================================================================
   [JS-07] WISHLIST - المفضلة
   ================================================================ */
const Wishlist = (function() {
    'use strict';

    function getAll() { return Utils.safeGetItem(CONFIG.WISHLIST_KEY, []); }
    function save(items) {
        Utils.safeSetItem(CONFIG.WISHLIST_KEY, items);
        updateBadge();
    }
    function isIn(id) {
        return getAll().some(i => String(i.id) === String(id));
    }
    function toggle(item) {
        const list = getAll();
        const idx = list.findIndex(i => String(i.id) === String(item.id));
        let added;
        if (idx > -1) {
            list.splice(idx, 1); added = false;
        } else {
            list.push({
                id: String(item.id), name: String(item.name),
                cashPrice: Utils.toNumber(item.cashPrice),
                installPrice: Utils.toNumber(item.installPrice),
                quantity: Utils.toNumber(item.quantity)
            });
            added = true;
        }
        save(list);
        return added;
    }
    function updateBadge() {
        const el = document.getElementById('wishlistCount');
        if (el) el.textContent = getAll().length;
    }

    return { getAll, isIn, toggle, updateBadge };
})();

/* ================================================================
   [JS-08] CART - السلة
   ================================================================ */
const Cart = (function() {
    'use strict';

    function getAll() { return Utils.safeGetItem(CONFIG.CART_KEY, []); }
    function save(items) {
        Utils.safeSetItem(CONFIG.CART_KEY, items);
        updateBadge();
        render();
    }
    function isIn(id) { return getAll().some(i => String(i.id) === String(id)); }

    function add(item) {
        if (!item.available) {
            Toast.show('هذا المنتج غير متوفر حالياً', 'warning');
            return false;
        }
        const list = getAll();
        const existing = list.find(i => String(i.id) === String(item.id));
        if (existing) {
            if (existing.quantity >= (item.quantity || 0)) {
                Toast.show('الكمية المطلوبة غير متوفرة', 'warning');
                return false;
            }
            existing.quantity = Utils.toNumber(existing.quantity) + 1;
        } else {
            list.push({
                id: String(item.id), name: String(item.name),
                cashPrice: Utils.toNumber(item.cashPrice),
                installPrice: Utils.toNumber(item.installPrice),
                quantity: 1,
                maxQuantity: Utils.toNumber(item.quantity)
            });
        }
        save(list);
        return true;
    }

    function remove(id) {
        save(getAll().filter(i => String(i.id) !== String(id)));
    }

    function toggle(item) {
        if (isIn(item.id)) { remove(item.id); return false; }
        return add(item);
    }

    function changeQty(id, delta) {
        const list = getAll();
        const item = list.find(i => String(i.id) === String(id));
        if (!item) return;
        const newQty = Utils.toNumber(item.quantity) + delta;
        if (newQty < 1) return;
        if (item.maxQuantity && newQty > item.maxQuantity) {
            Toast.show('لا يمكن تجاوز الكمية المتاحة', 'warning');
            return;
        }
        item.quantity = newQty;
        save(list);
    }

    function getTotal() {
        return getAll().reduce(
            (sum, i) => sum + (Utils.toNumber(i.cashPrice) * Utils.toNumber(i.quantity)),
            0
        );
    }

    function updateBadge() {
        const el = document.getElementById('cartCount');
        if (el) el.textContent = getAll().length;
    }

    function render() {
        const container = document.getElementById('cartItems');
        const totalEl = document.getElementById('cartTotalPrice');
        const checkoutBtn = document.getElementById('cartCheckout');
        if (!container) return;

        const list = getAll();
        Utils.clearElement(container);

        if (list.length === 0) {
            const empty = document.createElement('div');
            empty.className = 'cart-empty';
            empty.textContent = 'السلة فارغة';
            container.appendChild(empty);
            if (totalEl) totalEl.textContent = '0 ج.م';
            if (checkoutBtn) checkoutBtn.disabled = true;
            return;
        }

        if (checkoutBtn) checkoutBtn.disabled = false;

        list.forEach(item => {
            const div = document.createElement('div');
            div.className = 'cart-item';

            const info = document.createElement('div');
            info.className = 'cart-item-info';
            const h4 = document.createElement('h4');
            h4.textContent = item.name;
            const p = document.createElement('p');
            p.textContent = `${Utils.formatNumber(item.cashPrice)} ج.م × ${item.quantity}`;
            info.appendChild(h4);
            info.appendChild(p);

            const actions = document.createElement('div');
            actions.className = 'cart-item-actions';

            const minusBtn = document.createElement('button');
            minusBtn.textContent = '−';
            minusBtn.setAttribute('aria-label', 'تقليل الكمية');
            minusBtn.addEventListener('click', () => changeQty(item.id, -1));

            const qtySpan = document.createElement('span');
            qtySpan.textContent = item.quantity;

            const plusBtn = document.createElement('button');
            plusBtn.textContent = '+';
            plusBtn.setAttribute('aria-label', 'زيادة الكمية');
            plusBtn.addEventListener('click', () => changeQty(item.id, 1));

            const removeBtn = document.createElement('button');
            removeBtn.textContent = '×';
            removeBtn.setAttribute('aria-label', 'إزالة من السلة');
            removeBtn.style.background = '#fee';
            removeBtn.style.color = 'var(--color-danger)';
            removeBtn.addEventListener('click', () => remove(item.id));

            actions.appendChild(minusBtn);
            actions.appendChild(qtySpan);
            actions.appendChild(plusBtn);
            actions.appendChild(removeBtn);

            div.appendChild(info);
            div.appendChild(actions);
            container.appendChild(div);
        });

        if (totalEl) totalEl.textContent = `${Utils.formatNumber(getTotal())} ج.م`;
    }

    return { getAll, isIn, add, remove, toggle, changeQty, getTotal, updateBadge, render };
})();

/* ================================================================
   [JS-09] WHATSAPP - إرسال الطلبات
   ================================================================ */
const WhatsApp = (function() {
    'use strict';

    function buildMessage(items) {
        const arr = Array.isArray(items) ? items : [items];
        if (arr.length === 0) return '';
        let msg = 'مرحباً، أرغب في طلب المنتجات التالية:\n\n';
        let total = 0;
        arr.forEach((item, i) => {
            const qty = Utils.toNumber(item.quantity) || 1;
            total += Utils.toNumber(item.cashPrice) * qty;
            msg += `${i + 1}. ${item.name}\n`;
            msg += `   الكود: ${item.id}\n`;
            msg += `   السعر: ${item.cashPrice} ج.م\n`;
            msg += `   الكمية: ${qty}\n\n`;
        });
        msg += `المجموع: ${total} ج.م`;
        return msg;
    }

    function order(items) {
        const arr = Array.isArray(items) ? items : [items];
        if (arr.length === 0) {
            Toast.show('لا توجد منتجات للطلب', 'warning');
            return;
        }
        const msg = buildMessage(arr);
        window.open(`https://wa.me/${CONFIG.WHATSAPP_PHONE}?text=${encodeURIComponent(msg)}`, '_blank');
    }

    return { order, buildMessage };
})();

/* ================================================================
   [JS-10] API - طلبات الشبكة
   ================================================================ */
const Api = (function() {
    'use strict';

    function buildUrl() {
        // نطلب كل المنتجات دفعة واحدة (limit كبير) - الكود الخلفي يدعم 500
        const params = new URLSearchParams({
            action: 'getMenu',
            offset: '0',
            limit: '500'
        });
        return `${CONFIG.API_URL}?${params.toString()}`;
    }

    async function fetchAll(signal) {
        const res = await fetch(buildUrl(), { signal });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const result = await res.json();
        if (result.error) throw new Error(result.error);
        return {
            items: (result.data || []).map(normalize),
            total: result.total || 0
        };
    }

    function normalize(item) {
        return {
            id: String(item.id || ''),
            name: String(item.name || ''),
            cashPrice: Utils.toNumber(item.cashPrice),
            installPrice: Utils.toNumber(item.installPrice),
            quantity: Utils.toNumber(item.quantity),
            available: item.available === true || item.available === 'true'
        };
    }

    return { fetchAll };
})();

/* ================================================================
   [JS-11] FILTER & SORT - الفلترة والترتيب
   ================================================================ */
const FilterSort = (function() {
    'use strict';

    function apply(items, filters, sort, order) {
        let result = items.slice();

        // 1. بحث (كود + اسم)
        if (filters.search) {
            const q = filters.search.toLowerCase().trim();
            result = result.filter(i =>
                i.id.toLowerCase().includes(q) ||
                i.name.toLowerCase().includes(q)
            );
        }

        // 2. التوفر
        if (filters.availability === 'available') {
            result = result.filter(i => i.available);
        } else if (filters.availability === 'unavailable') {
            result = result.filter(i => !i.available);
        }

        // 3. السعر
        if (filters.priceMin != null) {
            result = result.filter(i => i.cashPrice >= filters.priceMin);
        }
        if (filters.priceMax != null) {
            result = result.filter(i => i.cashPrice <= filters.priceMax);
        }

        // 4. الكمية
        if (filters.qtyMin != null) {
            result = result.filter(i => i.quantity >= filters.qtyMin);
        }
        if (filters.qtyMax != null) {
            result = result.filter(i => i.quantity <= filters.qtyMax);
        }

        // 5. مخزون منخفض فقط
        if (filters.lowStockOnly) {
            result = result.filter(i => i.available && i.quantity <= CONFIG.LOW_STOCK_THRESHOLD);
        }

        // 6. الترتيب
        result = sortItems(result, sort, order);

        return result;
    }

    function sortItems(items, sort, order) {
        const dir = order === 'asc' ? 1 : -1;

        return items.sort((a, b) => {
            // أولوية خاصة: حسب المخزون
            if (sort === 'priority') {
                // 1. المتوفر أولاً (available=true -> 0, false -> 1)
                const availA = a.available ? 0 : 1;
                const availB = b.available ? 0 : 1;
                if (availA !== availB) return (availA - availB) * dir;

                // 2. الكمية الأعلى أولاً
                if (b.quantity !== a.quantity) return (b.quantity - a.quantity) * dir;

                // 3. الاسم ككسر أخير
                return a.name.localeCompare(b.name, 'ar');
            }

            let va = a[sort];
            let vb = b[sort];

            // للمقارنة النصية
            if (typeof va === 'string' && typeof vb === 'string') {
                return va.localeCompare(vb, 'ar') * dir;
            }

            // للمقارنة الرقمية
            va = Number(va) || 0;
            vb = Number(vb) || 0;
            if (va < vb) return -1 * dir;
            if (va > vb) return 1 * dir;
            return 0;
        });
    }

    return { apply };
})();

/* ================================================================
   [JS-12] CARD - بطاقة المنتج
   ================================================================ */
const Card = (function() {
    'use strict';

    function svgWishlist(filled) {
        const fill = filled ? 'var(--color-danger)' : 'none';
        return `<svg width="14" height="14" viewBox="0 0 24 24" fill="${fill}" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>`;
    }

    function create(item, index, searchQuery) {
        const card = document.createElement('article');
        card.className = 'card';
        card.setAttribute('role', 'article');
        card.setAttribute('aria-label', item.name);
        card.style.animationDelay = `${Math.min(index, 10) * 0.03}s`;

        // شارة الأولوية (للمخزون الجيد)
        if (item.available && item.quantity > CONFIG.LOW_STOCK_THRESHOLD) {
            const priority = document.createElement('div');
            priority.className = 'priority-badge';
            priority.textContent = 'متوفر';
            card.appendChild(priority);
        }

        // الكود
        const code = document.createElement('div');
        code.className = 'code';
        code.textContent = item.id;
        card.appendChild(code);

        // الاسم (مع تمييز البحث)
        const name = document.createElement('h3');
        if (searchQuery) {
            name.innerHTML = Utils.highlightText(item.name, searchQuery);
        } else {
            name.textContent = item.name;
        }
        name.setAttribute('role', 'button');
        name.setAttribute('tabindex', '0');
        name.addEventListener('click', () => Modal.open(item));
        name.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                Modal.open(item);
            }
        });
        card.appendChild(name);

        // الأسعار
        const prices = document.createElement('div');
        prices.className = 'prices';
        const cash = document.createElement('span');
        cash.className = 'cash';
        cash.textContent = `${Utils.formatNumber(item.cashPrice)} ج.م كاش`;
        const inst = document.createElement('span');
        inst.className = 'inst';
        inst.textContent = `${Utils.formatNumber(item.installPrice)} ج.م قسط`;
        prices.appendChild(cash);
        prices.appendChild(inst);
        card.appendChild(prices);

        // الكمية
        const qty = document.createElement('div');
        qty.className = 'qty';
        const low = item.available && item.quantity <= CONFIG.LOW_STOCK_THRESHOLD;
        qty.innerHTML = `الكمية: <strong class="${low ? 'low-stock' : ''}">${Utils.formatNumber(item.quantity)}</strong>`;
        card.appendChild(qty);

        // الحالة
        const status = document.createElement('span');
        status.className = 'status-badge ' + (item.available ? 'available' : 'unavailable');
        status.setAttribute('role', 'status');
        status.textContent = item.available ? 'متوفر' : 'غير متوفر';
        card.appendChild(status);

        // الأزرار
        const actions = document.createElement('div');
        actions.className = 'card-actions';

        const waBtn = document.createElement('button');
        waBtn.className = 'btn-whatsapp';
        waBtn.textContent = 'اطلب';
        waBtn.addEventListener('click', () => WhatsApp.order(item));
        actions.appendChild(waBtn);

        const cartBtn = document.createElement('button');
        const inCart = Cart.isIn(item.id);
        cartBtn.className = 'btn-cart' + (inCart ? ' in-cart' : '');
        cartBtn.textContent = inCart ? 'في السلة' : 'أضف';
        cartBtn.addEventListener('click', () => {
            const added = Cart.toggle(item);
            cartBtn.textContent = added ? 'في السلة' : 'أضف';
            cartBtn.classList.toggle('in-cart', added);
            Toast.show(added ? 'تمت الإضافة للسلة' : 'حُذف من السلة', added ? 'success' : 'warning');
        });
        actions.appendChild(cartBtn);

        const wishBtn = document.createElement('button');
        const inWish = Wishlist.isIn(item.id);
        wishBtn.className = 'btn-wishlist' + (inWish ? ' in-wishlist' : '');
        wishBtn.innerHTML = svgWishlist(inWish);
        wishBtn.setAttribute('aria-label', inWish ? 'إزالة من المفضلة' : 'أضف للمفضلة');
        wishBtn.addEventListener('click', () => {
            const added = Wishlist.toggle(item);
            wishBtn.innerHTML = svgWishlist(added);
            wishBtn.classList.toggle('in-wishlist', added);
            wishBtn.setAttribute('aria-label', added ? 'إزالة من المفضلة' : 'أضف للمفضلة');
            Toast.show(added ? 'أُضيف للمفضلة' : 'حُذف من المفضلة', added ? 'success' : 'warning');
        });
        actions.appendChild(wishBtn);

        card.appendChild(actions);
        return card;
    }

    return { create };
})();

/* ================================================================
   [JS-13] MODAL - نافذة التفاصيل
   ================================================================ */
const Modal = (function() {
    'use strict';
    const modal = document.getElementById('productModal');
    const els = {
        name: document.getElementById('modalName'),
        code: document.getElementById('modalCode'),
        cash: document.getElementById('modalCash'),
        inst: document.getElementById('modalInst'),
        qty: document.getElementById('modalQty'),
        status: document.getElementById('modalStatus'),
        waBtn: document.getElementById('modalWhatsapp'),
        cartBtn: document.getElementById('modalCart'),
        wishBtn: document.getElementById('modalWishlist'),
        closeBtn: document.getElementById('modalClose')
    };
    let lastFocused = null;

    function open(item) {
        lastFocused = document.activeElement;
        if (els.name) els.name.textContent = item.name;
        if (els.code) els.code.textContent = item.id;
        if (els.cash) els.cash.textContent = Utils.formatNumber(item.cashPrice);
        if (els.inst) els.inst.textContent = Utils.formatNumber(item.installPrice);
        if (els.qty) els.qty.textContent = Utils.formatNumber(item.quantity);
        if (els.status) {
            els.status.textContent = item.available ? 'متوفر' : 'غير متوفر';
            els.status.style.color = item.available ? 'var(--color-success)' : 'var(--color-danger)';
        }
        if (els.waBtn) els.waBtn.onclick = () => WhatsApp.order(item);
        if (els.cartBtn) els.cartBtn.onclick = () => {
            const added = Cart.toggle(item);
            Toast.show(added ? 'تمت الإضافة للسلة' : 'حُذف من السلة', added ? 'success' : 'warning');
        };
        if (els.wishBtn) els.wishBtn.onclick = () => {
            const added = Wishlist.toggle(item);
            Toast.show(added ? 'أُضيف للمفضلة' : 'حُذف من المفضلة', added ? 'success' : 'warning');
        };

        modal.classList.add('open');
        modal.setAttribute('aria-hidden', 'false');
        document.body.style.overflow = 'hidden';
        setTimeout(() => els.closeBtn && els.closeBtn.focus(), 100);
    }

    function close() {
        modal.classList.remove('open');
        modal.setAttribute('aria-hidden', 'true');
        document.body.style.overflow = '';
        if (lastFocused && lastFocused.focus) lastFocused.focus();
    }

    if (els.closeBtn) els.closeBtn.addEventListener('click', close);
    modal.addEventListener('click', (e) => { if (e.target === modal) close(); });
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && modal.classList.contains('open')) close();
    });

    return { open, close };
})();

/* ================================================================
   [JS-14] APP - نقطة التشغيل الرئيسية
   ================================================================ */
const App = (function() {
    'use strict';

    const state = State.get();
    const grid = document.getElementById('productGrid');
    const loadMoreArea = document.getElementById('loadMoreArea');
    const sentinel = document.getElementById('sentinel');
    const searchInput = document.getElementById('searchInput');
    const clearSearch = document.getElementById('clearSearch');
    const sortSelect = document.getElementById('sortSelect');
    const orderSelect = document.getElementById('orderSelect');
    const totalBadge = document.getElementById('totalBadge');
    const filterToggle = document.getElementById('filterToggle');
    const filtersPanel = document.getElementById('filtersPanel');
    const priceMin = document.getElementById('priceMin');
    const priceMax = document.getElementById('priceMax');
    const qtyMin = document.getElementById('qtyMin');
    const qtyMax = document.getElementById('qtyMax');
    const lowStockChip = document.getElementById('lowStockChip');
    const inStockChip = document.getElementById('inStockChip');
    const resetFilters = document.getElementById('resetFilters');

    /* -------- Grid Helpers -------- */
    function clearGrid() { Utils.clearElement(grid); }

    function showSkeletons(count = 6) {
        clearGrid();
        const fragment = document.createDocumentFragment();
        for (let i = 0; i < count; i++) {
            const sk = document.createElement('div');
            sk.className = 'skeleton-card';
            sk.setAttribute('aria-hidden', 'true');
            sk.innerHTML = '<div class="skeleton-line title"></div><div class="skeleton-line price"></div><div class="skeleton-line qty"></div><div class="skeleton-line status"></div>';
            fragment.appendChild(sk);
        }
        grid.appendChild(fragment);
    }

    function updateTotalBadge() {
        if (totalBadge) {
            const filtered = state.filteredItems.length;
            const visible = state.visibleCount;
            totalBadge.textContent = `إجمالي: ${Utils.formatNumber(state.total)} | معروض: ${Utils.formatNumber(visible)} من ${Utils.formatNumber(filtered)}`;
        }
    }

    /* -------- Render Items -------- */
    function renderPage(append = false) {
        if (!append) {
            clearGrid();
            state.visibleCount = 0;
        }

        const start = state.visibleCount;
        const end = Math.min(start + CONFIG.PAGE_SIZE, state.filteredItems.length);
        const itemsToRender = state.filteredItems.slice(start, end);

        if (itemsToRender.length === 0 && state.filteredItems.length === 0) {
            const empty = document.createElement('div');
            empty.className = 'no-results';
            empty.textContent = 'لا توجد منتجات تطابق الفلاتر';
            grid.appendChild(empty);
            state.visibleCount = 0;
            renderLoadMoreButton();
            updateTotalBadge();
            return;
        }

        const fragment = document.createDocumentFragment();
        itemsToRender.forEach((item, i) => {
            fragment.appendChild(Card.create(item, append ? 0 : i, state.filters.search));
        });
        grid.appendChild(fragment);

        state.visibleCount = end;
        renderLoadMoreButton();
        updateTotalBadge();
    }

    /* -------- Load More -------- */
    function renderLoadMoreButton() {
        if (!loadMoreArea) return;
        Utils.clearElement(loadMoreArea);

        if (state.visibleCount >= state.filteredItems.length) {
            if (state.filteredItems.length > 0) {
                const end = document.createElement('div');
                end.className = 'end-message';
                end.textContent = 'تم عرض جميع المنتجات';
                loadMoreArea.appendChild(end);
            }
            return;
        }

        const btn = document.createElement('button');
        btn.className = 'load-more-btn';
        const remaining = state.filteredItems.length - state.visibleCount;
        btn.textContent = `عرض المزيد (${Math.min(CONFIG.PAGE_SIZE, remaining)} من ${remaining})`;
        btn.addEventListener('click', () => renderPage(true));
        loadMoreArea.appendChild(btn);
    }

    /* -------- Apply Filters & Sort -------- */
    function applyFiltersAndSort() {
        state.filteredItems = FilterSort.apply(
            state.allItems,
            state.filters,
            state.sort,
            state.order
        );
        renderPage(false);
    }

    /* -------- Fetch from Server -------- */
    async function refreshFromServer() {
        if (state.abortController) state.abortController.abort();
        state.abortController = new AbortController();

        try {
            const result = await Api.fetchAll(state.abortController.signal);
            const newHash = Utils.itemsHash(result.items);
            const oldHash = await DB.getMeta('hash');

            state.allItems = result.items;
            state.total = result.total;

            // حفظ في IndexedDB
            await DB.saveProducts(result.items);
            await DB.setMeta('hash', newHash);
            await DB.setMeta('lastSync', Date.now());

            if (newHash !== oldHash) {
                Toast.show(`تم تحديث ${result.items.length} منتج`, 'success');
            }

            applyFiltersAndSort();
            return true;
        } catch (err) {
            if (err.name === 'AbortError') return false;
            console.error('Fetch error:', err);
            // فشل الاتصال بالسيرفر - نعتمد على IndexedDB
            if (state.allItems.length === 0) {
                await loadFromDB();
            } else {
                Toast.show('فشل تحديث البيانات - يتم عرض المخزنة', 'warning');
            }
            return false;
        }
    }

    /* -------- Load from IndexedDB -------- */
    async function loadFromDB() {
        try {
            const items = await DB.getAllProducts();
            if (items.length === 0) return false;

            state.allItems = items;
            state.total = items.length;

            const lastSync = await DB.getMeta('lastSync');
            if (lastSync) {
                const ago = Math.round((Date.now() - lastSync) / 60000);
                if (ago > 0) {
                    Toast.show(`عرض البيانات المخزنة (آخر تحديث: ${ago} دقيقة)`, 'info');
                }
            }

            applyFiltersAndSort();
            return true;
        } catch (e) {
            console.error('DB load error:', e);
            return false;
        }
    }

    /* -------- Initial Load -------- */
    async function initLoad() {
        state.isLoading = true;
        showSkeletons(6);

        // 1. جرّب IndexedDB أولاً (سريع جداً)
        const loadedFromDB = await loadFromDB();

        // 2. لو مفيش بيانات مخزنة أو انتهت صلاحيتها، اجلب من السيرفر
        const lastSync = await DB.getMeta('lastSync');
        const shouldSync = !lastSync ||
                          (Date.now() - lastSync) > CONFIG.REVALIDATE_THRESHOLD ||
                          !loadedFromDB;

        if (shouldSync) {
            if (loadedFromDB) {
                // نعرض المخزنة فوراً وفي الخلفية نجيب الجديد
                refreshFromServer();
            } else {
                // أول مرة - ننتظر الجلب
                const ok = await refreshFromServer();
                if (!ok) {
                    showError('فشل التحميل - تحقق من اتصالك بالإنترنت');
                }
            }
        }

        state.isLoading = false;
    }

    /* -------- Error State -------- */
    function showError(msg) {
        clearGrid();
        const box = document.createElement('div');
        box.className = 'error-box';
        const p = document.createElement('p');
        p.textContent = msg;
        const btn = document.createElement('button');
        btn.textContent = 'إعادة المحاولة';
        btn.addEventListener('click', initLoad);
        box.appendChild(p);
        box.appendChild(btn);
        grid.appendChild(box);
    }

    /* -------- Filters & Search Events -------- */
    const debouncedFilter = Utils.debounce(() => {
        applyFiltersAndSort();
    }, CONFIG.SEARCH_DEBOUNCE);

    // بحث
    searchInput.addEventListener('input', () => {
        state.filters.search = searchInput.value.trim();
        clearSearch.classList.toggle('show', state.filters.search.length > 0);
        debouncedFilter();
    });
    clearSearch.addEventListener('click', () => {
        searchInput.value = '';
        state.filters.search = '';
        clearSearch.classList.remove('show');
        debouncedFilter();
        searchInput.focus();
    });

    // ترتيب
    sortSelect.addEventListener('change', () => {
        state.sort = sortSelect.value;
        applyFiltersAndSort();
    });
    orderSelect.addEventListener('change', () => {
        state.order = orderSelect.value;
        applyFiltersAndSort();
    });

    // فتح/غلق لوحة الفلاتر
    filterToggle.addEventListener('click', () => {
        filtersPanel.classList.toggle('open');
        filterToggle.classList.toggle('active');
    });

    // فلتر التوفر
    document.querySelectorAll('#availChips .chip').forEach(chip => {
        chip.addEventListener('click', () => {
            document.querySelectorAll('#availChips .chip').forEach(c => c.classList.remove('active'));
            chip.classList.add('active');
            state.filters.availability = chip.dataset.avail;
            debouncedFilter();
        });
    });

    // النطاق السعري
    priceMin.addEventListener('input', () => {
        const v = priceMin.value === '' ? null : Number(priceMin.value);
        state.filters.priceMin = isNaN(v) ? null : v;
        debouncedFilter();
    });
    priceMax.addEventListener('input', () => {
        const v = priceMax.value === '' ? null : Number(priceMax.value);
        state.filters.priceMax = isNaN(v) ? null : v;
        debouncedFilter();
    });

    // نطاق الكمية
    qtyMin.addEventListener('input', () => {
        const v = qtyMin.value === '' ? null : Number(qtyMin.value);
        state.filters.qtyMin = isNaN(v) ? null : v;
        debouncedFilter();
    });
    qtyMax.addEventListener('input', () => {
        const v = qtyMax.value === '' ? null : Number(qtyMax.value);
        state.filters.qtyMax = isNaN(v) ? null : v;
        debouncedFilter();
    });

    // مخزون منخفض
    lowStockChip.addEventListener('click', () => {
        state.filters.lowStockOnly = !state.filters.lowStockOnly;
        lowStockChip.classList.toggle('active', state.filters.lowStockOnly);
        debouncedFilter();
    });

    // متوفر فقط
    inStockChip.addEventListener('click', () => {
        const isActive = inStockChip.classList.toggle('active');
        if (isActive) {
            document.querySelectorAll('#availChips .chip').forEach(c => c.classList.remove('active'));
            document.querySelector('[data-avail="available"]').classList.add('active');
            state.filters.availability = 'available';
        } else {
            document.querySelectorAll('#availChips .chip').forEach(c => c.classList.remove('active'));
            document.querySelector('[data-avail="all"]').classList.add('active');
            state.filters.availability = 'all';
        }
        debouncedFilter();
    });

    // إعادة تعيين
    resetFilters.addEventListener('click', () => {
        state.filters = {
            search: '', availability: 'all',
            priceMin: null, priceMax: null,
            qtyMin: null, qtyMax: null, lowStockOnly: false
        };
        searchInput.value = '';
        clearSearch.classList.remove('show');
        priceMin.value = '';
        priceMax.value = '';
        qtyMin.value = '';
        qtyMax.value = '';
        lowStockChip.classList.remove('active');
        inStockChip.classList.remove('active');
        document.querySelectorAll('#availChips .chip').forEach(c => c.classList.remove('active'));
        document.querySelector('[data-avail="all"]').classList.add('active');
        sortSelect.value = 'priority';
        orderSelect.value = 'desc';
        state.sort = 'priority';
        state.order = 'desc';
        applyFiltersAndSort();
        Toast.show('تم إعادة تعيين الفلاتر', 'success');
    });

    /* -------- Infinite Scroll -------- */
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting && state.visibleCount < state.filteredItems.length) {
                renderPage(true);
            }
        });
    }, { rootMargin: '300px 0px' });
    observer.observe(sentinel);

    /* -------- Cart Sidebar -------- */
    const cartSidebar = document.getElementById('cartSidebar');
    const cartOverlay = document.getElementById('cartOverlay');

    document.getElementById('cartBtn').addEventListener('click', () => {
        Cart.render();
        cartSidebar.classList.add('open');
        cartOverlay.classList.add('open');
    });
    document.getElementById('cartClose').addEventListener('click', closeCart);
    cartOverlay.addEventListener('click', closeCart);

    function closeCart() {
        cartSidebar.classList.remove('open');
        cartOverlay.classList.remove('open');
    }

    document.getElementById('cartCheckout').addEventListener('click', () => {
        const list = Cart.getAll();
        if (list.length === 0) {
            Toast.show('السلة فارغة', 'warning');
            return;
        }
        WhatsApp.order(list);
    });

    /* -------- Wishlist Button -------- */
    document.getElementById('wishlistBtn').addEventListener('click', () => {
        const list = Wishlist.getAll();
        if (list.length === 0) {
            Toast.show('لا توجد منتجات في المفضلة', 'warning');
            return;
        }
        Toast.show(`لديك ${list.length} منتج في المفضلة`, 'success');
    });

    /* -------- Public API -------- */
    return {
        init: function() {
            Cart.updateBadge();
            Cart.render();
            Wishlist.updateBadge();
            Connection.update();
            initLoad();
        },
        refreshFromServer
    };
})();

/* ================================================================
   [JS-15] BOOTSTRAP - بدء التطبيق
   ================================================================ */
window.App = App;
window.App.init();
</script>
</body>
</html>
