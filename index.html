<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قائمة المنتجات</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: #f4f7fc; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: auto; }
        h1 { text-align: center; color: #2c3e50; }
        .filters { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-bottom: 30px; }
        .filters button { padding: 10px 20px; border: none; border-radius: 30px; background: #ecf0f1; cursor: pointer; font-weight: bold; }
        .filters button.active { background: #3498db; color: white; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 25px; }
        .card { background: white; border-radius: 15px; padding: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); transition: 0.3s; text-align: center; }
        .card img { width: 100%; height: 180px; object-fit: cover; border-radius: 10px; background: #eee; }
        .card h3 { margin: 10px 0 5px; }
        .card .price { color: #27ae60; font-size: 22px; font-weight: bold; }
        .card .status { display: inline-block; padding: 5px 15px; border-radius: 20px; font-size: 14px; margin-top: 10px; }
        .status.available { background: #d4edda; color: #155724; }
        .status.unavailable { background: #f8d7da; color: #721c24; }
        .loading { text-align: center; font-size: 24px; padding: 50px; }
        .error { color: red; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍽️ قائمة طعامنا</h1>
        <div id="filterButtons" class="filters"></div>
        <div id="menuGrid" class="grid"></div>
    </div>

    <script>
        // ✏️ غيّر الرابط ده برابط Web App اللي خدته من جوجل Apps Script
        const API_URL = '  https://script.google.com/macros/s/AKfycbxuurZO98FfvtUqI7P-B9eIacBwTijI6VfZGj9JrHcxXA2mppq7znI1qIJKw8gJE58f/exec ';

        let allItems = [];
        let currentFilter = 'الكل';

        async function fetchMenu() {
            try {
                document.getElementById('menuGrid').innerHTML = '<div class="loading">⏳ جاري تحميل المنيو...</div>';
                const response = await fetch(`${API_URL}?action=getMenu`);
                const result = await response.json();
                
                if (result.error) throw new Error(result.error);
                allItems = result.data || [];
                renderFilters();
                renderMenu(currentFilter);
            } catch (error) {
                document.getElementById('menuGrid').innerHTML = `<div class="error">❌ فشل التحميل: ${error.message}</div>`;
            }
        }

        function renderFilters() {
            const categories = ['الكل', ...new Set(allItems.map(item => item.category).filter(Boolean))];
            const container = document.getElementById('filterButtons');
            container.innerHTML = categories.map(cat => 
                `<button class="${cat === currentFilter ? 'active' : ''}" onclick="filterItems('${cat}')">${cat}</button>`
            ).join('');
        }

        function filterItems(category) {
            currentFilter = category;
            document.querySelectorAll('#filterButtons button').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderMenu(category);
        }

        function renderMenu(category) {
            const grid = document.getElementById('menuGrid');
            const filtered = category === 'الكل' ? allItems : allItems.filter(item => item.category === category);
            
            if (filtered.length === 0) {
                grid.innerHTML = '<p style="text-align:center; grid-column: 1/-1;">لا توجد منتجات في هذا القسم</p>';
                return;
            }

            grid.innerHTML = filtered.map(item => `
                <div class="card">
                    <img src="${item.image || 'https://via.placeholder.com/250x180?text=No+Image'}" alt="${item.name}" onerror="this.src='https://via.placeholder.com/250x180?text=Error'">
                    <h3>${item.name}</h3>
                    <div class="price">${item.price} ج.م</div>
                    <span class="status ${item.available ? 'available' : 'unavailable'}">
                        ${item.available ? '✅ متوفر' : '❌ غير متوفر'}
                    </span>
                </div>
            `).join('');
        }

        // تحميل البيانات عند فتح الصفحة
        fetchMenu();
    </script>
</body>
</html>
