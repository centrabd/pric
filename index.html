
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كتالوج المنتجات - المتجر الذكي</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: #f4f7fc; padding: 25px 15px; padding-bottom: 90px; }
        .container { max-width: 1300px; margin: auto; }

        /* Header */
        .header { text-align: center; margin-bottom: 25px; }
        .header h1 { font-size: 32px; color: #1a2634; display: inline-block; position: relative; }
        .header p { color: #7f8c8d; margin-top: 10px; }
        .header .cache-badge { font-size: 12px; background: #e9edf2; padding: 4px 12px; border-radius: 20px; color: #555; display: inline-block; margin-top: 5px; }

        /* Controls */
        .controls { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-bottom: 25px; background: white; padding: 18px 25px; border-radius: 40px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); }
        .controls input, .controls select { padding: 10px 18px; border: 2px solid #e9edf2; border-radius: 30px; font-size: 15px; background: #f8fafc; outline: none; transition: 0.3s; }
        .controls input:focus, .controls select:focus { border-color: #3498db; background: white; }
        .controls .badge-count { background: #e9edf2; padding: 6px 18px; border-radius: 30px; font-size: 14px; color: #2c3e50; display: flex; align-items: center; }

        /* Grid & Cards */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 18px; padding: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.04); transition: 0.3s; display: flex; flex-direction: column; position: relative; border: 1px solid rgba(0,0,0,0.03); }
        .card:hover { transform: translateY(-5px); box-shadow: 0 12px 25px rgba(0,0,0,0.08); }
        
        .card-img { width: 100%; height: 160px; object-fit: cover; border-radius: 12px; background: #f8fafc; margin-bottom: 12px; cursor: pointer; }
        .wishlist-btn { position: absolute; top: 25px; left: 25px; background: rgba(255,255,255,0.9); border: none; font-size: 18px; cursor: pointer; border-radius: 50%; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        
        .card .code { font-size: 12px; color: #95a5a6; direction: ltr; text-align: left; margin-bottom: 6px; background: #f8fafc; padding: 2px 8px; border-radius: 20px; align-self: flex-start; }
        .card h3 { font-size: 18px; color: #1a2634; margin-bottom: 8px; cursor: pointer; min-height: 48px; line-height: 1.3; }
        
        .prices { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0; }
        .prices span { padding: 4px 10px; border-radius: 20px; font-size: 13px; font-weight: 600; }
        .prices .cash { color: #27ae60; background: #eafaf1; }
        .prices .inst { color: #2980b9; background: #eaf4fb; }

        .card-actions { margin-top: auto; padding-top: 10px; display: flex; gap: 8px; }
        .btn { flex: 1; padding: 10px; border: none; border-radius: 12px; font-weight: 600; cursor: pointer; transition: 0.2s; text-align: center; }
        .btn-cart { background: #3498db; color: white; }
        .btn-cart:hover { background: #2980b9; }

        /* Floating Cart Bar */
        .floating-cart { position: fixed; bottom: 20px; right: 20px; left: 20px; max-width: 500px; margin: auto; background: #1a2634; color: white; padding: 12px 24px; border-radius: 50px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,0.3); z-index: 999; }
        .floating-cart .wa-btn { background: #25d366; color: white; padding: 8px 18px; border-radius: 30px; text-decoration: none; font-weight: bold; border: none; cursor: pointer; }

        /* Modal Details */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; padding: 15px; }
        .modal-content { background: white; border-radius: 20px; max-width: 500px; width: 100%; padding: 25px; position: relative; }
        .close-modal { position: absolute; top: 15px; left: 15px; font-size: 20px; cursor: pointer; border: none; background: none; }

        /* Skeleton */
        .skeleton-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; width: 100%; }
        .skeleton-card { background: white; border-radius: 18px; padding: 15px; height: 320px; display: flex; flex-direction: column; gap: 10px; }
        .skeleton-line { background: linear-gradient(90deg, #f0f2f5 25%, #e4e7ec 50%, #f0f2f5 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 8px; }
        .skeleton-line.img { height: 140px; }
        .skeleton-line.title { height: 20px; width: 80%; }
        .skeleton-line.price { height: 18px; width: 50%; }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }

        .sentinel { height: 10px; grid-column: 1 / -1; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🛍️ كتالوج المنتجات</h1>
            <p>تصفح المنتجات وأطلب مباشرة عبر الواتساب</p>
            <div class="cache-badge" id="cacheStatus">📡 جاري التحميل...</div>
        </div>

        <!-- أدوات التحكم والتصفية -->
        <div class="controls">
            <input type="text" id="searchInput" placeholder="🔍 ابحث عن منتج..." />
            <select id="categorySelect">
                <option value="">جميع الأقسام</option>
            </select>
            <select id="sortSelect">
                <option value="name">الاسم</option>
                <option value="cashPrice">سعر الكاش</option>
                <option value="installPrice">سعر القسط</option>
            </select>
            <select id="orderSelect">
                <option value="asc">تصاعدي</option>
                <option value="desc">تنازلي</option>
            </select>
            <span class="badge-count" id="totalBadge">إجمالي: 0</span>
        </div>

        <!-- شبكة المنتجات -->
        <div id="productGrid" class="grid"></div>
        <div id="sentinel" class="sentinel"></div>
    </div>

    <!-- شريط السلة العائم -->
    <div class="floating-cart" id="floatingCart" style="display: none;">
        <div>🛒 العناصر: <span id="cartCount">0</span> | الإجمالي: <span id="cartTotal">0</span> ج.م</div>
        <button class="wa-btn" id="whatsappCheckoutBtn">📲 أطلب عبر WhatsApp</button>
    </div>

    <!-- نافذة تفاصيل المنتج -->
    <div class="modal" id="productModal">
        <div class="modal-content">
            <button class="close-modal" id="closeModal">✕</button>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        (function() {
            const CONFIG = {
                API_URL: 'https://script.google.com/macros/s/AKfycbxD8yE9o2-GQd0K8WDxdpfXD0C7O3LK6d9DINFxPeB7P2i95XrWzcaFDSQE0pP0bd1Q/exec',
                WHATSAPP_NUMBER: '201000000000', // ضع رقم الواتساب الخاص بالمتجر هنا
                CACHE_KEY: 'product_data_cache_v2',
                CACHE_EXPIRY: 5 * 60 * 1000,
                PAGE_LIMIT: 40
            };

            const state = {
                items: [],
                cart: JSON.parse(localStorage.getItem('cart_items') || '[]'),
                wishlist: JSON.parse(localStorage.getItem('wishlist_items') || '[]'),
                offset: 0,
                total: 0,
                hasMore: true,
                isLoading: false,
                search: '',
                category: '',
                sort: 'name',
                order: 'asc'
            };

            const dom = {
                grid: document.getElementById('productGrid'),
                sentinel: document.getElementById('sentinel'),
                searchInput: document.getElementById('searchInput'),
                categorySelect: document.getElementById('categorySelect'),
                sortSelect: document.getElementById('sortSelect'),
                orderSelect: document.getElementById('orderSelect'),
                totalBadge: document.getElementById('totalBadge'),
                cacheStatus: document.getElementById('cacheStatus'),
                floatingCart: document.getElementById('floatingCart'),
                cartCount: document.getElementById('cartCount'),
                cartTotal: document.getElementById('cartTotal'),
                whatsappBtn: document.getElementById('whatsappCheckoutBtn'),
                modal: document.getElementById('productModal'),
                modalBody: document.getElementById('modalBody'),
                closeModal: document.getElementById('closeModal')
            };

            // تتبع الأحداث (Analytics Event Tracker)
            function trackEvent(eventName, payload) {
                console.log(`[Analytics Event]: ${eventName}`, payload);
                // يمكن ربطه بـ gtag أو Facebook Pixel هنا
            }

            // إدارة السلة والمفضلة
            function saveCart() {
                localStorage.setItem('cart_items', JSON.stringify(state.cart));
                updateCartUI();
            }

            function saveWishlist() {
                localStorage.setItem('wishlist_items', JSON.stringify(state.wishlist));
            }

            function updateCartUI() {
                const totalQty = state.cart.reduce((sum, item) => sum + item.qty, 0);
                const totalPrice = state.cart.reduce((sum, item) => sum + (item.cashPrice * item.qty), 0);
                
                dom.cartCount.textContent = totalQty;
                dom.cartTotal.textContent = totalPrice;
                dom.floatingCart.style.display = totalQty > 0 ? 'flex' : 'none';
            }

            function addToCart(item) {
                const existing = state.cart.find(i => i.id === item.id);
                if (existing) {
                    existing.qty += 1;
                } else {
                    state.cart.push({ ...item, qty: 1 });
                }
                saveCart();
                trackEvent('add_to_cart', { id: item.id, name: item.name });
            }

            function toggleWishlist(id) {
                const index = state.wishlist.indexOf(id);
                if (index > -1) {
                    state.wishlist.splice(index, 1);
                } else {
                    state.wishlist.push(id);
                }
                saveWishlist();
                renderItems(true);
            }

            // تحويل الطلب إلى واتساب
            dom.whatsappBtn.addEventListener('click', () => {
                if (state.cart.length === 0) return;
                
                let text = "مرحباً، أريد إتمام طلب المنتجات التالية:\n\n";
                let total = 0;
                
                state.cart.forEach((item, index) => {
                    const subtotal = item.cashPrice * item.qty;
                    total += subtotal;
                    text += `${index + 1}. *${item.name}*\n   • الكود: ${item.id}\n   • الكمية: ${item.qty}\n   • السعر: ${subtotal} ج.م\n\n`;
                });

                text += `*الإجمالي الكلي:* ${total} ج.م`;
                
                trackEvent('checkout_whatsapp', { total, count: state.cart.length });
                const waUrl = `https://wa.me/${CONFIG.WHATSAPP_NUMBER}?text=${encodeURIComponent(text)}`;
                window.open(waUrl, '_blank');
            });

            // إنشاء بطاقات المنتجات أماناً بدون InnerHTML عشوائي (XSS Protection)
            function createCard(item) {
                const card = document.createElement('div');
                card.className = 'card';

                // زر المفضلة
                const wishBtn = document.createElement('button');
                wishBtn.className = 'wishlist-btn';
                wishBtn.textContent = state.wishlist.includes(item.id) ? '❤️' : '🤍';
                wishBtn.onclick = (e) => { e.stopPropagation(); toggleWishlist(item.id); };
                card.appendChild(wishBtn);

                // الصورة مع التحميل الكسلان
                const img = document.createElement('img');
                img.className = 'card-img';
                img.loading = 'lazy';
                img.src = item.image || 'https://via.placeholder.com/300x200?text=لا+توجد+صورة';
                img.alt = item.name;
                img.onclick = () => openModal(item);
                card.appendChild(img);

                const code = document.createElement('div');
                code.className = 'code';
                code.textContent = `📦 ${item.id}`;
                card.appendChild(code);

                const name = document.createElement('h3');
                name.textContent = item.name;
                name.onclick = () => openModal(item);
                card.appendChild(name);

                const pricesDiv = document.createElement('div');
                pricesDiv.className = 'prices';
                pricesDiv.innerHTML = `<span class="cash">💰 ${item.cashPrice} ج.م</span> <span class="inst">📆 ${item.installPrice} ج.م</span>`;
                card.appendChild(pricesDiv);

                const actions = document.createElement('div');
                actions.className = 'card-actions';
                
                const btnCart = document.createElement('button');
                btnCart.className = 'btn btn-cart';
                btnCart.textContent = '🛒 إضافة للسلة';
                btnCart.onclick = () => addToCart(item);
                
                actions.appendChild(btnCart);
                card.appendChild(actions);

                return card;
            }

            function openModal(item) {
                dom.modalBody.innerHTML = `
                    <img src="${item.image || 'https://via.placeholder.com/300x200'}" style="width:100%; border-radius:12px; margin-bottom:15px;">
                    <h2>${item.name}</h2>
                    <p style="color:#7f8c8d; margin: 8px 0;">الكود: ${item.id}</p>
                    <p style="margin: 10px 0;">سعر الكاش: <strong>${item.cashPrice} ج.م</strong></p>
                    <p style="margin: 10px 0;">سعر القسط: <strong>${item.installPrice} ج.م</strong></p>
                    <p style="margin: 10px 0;">الكمية المتاحة: <strong>${item.quantity}</strong></p>
                `;
                dom.modal.style.display = 'flex';
                trackEvent('view_item_modal', { id: item.id });
            }

            dom.closeModal.onclick = () => dom.modal.style.display = 'none';

            // عرض البطاقات
            function renderItems(reset) {
                if (reset) {
                    while (dom.grid.firstChild) {
                        if (dom.grid.firstChild.id === 'sentinel') break;
                        dom.grid.removeChild(dom.grid.firstChild);
                    }
                }

                state.items.forEach(item => {
                    dom.grid.appendChild(createCard(item));
                });

                if (dom.sentinel) dom.grid.appendChild(dom.sentinel);
            }

            // Fetch Logic
            async function fetchItems(reset = false) {
                if (state.isLoading) return;
                state.isLoading = true;

                if (reset) {
                    dom.grid.innerHTML = '<div class="skeleton-grid">' + '<div class="skeleton-card"><div class="skeleton-line img"></div><div class="skeleton-line title"></div><div class="skeleton-line price"></div></div>'.repeat(6) + '</div>';
                    dom.grid.appendChild(dom.sentinel);
                    state.offset = 0;
                    state.items = [];
                }

                try {
                    const params = new URLSearchParams({
                        action: 'getMenu',
                        offset: state.offset,
                        limit: CONFIG.PAGE_LIMIT,
                        search: state.search,
                        sort: state.sort,
                        order: state.order
                    });

                    const res = await fetch(`${CONFIG.API_URL}?${params}`);
                    const result = await res.json();
                    
                    const newItems = result.data || [];
                    state.total = result.total || 0;
                    state.items = reset ? newItems : [...state.items, ...newItems];
                    state.hasMore = state.items.length < state.total;
                    state.offset += CONFIG.PAGE_LIMIT;

                    renderItems(reset);
                    dom.totalBadge.textContent = `إجمالي: ${state.total}`;
                    dom.cacheStatus.textContent = `✅ متصل بالسيرفر`;
                } catch (e) {
                    dom.cacheStatus.textContent = `⚠️ خطأ في الاتصال`;
                } finally {
                    state.isLoading = false;
                }
            }

            // Intersection Observer للـ Infinite Scroll
            const observer = new IntersectionObserver((entries) => {
                if (entries[0].isIntersecting && state.hasMore && !state.isLoading) {
                    fetchItems(false);
                }
            }, { rootMargin: '0px 0px 200px 0px' });

            observer.observe(dom.sentinel);

            // الأحداث والبحث
            let timeout = null;
            function onFilterChange() {
                clearTimeout(timeout);
                timeout = setTimeout(() => {
                    state.search = dom.searchInput.value;
                    state.sort = dom.sortSelect.value;
                    state.order = dom.orderSelect.value;
                    fetchItems(true);
                }, 300);
            }

            dom.searchInput.addEventListener('input', onFilterChange);
            dom.sortSelect.addEventListener('change', onFilterChange);
            dom.orderSelect.addEventListener('change', onFilterChange);

            // التشغيل الأولي
            updateCartUI();
            fetchItems(true);
        })();
    </script>
</body>
</html>
