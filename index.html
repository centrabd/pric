<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="كتالوج منتجات - استعرض أحدث المنتجات والأسعار">
<meta name="theme-color" content="#3498db">
<title>كتالوج المنتجات</title>

<style>
/* ================================================================
   [01] VARIABLES - المتغيرات العامة (عدّل الألوان من هنا)
   ================================================================ */
:root {
    /* الألوان الأساسية */
    --color-primary: #3498db;
    --color-primary-dark: #2980b9;
    --color-success: #27ae60;
    --color-danger: #e74c3c;
    --color-warning: #e67e22;
    --color-whatsapp: #25D366;
    --color-whatsapp-dark: #1da851;
    --color-info: #2980b9;

    /* الخلفيات */
    --bg-main: #f0f4f9;
    --bg-card: #ffffff;
    --bg-input: #f8fafc;
    --bg-muted: #f0f2f5;
    --bg-badge: #e9edf2;

    /* النصوص */
    --text-primary: #1a2634;
    --text-secondary: #555;
    --text-muted: #95a5a6;

    /* الحدود */
    --border-color: #e9edf2;
    --border-hover: #3498db;

    /* الظلال */
    --shadow-sm: 0 2px 10px rgba(0,0,0,0.04);
    --shadow-md: 0 4px 15px rgba(0,0,0,0.04);
    --shadow-lg: 0 10px 25px rgba(0,0,0,0.08);
    --shadow-xl: 0 10px 30px rgba(0,0,0,0.15);

    /* الزوايا */
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --radius-xl: 20px;
    --radius-full: 40px;

    /* المسافات */
    --space-xs: 4px;
    --space-sm: 8px;
    --space-md: 12px;
    --space-lg: 16px;
    --space-xl: 24px;
    --space-2xl: 32px;

    /* الخطوط */
    --font-sm: 12px;
    --font-base: 14px;
    --font-md: 15px;
    --font-lg: 17px;
    --font-xl: 20px;
    --font-2xl: 24px;

    /* الحركة */
    --transition-fast: 0.2s ease;
    --transition-base: 0.3s ease;

    /* الطبقات */
    --z-modal: 9999;
    --z-cart: 9999;
    --z-toast: 10001;
}

/* الوضع الداكن التلقائي */
@media (prefers-color-scheme: dark) {
    :root {
        --bg-main: #1a1d23;
        --bg-card: #2d3139;
        --bg-input: #363b44;
        --bg-muted: #3d424b;
        --bg-badge: #3d424b;
        --text-primary: #f1f5f9;
        --text-secondary: #a0aec0;
        --text-muted: #718096;
        --border-color: #4a5568;
    }
}


/* ================================================================
   [02] BASE - إعادة الضبط والأساسيات
   ================================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }

body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: var(--bg-main);
    color: var(--text-primary);
    padding: var(--space-xl);
    min-height: 100vh;
    line-height: 1.5;
    transition: background var(--transition-base), color var(--transition-base);
}

.skip-link {
    position: absolute; top: -100px; left: 50%;
    transform: translateX(-50%);
    background: var(--color-primary); color: #fff;
    padding: var(--space-md) var(--space-xl);
    border-radius: var(--radius-sm);
    z-index: var(--z-toast);
    text-decoration: none;
    transition: top var(--transition-fast);
}
.skip-link:focus { top: 10px; }

:focus-visible { outline: 3px solid var(--color-primary); outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
    }
}

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

.container { max-width: 1400px; margin: auto; }


/* ================================================================
   [03] HEADER - رأس الصفحة
   ================================================================ */
.header {
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: var(--space-lg);
    margin-bottom: var(--space-xl);
    background: var(--bg-card); padding: var(--space-lg) var(--space-xl);
    border-radius: var(--radius-lg); box-shadow: var(--shadow-sm);
}

.header-title {
    font-size: var(--font-2xl); color: var(--text-primary);
    display: flex; align-items: center; gap: var(--space-sm);
}

.header-actions { display: flex; gap: var(--space-sm); }

.header-btn {
    background: var(--bg-input); border: 2px solid var(--border-color);
    padding: var(--space-sm) var(--space-lg);
    border-radius: var(--radius-full); cursor: pointer;
    display: flex; align-items: center; gap: 6px;
    transition: var(--transition-base);
    font-weight: 600; color: var(--text-primary);
    font-family: inherit; font-size: var(--font-base);
}
.header-btn:hover { border-color: var(--border-hover); color: var(--border-hover); }

.badge-count {
    background: var(--color-danger); color: #fff;
    border-radius: 20px; padding: 2px 8px;
    font-size: var(--font-sm); font-weight: 700;
    min-width: 22px; text-align: center;
}


/* ================================================================
   [04] CONTROLS - البحث والترتيب
   ================================================================ */
.controls {
    display: flex; flex-wrap: wrap; gap: var(--space-md); align-items: center;
    background: var(--bg-card); padding: var(--space-lg) var(--space-xl);
    border-radius: var(--radius-lg); box-shadow: var(--shadow-sm);
    margin-bottom: var(--space-lg);
}

.controls input[type="text"] {
    flex: 2; min-width: 220px;
    padding: 10px 18px;
    border: 2px solid var(--border-color);
    border-radius: var(--radius-full);
    font-size: var(--font-md); outline: none;
    background: var(--bg-input); transition: var(--transition-base);
    color: var(--text-primary); font-family: inherit;
}
.controls input[type="text"]:focus {
    border-color: var(--color-primary); background: var(--bg-card);
}

.controls select {
    padding: 10px 16px;
    border: 2px solid var(--border-color);
    border-radius: var(--radius-full);
    font-size: var(--font-base); outline: none;
    background: var(--bg-input); cursor: pointer;
    transition: var(--transition-base); color: var(--text-primary);
    font-family: inherit;
}
.controls select:focus {
    border-color: var(--color-primary); background: var(--bg-card);
}

.total-info {
    background: var(--bg-badge); padding: 6px 16px;
    border-radius: var(--radius-full);
    font-size: var(--font-base); font-weight: 600; color: var(--text-primary);
}


/* ================================================================
   [05] GRID - الشبكة العامة
   ================================================================ */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
    gap: var(--space-xl);
    min-height: 100px;
}

.sentinel { height: 1px; width: 100%; }


/* ================================================================
   [06] CARD - بطاقة المنتج (✏️ عدّل التصميم من هنا)
   ================================================================ */
.card {
    background: var(--bg-card); border-radius: var(--radius-lg);
    padding: var(--space-lg); box-shadow: var(--shadow-md);
    border: 1px solid rgba(0,0,0,0.02);
    display: flex; flex-direction: column;
    transition: transform var(--transition-base), box-shadow var(--transition-base);
    will-change: transform;
    animation: cardFadeIn 0.4s ease backwards;
}
.card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }

@keyframes cardFadeIn {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
}

.card .code {
    font-size: var(--font-sm); color: var(--text-muted);
    direction: ltr; text-align: left;
    background: var(--bg-muted); padding: 3px 10px;
    border-radius: 30px; align-self: flex-start;
    margin-bottom: var(--space-sm); font-weight: 600;
}

.card h3 {
    font-size: var(--font-lg); color: var(--text-primary);
    margin-bottom: var(--space-sm); line-height: 1.4;
    min-height: 46px;
    cursor: pointer;
    transition: color var(--transition-fast);
}
.card h3:hover { color: var(--color-primary); }

.card .prices { display: flex; gap: var(--space-sm); flex-wrap: wrap; margin-bottom: var(--space-sm); }
.card .prices span {
    padding: 5px 12px; border-radius: 30px;
    font-size: 13px; font-weight: 700;
}
.card .prices .cash { color: var(--color-success); background: #eafaf1; }
.card .prices .inst { color: var(--color-info); background: #eaf4fb; }

.card .qty { font-size: 13px; color: var(--text-secondary); margin-bottom: var(--space-sm); }
.card .qty strong { color: var(--color-warning); }

.card .status-badge {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 5px 14px; border-radius: var(--radius-full);
    font-size: 13px; font-weight: 700;
    align-self: flex-start;
    transition: background var(--transition-fast), color var(--transition-fast);
}
.card .status-badge.available { background: #d4edda; color: #155724; }
.card .status-badge.unavailable { background: #f8d7da; color: #721c24; }

.card .card-actions {
    display: flex; gap: 6px; margin-top: auto;
    padding-top: var(--space-md);
    border-top: 1px solid var(--bg-muted);
}
.card .card-actions button {
    padding: 8px 10px; border: none;
    border-radius: 30px; cursor: pointer;
    font-size: 13px; font-weight: 700;
    display: inline-flex; align-items: center; justify-content: center;
    gap: 4px; transition: var(--transition-fast);
    flex: 1; font-family: inherit;
}
.card .btn-whatsapp { background: var(--color-whatsapp); color: #fff; flex: 2; }
.card .btn-whatsapp:hover { background: var(--color-whatsapp-dark); }
.card .btn-cart { background: var(--bg-badge); color: var(--text-primary); }
.card .btn-cart:hover { background: var(--color-primary); color: #fff; }
.card .btn-cart.in-cart { background: var(--color-success); color: #fff; }
.card .btn-wishlist { background: var(--bg-badge); color: var(--color-danger); flex: 0.6; }
.card .btn-wishlist:hover { background: #fde8e8; }
.card .btn-wishlist.in-wishlist { background: #fde8e8; color: var(--color-danger); }


/* ================================================================
   [07] SKELETON - هياكل التحميل
   ================================================================ */
.skeleton-card {
    background: var(--bg-card); border-radius: var(--radius-lg);
    padding: var(--space-lg); box-shadow: var(--shadow-md);
    border: 1px solid var(--bg-muted);
    min-height: 260px;
    display: flex; flex-direction: column; gap: var(--space-md);
}
.skeleton-line {
    background: linear-gradient(90deg, var(--bg-muted) 25%, var(--bg-badge) 50%, var(--bg-muted) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
    border-radius: 10px;
}
.skeleton-line.title { height: 20px; width: 80%; }
.skeleton-line.price { height: 18px; width: 60%; }
.skeleton-line.qty { height: 16px; width: 40%; }
.skeleton-line.status { height: 20px; width: 50%; }

@keyframes shimmer {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
}


/* ================================================================
   [08] LOAD MORE - زر المزيد ورسالة النهاية
   ================================================================ */
.load-more-area {
    display: flex; justify-content: center; align-items: center;
    padding: var(--space-xl) 0; min-height: 70px;
}

.load-more-btn {
    padding: var(--space-md) var(--space-2xl);
    background: var(--color-primary); color: #fff;
    border: none; border-radius: var(--radius-full);
    font-size: var(--font-md); font-weight: 700;
    cursor: pointer; transition: var(--transition-base);
    display: inline-flex; align-items: center; gap: var(--space-sm);
    box-shadow: 0 4px 15px rgba(52,152,219,0.3);
    font-family: inherit;
}
.load-more-btn:hover:not(:disabled) {
    background: var(--color-primary-dark);
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(52,152,219,0.4);
}
.load-more-btn:disabled { opacity: 0.6; cursor: wait; transform: none; }

.spinner {
    display: inline-block; width: 20px; height: 20px;
    border: 3px solid rgba(255,255,255,0.3);
    border-top-color: #fff; border-radius: 50%;
    animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.end-message {
    text-align: center; color: var(--text-muted);
    font-size: var(--font-base); padding: var(--space-xl); font-weight: 600;
}

.error-box {
    text-align: center; padding: var(--space-2xl);
    color: var(--color-danger); background: #fde8e8;
    border-radius: var(--radius-md); grid-column: 1 / -1;
}
.error-box button {
    margin-top: var(--space-md); padding: 10px 25px;
    background: var(--color-danger); color: #fff;
    border: none; border-radius: 30px; cursor: pointer; font-weight: 700;
    font-family: inherit;
}


/* ================================================================
   [09] MODAL - نافذة تفاصيل المنتج
   ================================================================ */
.modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    z-index: var(--z-modal);
    justify-content: center; align-items: center;
    padding: var(--space-xl);
}
.modal-overlay.open { display: flex; }

.modal-box {
    background: var(--bg-card); border-radius: var(--radius-xl);
    max-width: 550px; width: 100%;
    padding: var(--space-2xl);
    max-height: 90vh; overflow-y: auto;
    position: relative; animation: slideUp var(--transition-base);
    scrollbar-gutter: stable;
}
@keyframes slideUp {
    from { transform: translateY(30px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
}

.modal-close {
    position: absolute; top: 12px; left: 18px;
    background: none; border: none; cursor: pointer;
    color: var(--text-muted); width: 36px; height: 36px;
    border-radius: 50%; transition: var(--transition-fast);
    display: flex; align-items: center; justify-content: center;
}
.modal-close:hover { background: var(--bg-muted); color: var(--text-primary); }

.modal-box h2 {
    font-size: var(--font-xl); margin-bottom: var(--space-md);
    color: var(--text-primary); padding-left: 40px;
}

.modal-box .detail-row {
    display: flex; justify-content: space-between;
    padding: 10px 0; border-bottom: 1px solid var(--bg-muted);
    font-size: var(--font-md);
}
.modal-box .detail-row:last-of-type { border-bottom: none; }
.modal-box .detail-row strong { color: var(--text-primary); }

.modal-actions { display: flex; gap: var(--space-sm); margin-top: var(--space-xl); flex-wrap: wrap; }
.modal-actions button {
    flex: 1; min-width: 100px;
    padding: var(--space-md) var(--space-lg);
    border: none; border-radius: var(--radius-md);
    font-size: var(--font-base); font-weight: 700;
    cursor: pointer; transition: var(--transition-fast);
    font-family: inherit;
}
.modal-actions .btn-primary { background: var(--color-whatsapp); color: #fff; flex: 2; }
.modal-actions .btn-primary:hover { background: var(--color-whatsapp-dark); }
.modal-actions .btn-secondary { background: var(--bg-badge); color: var(--text-primary); }
.modal-actions .btn-secondary:hover { background: #d5dbe3; }


/* ================================================================
   [10] CART - سلة التسوق الجانبية
   ================================================================ */
.cart-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.4); z-index: 9998;
}
.cart-overlay.open { display: block; }

.cart-sidebar {
    position: fixed; top: 0; left: -420px;
    width: 400px; max-width: 90vw; height: 100%;
    background: var(--bg-card); z-index: var(--z-cart);
    padding: var(--space-xl); transition: left var(--transition-base);
    display: flex; flex-direction: column;
    box-shadow: 4px 0 20px rgba(0,0,0,0.1);
    overscroll-behavior: contain;
}
.cart-sidebar.open { left: 0; }

.cart-header {
    display: flex; justify-content: space-between; align-items: center;
    padding-bottom: var(--space-lg);
    border-bottom: 2px solid var(--bg-muted);
    margin-bottom: var(--space-lg);
}
.cart-header h2 { font-size: var(--font-xl); color: var(--text-primary); }
.cart-header button {
    background: none; border: none; cursor: pointer;
    color: var(--text-muted); padding: 4px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    transition: var(--transition-fast);
}
.cart-header button:hover { background: var(--bg-muted); color: var(--text-primary); }

.cart-items { flex: 1; overflow-y: auto; }
.cart-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: var(--space-md) 0;
    border-bottom: 1px solid var(--bg-muted);
}
.cart-item-info h4 { font-size: var(--font-base); color: var(--text-primary); margin-bottom: 4px; }
.cart-item-info p { font-size: var(--font-sm); color: var(--text-muted); }
.cart-item-actions { display: flex; align-items: center; gap: 6px; }
.cart-item-actions button {
    width: 28px; height: 28px; border-radius: 50%; border: none;
    background: var(--bg-badge); cursor: pointer; font-weight: bold;
    display: flex; align-items: center; justify-content: center;
    transition: var(--transition-fast); color: var(--text-primary);
}
.cart-item-actions button:hover { background: var(--color-primary); color: #fff; }
.cart-item-actions span { min-width: 24px; text-align: center; font-weight: 700; }

.cart-empty { text-align: center; padding: var(--space-2xl) var(--space-lg); color: var(--text-muted); }

.cart-total {
    padding-top: var(--space-lg);
    border-top: 2px solid var(--bg-muted);
    display: flex; justify-content: space-between;
    font-size: var(--font-lg); font-weight: 700;
    color: var(--text-primary); margin-bottom: var(--space-md);
}

.cart-checkout {
    width: 100%; padding: var(--space-lg);
    background: var(--color-whatsapp); color: #fff;
    border: none; border-radius: var(--radius-md);
    font-size: var(--font-md); font-weight: 700;
    cursor: pointer; transition: var(--transition-fast);
    display: flex; align-items: center; justify-content: center; gap: var(--space-sm);
    font-family: inherit;
}
.cart-checkout:hover:not(:disabled) { background: var(--color-whatsapp-dark); }
.cart-checkout:disabled { opacity: 0.5; cursor: not-allowed; }


/* ================================================================
   [11] TOAST - الإشعارات
   ================================================================ */
.toast-container {
    position: fixed; top: var(--space-xl); right: var(--space-xl);
    z-index: var(--z-toast);
    display: flex; flex-direction: column; gap: var(--space-sm);
    pointer-events: none;
}
.toast {
    pointer-events: auto;
    background: var(--bg-card); padding: var(--space-md) var(--space-lg);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-xl);
    border-right: 4px solid var(--color-primary);
    display: flex; align-items: center; gap: var(--space-sm);
    font-size: var(--font-base); font-weight: 600;
    color: var(--text-primary);
    animation: slideInRight var(--transition-base);
    max-width: 350px;
}
.toast.success { border-right-color: var(--color-success); }
.toast.error { border-right-color: var(--color-danger); }
.toast.warning { border-right-color: var(--color-warning); }

@keyframes slideInRight {
    from { transform: translateX(100px); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
}


/* ================================================================
   [12] RESPONSIVE - التجاوب مع الشاشات
   ================================================================ */
@media (max-width: 768px) {
    body { padding: var(--space-lg); }
    .header { flex-direction: column; }
    .controls { flex-direction: column; align-items: stretch; }
    .controls input[type="text"] { min-width: unset; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: var(--space-md); }
    .cart-sidebar { width: 100%; left: -100%; }
    .toast-container { top: 10px; right: 10px; left: 10px; }
    .toast { max-width: unset; }
}
@media (max-width: 480px) {
    .grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<!-- ================================================================
     [HTML-01] SKIP LINK & TOAST
     ================================================================ -->
<a href="#productGrid" class="skip-link">تخطي إلى المحتوى</a>
<div class="toast-container" id="toastContainer" role="log" aria-live="polite"></div>


<!-- ================================================================
     [HTML-02] MAIN CONTAINER
     ================================================================ -->
<div class="container">

    <!-- [HTML-02.1] الهيدر -->
    <header class="header" role="banner">
        <h1 class="header-title">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
            كتالوج المنتجات
        </h1>
        <div class="header-actions">
            <button class="header-btn" id="wishlistBtn" aria-label="عرض المفضلة">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                المفضلة <span class="badge-count" id="wishlistCount">0</span>
            </button>
            <button class="header-btn" id="cartBtn" aria-label="عرض سلة التسوق">

<script>
/* ================================================================
   [JS-01] CONFIG - الإعدادات العامة (✏️ عدّل من هنا)
   ================================================================ */
const CONFIG = Object.freeze({
    API_URL: 'https://script.google.com/macros/s/AKfycbxD8yE9o2-GQd0K8WDxdpfXD0C7O3LK6d9DINFxPeB7P2i95XrWzcaFDSQE0pP0bd1Q/exec',
    WHATSAPP_PHONE: '201234567890',       // بدون +
    PAGE_SIZE: 20,
    CACHE_KEY: 'products_cache_v3',
    CACHE_TTL: 5 * 60 * 1000,             // 5 دقائق
    CART_KEY: 'cart_v3',
    WISHLIST_KEY: 'wishlist_v3',
    SEARCH_DEBOUNCE: 400,
    MAX_TOASTS: 4
});


/* ================================================================
   [JS-02] UTILS - دوال مساعدة عامة
   ================================================================ */
const Utils = (function() {
    'use strict';

    function escapeHtml(text) {
        if (text === undefined || text === null) return '';
        const div = document.createElement('div');
        div.textContent = String(text);
        return div.innerHTML;
    }

    function debounce(fn, delay) {
        let timer = null;
        return function(...args) {
            clearTimeout(timer);
            timer = setTimeout(() => fn.apply(this, args), delay);
        };
    }

    function formatNumber(n) {
        return (Number(n) || 0).toLocaleString('ar-EG');
    }

    function toNumber(v, fallback = 0) {
        const n = Number(v);
        return isNaN(n) ? fallback : n;
    }

    function safeGetItem(key, fallback) {
        try {
            const raw = localStorage.getItem(key);
            return raw ? JSON.parse(raw) : fallback;
        } catch (e) { return fallback; }
    }

    function safeSetItem(key, value) {
        try {
            localStorage.setItem(key, JSON.stringify(value));
            return true;
        } catch (e) { return false; }
    }

    function safeRemove(el) {
        if (el && el.parentNode) el.parentNode.removeChild(el);
    }

    function clearElement(el) {
        while (el && el.firstChild) el.removeChild(el.firstChild);
    }

    return { escapeHtml, debounce, formatNumber, toNumber, safeGetItem, safeSetItem, safeRemove, clearElement };
})();


/* ================================================================
   [JS-03] CACHE - إدارة الكاش في localStorage
   ================================================================ */
const Cache = (function() {
    'use strict';

    function get() {
        try {
            const raw = localStorage.getItem(CONFIG.CACHE_KEY);
            if (!raw) return null;
            const data = JSON.parse(raw);
            if (Date.now() - data.timestamp > CONFIG.CACHE_TTL) return null;
            return data;
        } catch (e) { return null; }
    }

    function set(items, total) {
        try {
            localStorage.setItem(CONFIG.CACHE_KEY, JSON.stringify({
                items, total, timestamp: Date.now()
            }));
        } catch (e) { /* storage full */ }
    }

    function clear() {
        try { localStorage.removeItem(CONFIG.CACHE_KEY); } catch (e) {}
    }

    return { get, set, clear };
})();


/* ================================================================
   [JS-04] STATE - الحالة العامة
   ================================================================ */
const State = (function() {
    'use strict';

    const state = {
        items: [],
        offset: 0,
        total: 0,
        hasMore: true,
        isLoading: false,
        search: '',
        sort: 'name',
        order: 'asc',
        abortController: null
    };

    function get() { return state; }

    return { get };
})();


/* ================================================================
   [JS-05] TOAST - الإشعارات المنبثقة
   ================================================================ */
const Toast = (function() {
    'use strict';
    const container = document.getElementById('toastContainer');

    function show(message, type = 'success', duration = 3000) {
        if (!container) return;

        while (container.children.length >= CONFIG.MAX_TOASTS) {
            container.removeChild(container.firstChild);
        }

        const toast = document.createElement('div');
        toast.className = 'toast ' + type;
        toast.textContent = message;
        toast.setAttribute('role', 'status');
        container.appendChild(toast);

        setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transform = 'translateX(100px)';
            setTimeout(() => Utils.safeRemove(toast), 300);
        }, duration);
    }

    return { show };
})();


/* ================================================================
   [JS-06] WISHLIST - منطق المفضلة
   ================================================================ */
const Wishlist = (function() {
    'use strict';

    function getAll() { return Utils.safeGetItem(CONFIG.WISHLIST_KEY, []); }

    function save(items) {
        Utils.safeSetItem(CONFIG.WISHLIST_KEY, items);
        updateBadge();
    }

    function isIn(id) {
        return getAll().some(i => String(i.id) === String(id));
    }

    function toggle(item) {
        const list = getAll();
        const idx = list.findIndex(i => String(i.id) === String(item.id));
        let added;
        if (idx > -1) {
            list.splice(idx, 1);
            added = false;
        } else {
            list.push({
                id: String(item.id),
                name: String(item.name),
                cashPrice: Utils.toNumber(item.cashPrice),
                installPrice: Utils.toNumber(item.installPrice),
                quantity: Utils.toNumber(item.quantity)
            });
            added = true;
        }
        save(list);
        return added;
    }

    function clear() { save([]); }

    function updateBadge() {
        const el = document.getElementById('wishlistCount');
        if (el) el.textContent = getAll().length;
    }

    return { getAll, isIn, toggle, clear, updateBadge };
})();


/* ================================================================
   [JS-07] CART - منطق السلة
   ================================================================ */
const Cart = (function() {
    'use strict';

    function getAll() { return Utils.safeGetItem(CONFIG.CART_KEY, []); }

    function save(items) {
        Utils.safeSetItem(CONFIG.CART_KEY, items);
        updateBadge();
        render();
    }

    function isIn(id) {
        return getAll().some(i => String(i.id) === String(id));
    }

    function add(item) {
        if (!item.available) {
            Toast.show('هذا المنتج غير متوفر حالياً', 'warning');
            return false;
        }
        const list = getAll();
        const existing = list.find(i => String(i.id) === String(item.id));
        if (existing) {
            if (existing.quantity >= (item.quantity || 0)) {
                Toast.show('الكمية المطلوبة غير متوفرة', 'warning');
                return false;
            }
            existing.quantity = Utils.toNumber(existing.quantity) + 1;
        } else {
            list.push({
                id: String(item.id),
                name: String(item.name),
                cashPrice: Utils.toNumber(item.cashPrice),
                installPrice: Utils.toNumber(item.installPrice),
                quantity: 1,
                maxQuantity: Utils.toNumber(item.quantity)
            });
        }
        save(list);
        return true;
    }

    function remove(id) {
        save(getAll().filter(i => String(i.id) !== String(id)));
    }

    function toggle(item) {
        if (isIn(item.id)) {
            remove(item.id);
            return false;
        }
        return add(item);
    }

    function changeQty(id, delta) {
        const list = getAll();
        const item = list.find(i => String(i.id) === String(id));
        if (!item) return;
        const newQty = Utils.toNumber(item.quantity) + delta;
        if (newQty < 1) return;
        if (item.maxQuantity && newQty > item.maxQuantity) {
            Toast.show('لا يمكن تجاوز الكمية المتاحة', 'warning');
            return;
        }
        item.quantity = newQty;
        save(list);
    }

    function clear() { save([]); }

    function getTotal() {
        return getAll().reduce(
            (sum, i) => sum + (Utils.toNumber(i.cashPrice) * Utils.toNumber(i.quantity)),
            0
        );
    }

    function updateBadge() {
        const el = document.getElementById('cartCount');
        if (el) el.textContent = getAll().length;
    }

    function render() {
        const container = document.getElementById('cartItems');
        const totalEl = document.getElementById('cartTotalPrice');
        const checkoutBtn = document.getElementById('cartCheckout');
        if (!container) return;

        const list = getAll();
        Utils.clearElement(container);

        if (list.length === 0) {
            const empty = document.createElement('div');
            empty.className = 'cart-empty';
            empty.textContent = 'السلة فارغة';
            container.appendChild(empty);
            if (totalEl) totalEl.textContent = '0 ج.م';
            if (checkoutBtn) checkoutBtn.disabled = true;
            return;
        }

        if (checkoutBtn) checkoutBtn.disabled = false;

        list.forEach(item => {
            const div = document.createElement('div');
            div.className = 'cart-item';

            const info = document.createElement('div');
            info.className = 'cart-item-info';
            const h4 = document.createElement('h4');
            h4.textContent = item.name;
            const p = document.createElement('p');
            p.textContent = `${Utils.formatNumber(item.cashPrice)} ج.م × ${item.quantity}`;
            info.appendChild(h4);
            info.appendChild(p);

            const actions = document.createElement('div');
            actions.className = 'cart-item-actions';

            const minusBtn = document.createElement('button');
            minusBtn.textContent = '−';
            minusBtn.setAttribute('aria-label', 'تقليل الكمية');
            minusBtn.addEventListener('click', () => changeQty(item.id, -1));

            const qtySpan = document.createElement('span');
            qtySpan.textContent = item.quantity;

            const plusBtn = document.createElement('button');
            plusBtn.textContent = '+';
            plusBtn.setAttribute('aria-label', 'زيادة الكمية');
            plusBtn.addEventListener('click', () => changeQty(item.id, 1));

            const removeBtn = document.createElement('button');
            removeBtn.textContent = '×';
            removeBtn.setAttribute('aria-label', 'إزالة من السلة');
            removeBtn.style.background = '#fee';
            removeBtn.style.color = 'var(--color-danger)';
            removeBtn.addEventListener('click', () => remove(item.id));

            actions.appendChild(minusBtn);
            actions.appendChild(qtySpan);
            actions.appendChild(plusBtn);
            actions.appendChild(removeBtn);

            div.appendChild(info);
            div.appendChild(actions);
            container.appendChild(div);
        });

        if (totalEl) totalEl.textContent = `${Utils.formatNumber(getTotal())} ج.م`;
    }

    return { getAll, isIn, add, remove, toggle, changeQty, clear, getTotal, updateBadge, render };
})();


/* ================================================================
   [JS-08] WHATSAPP - إرسال الطلبات
   ================================================================ */
const WhatsApp = (function() {
    'use strict';

    function buildMessage(items) {
        const arr = Array.isArray(items) ? items : [items];
        if (arr.length === 0) return '';
        let msg = 'مرحباً، أرغب في طلب المنتجات التالية:\n\n';
        let total = 0;
        arr.forEach((item, i) => {
            const qty = Utils.toNumber(item.quantity) || 1;
            total += Utils.toNumber(item.cashPrice) * qty;
            msg += `${i + 1}. ${item.name}\n`;
            msg += `   الكود: ${item.id}\n`;
            msg += `   السعر: ${item.cashPrice} ج.م\n`;
            msg += `   الكمية: ${qty}\n\n`;
        });
        msg += `المجموع: ${total} ج.م`;
        return msg;
    }

    function order(items) {
        const arr = Array.isArray(items) ? items : [items];
        if (arr.length === 0) {
            Toast.show('لا توجد منتجات للطلب', 'warning');
            return;
        }
        const msg = buildMessage(arr);
        window.open(`https://wa.me/${CONFIG.WHATSAPP_PHONE}?text=${encodeURIComponent(msg)}`, '_blank');
    }

    return { order, buildMessage };
})();


/* ================================================================
   [JS-09] API - طلبات الشبكة
   ================================================================ */
const Api = (function() {
    'use strict';

    function buildUrl(offset, search, sort, order) {
        const params = new URLSearchParams({
            action: 'getMenu',
            offset: String(offset),
            limit: String(CONFIG.PAGE_SIZE),
            search: search || '',
            sort: sort || 'name',
            order: order || 'asc'
        });
        return `${CONFIG.API_URL}?${params.toString()}`;
    }

    async function fetchPage(offset, search, sort, order, signal) {
        const res = await fetch(buildUrl(offset, search, sort, order), { signal });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const result = await res.json();
        if (result.error) throw new Error(result.error);
        return {
            items: result.data || [],
            total: result.total || 0
        };
    }

    return { fetchPage, buildUrl };
})();


/* ================================================================
   [JS-10] CARD - بناء بطاقة المنتج
   ✏️ عدّل تصميم البطاقة من هنا بسهولة
   ================================================================ */
const Card = (function() {
    'use strict';

    function svgWishlist(filled) {
        const fill = filled ? 'var(--color-danger)' : 'none';
        return `<svg width="14" height="14" viewBox="0 0 24 24" fill="${fill}" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>`;
    }

    function create(item, index = 0) {
        const card = document.createElement('article');
        card.className = 'card';
        card.setAttribute('role', 'article');
        card.setAttribute('aria-label', item.name);
        card.style.animationDelay = `${index * 0.03}s`;

        // كود المنتج
        const code = document.createElement('div');
        code.className = 'code';
        code.textContent = item.id;
        card.appendChild(code);

        // الاسم
        const name = document.createElement('h3');
        name.textContent = item.name;
        name.setAttribute('role', 'button');
        name.setAttribute('tabindex', '0');
        name.addEventListener('click', () => Modal.open(item));
        name.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                Modal.open(item);
            }
        });
        card.appendChild(name);

        // الأسعار
        const prices = document.createElement('div');
        prices.className = 'prices';
        const cash = document.createElement('span');
        cash.className = 'cash';
        cash.textContent = `${Utils.formatNumber(item.cashPrice)} ج.م كاش`;
        const inst = document.createElement('span');
        inst.className = 'inst';
        inst.textContent = `${Utils.formatNumber(item.installPrice)} ج.م قسط`;
        prices.appendChild(cash);
        prices.appendChild(inst);
        card.appendChild(prices);

        // الكمية
        const qty = document.createElement('div');
        qty.className = 'qty';
        qty.innerHTML = `الكمية: <strong>${Utils.formatNumber(item.quantity)}</strong>`;
        card.appendChild(qty);

        // الحالة
        const status = document.createElement('span');
        status.className = 'status-badge ' + (item.available ? 'available' : 'unavailable');
        status.setAttribute('role', 'status');
        status.textContent = item.available ? 'متوفر' : 'غير متوفر';
        card.appendChild(status);

        // الأزرار
        const actions = document.createElement('div');
        actions.className = 'card-actions';

        const waBtn = document.createElement('button');
        waBtn.className = 'btn-whatsapp';
        waBtn.textContent = 'اطلب';
        waBtn.addEventListener('click', () => WhatsApp.order(item));
        actions.appendChild(waBtn);

        const cartBtn = document.createElement('button');
        const inCart = Cart.isIn(item.id);
        cartBtn.className = 'btn-cart' + (inCart ? ' in-cart' : '');
        cartBtn.textContent = inCart ? 'في السلة' : 'أضف';
        cartBtn.addEventListener('click', () => {
            const added = Cart.toggle(item);
            cartBtn.textContent = added ? 'في السلة' : 'أضف';
            cartBtn.classList.toggle('in-cart', added);
            Toast.show(added ? 'تمت الإضافة للسلة' : 'حُذف من السلة', added ? 'success' : 'warning');
        });
        actions.appendChild(cartBtn);

        const wishBtn = document.createElement('button');
        const inWish = Wishlist.isIn(item.id);
        wishBtn.className = 'btn-wishlist' + (inWish ? ' in-wishlist' : '');
        wishBtn.innerHTML = svgWishlist(inWish);
        wishBtn.setAttribute('aria-label', inWish ? 'إزالة من المفضلة' : 'أضف للمفضلة');
        wishBtn.addEventListener('click', () => {
            const added = Wishlist.toggle(item);
            wishBtn.innerHTML = svgWishlist(added);
            wishBtn.classList.toggle('in-wishlist', added);
            wishBtn.setAttribute('aria-label', added ? 'إزالة من المفضلة' : 'أضف للمفضلة');
            Toast.show(added ? 'أُضيف للمفضلة' : 'حُذف من المفضلة', added ? 'success' : 'warning');
        });
        actions.appendChild(wishBtn);

        card.appendChild(actions);
        return card;
    }

    return { create };
})();


/* ================================================================
   [JS-11] MODAL - نافذة تفاصيل المنتج
   ================================================================ */
const Modal = (function() {
    'use strict';
    const modal = document.getElementById('productModal');
    const els = {
        name: document.getElementById('modalName'),
        code: document.getElementById('modalCode'),
        cash: document.getElementById('modalCash'),
        inst: document.getElementById('modalInst'),
        qty: document.getElementById('modalQty'),
        status: document.getElementById('modalStatus'),
        waBtn: document.getElementById('modalWhatsapp'),
        cartBtn: document.getElementById('modalCart'),
        wishBtn: document.getElementById('modalWishlist'),
        closeBtn: document.getElementById('modalClose')
    };
    let lastFocused = null;

    function open(item) {
        lastFocused = document.activeElement;
        if (els.name) els.name.textContent = item.name;
        if (els.code) els.code.textContent = item.id;
        if (els.cash) els.cash.textContent = Utils.formatNumber(item.cashPrice);
        if (els.inst) els.inst.textContent = Utils.formatNumber(item.installPrice);
        if (els.qty) els.qty.textContent = Utils.formatNumber(item.quantity);
        if (els.status) {
            els.status.textContent = item.available ? 'متوفر' : 'غير متوفر';
            els.status.style.color = item.available ? 'var(--color-success)' : 'var(--color-danger)';
        }
        if (els.waBtn) els.waBtn.onclick = () => WhatsApp.order(item);
        if (els.cartBtn) els.cartBtn.onclick = () => {
            const added = Cart.toggle(item);
            Toast.show(added ? 'تمت الإضافة للسلة' : 'حُذف من السلة', added ? 'success' : 'warning');
        };
        if (els.wishBtn) els.wishBtn.onclick = () => {
            const added = Wishlist.toggle(item);
            Toast.show(added ? 'أُضيف للمفضلة' : 'حُذف من المفضلة', added ? 'success' : 'warning');
        };

        modal.classList.add('open');
        modal.setAttribute('aria-hidden', 'false');
        document.body.style.overflow = 'hidden';
        setTimeout(() => els.closeBtn && els.closeBtn.focus(), 100);
    }

    function close() {
        modal.classList.remove('open');
        modal.setAttribute('aria-hidden', 'true');
        document.body.style.overflow = '';
        if (lastFocused && lastFocused.focus) lastFocused.focus();
    }

    if (els.closeBtn) els.closeBtn.addEventListener('click', close);
    modal.addEventListener('click', (e) => { if (e.target === modal) close(); });
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && modal.classList.contains('open')) close();
    });

    return { open, close };
})();


/* ================================================================
   [JS-12] APP - نقطة التشغيل الرئيسية
   ================================================================ */
(function App() {
    'use strict';

    const grid = document.getElementById('productGrid');
    const loadMoreArea = document.getElementById('loadMoreArea');
    const sentinel = document.getElementById('sentinel');
    const searchInput = document.getElementById('searchInput');
    const sortSelect = document.getElementById('sortSelect');
    const orderSelect = document.getElementById('orderSelect');
    const totalBadge = document.getElementById('totalBadge');

    const state = State.get();

    // ---------- Grid helpers ----------
    function clearGrid() { Utils.clearElement(grid); }

    function showSkeletons(count = 6) {
        clearGrid();
        const fragment = document.createDocumentFragment();
        for (let i = 0; i < count; i++) {
            const sk = document.createElement('div');
            sk.className = 'skeleton-card';
            sk.setAttribute('aria-hidden', 'true');
            sk.innerHTML = '<div class="skeleton-line title"></div><div class="skeleton-line price"></div><div class="skeleton-line qty"></div><div class="skeleton-line status"></div>';
            fragment.appendChild(sk);
        }
        grid.appendChild(fragment);
    }

    function renderItems(items, append = false) {
        if (!append) clearGrid();
        const fragment = document.createDocumentFragment();
        items.forEach((item, i) => {
            fragment.appendChild(Card.create(item, append ? 0 : i));
        });
        grid.appendChild(fragment);
    }

    function updateTotalBadge() {
        if (totalBadge) {
            totalBadge.textContent = `إجمالي: ${Utils.formatNumber(state.total)} (معروض: ${Utils.formatNumber(state.items.length)})`;
        }
    }

    // ---------- Load More ----------
    function renderLoadMoreButton() {
        if (!loadMoreArea) return;
        Utils.clearElement(loadMoreArea);

        if (state.isLoading) {
            const btn = document.createElement('button');
            btn.className = 'load-more-btn';
            btn.disabled = true;
            const spinner = document.createElement('span');
            spinner.className = 'spinner';
            btn.appendChild(spinner);
            btn.appendChild(document.createTextNode(' جاري التحميل...'));
            loadMoreArea.appendChild(btn);
            return;
        }

        if (!state.hasMore && state.items.length > 0) {
            const end = document.createElement('div');
            end.className = 'end-message';
            end.textContent = 'تم عرض جميع المنتجات';
            loadMoreArea.appendChild(end);
            return;
        }

        if (state.hasMore) {
            const btn = document.createElement('button');
            btn.className = 'load-more-btn';
            btn.textContent = `عرض المزيد (${CONFIG.PAGE_SIZE})`;
            btn.addEventListener('click', fetchNextPage);
            loadMoreArea.appendChild(btn);
        }
    }

    // ---------- Fetch ----------
    async function fetchFirstPage() {
        if (state.abortController) state.abortController.abort();
        state.abortController = new AbortController();

        state.isLoading = true;
        state.offset = 0;
        state.items = [];

        // عرض الكاش فوراً
        const cached = Cache.get();
        if (cached && cached.items && cached.items.length > 0) {
            state.items = cached.items;
            state.total = cached.total;
            state.hasMore = state.items.length < state.total;
            renderItems(state.items, false);
            updateTotalBadge();
            renderLoadMoreButton();
            state.isLoading = false;
            revalidateInBackground();
            return;
        }

        showSkeletons(6);
        renderLoadMoreButton();

        try {
            const result = await Api.fetchPage(
                state.offset, state.search, state.sort, state.order,
                state.abortController.signal
            );
            state.items = result.items;
            state.total = result.total;
            state.hasMore = state.items.length < state.total;
            Cache.set(result.items, result.total);
            renderItems(state.items, false);
            updateTotalBadge();
        } catch (err) {
            if (err.name === 'AbortError') return;
            showError(err.message);
            Toast.show('فشل التحميل', 'error');
        } finally {
            state.isLoading = false;
            renderLoadMoreButton();
        }
    }

    async function fetchNextPage() {
        if (state.isLoading || !state.hasMore) return;

        state.isLoading = true;
        state.offset = state.items.length;
        renderLoadMoreButton();

        try {
            const result = await Api.fetchPage(
                state.offset, state.search, state.sort, state.order
            );
            state.items = state.items.concat(result.items);
            state.total = result.total;
            state.hasMore = state.items.length < state.total;
            renderItems(result.items, true);
            updateTotalBadge();
        } catch (err) {
            Toast.show('فشل التحميل الإضافي: ' + err.message, 'error');
        } finally {
            state.isLoading = false;
            renderLoadMoreButton();
        }
    }

    async function revalidateInBackground() {
        try {
            const result = await Api.fetchPage(0, state.search, state.sort, state.order);
            Cache.set(result.items, result.total);
        } catch (e) { /* silent */ }
    }

    function showError(msg) {
        clearGrid();
        const box = document.createElement('div');
        box.className = 'error-box';
        const p = document.createElement('p');
        p.textContent = 'فشل التحميل: ' + msg;
        const btn = document.createElement('button');
        btn.textContent = 'إعادة المحاولة';
        btn.addEventListener('click', fetchFirstPage);
        box.appendChild(p);
        box.appendChild(btn);
        grid.appendChild(box);
    }

    // ---------- Search/Sort ----------
    const debouncedSearch = Utils.debounce(() => {
        state.search = searchInput.value.trim();
        state.sort = sortSelect.value;
        state.order = orderSelect.value;
        fetchFirstPage();
    }, CONFIG.SEARCH_DEBOUNCE);

    searchInput.addEventListener('input', debouncedSearch);
    sortSelect.addEventListener('change', debouncedSearch);
    orderSelect.addEventListener('change', debouncedSearch);

    // ---------- Infinite Scroll ----------
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting && state.hasMore && !state.isLoading && state.items.length > 0) {
                fetchNextPage();
            }
        });
    }, { rootMargin: '300px 0px' });
    observer.observe(sentinel);

    // ---------- Cart Sidebar ----------
    const cartSidebar = document.getElementById('cartSidebar');
    const cartOverlay = document.getElementById('cartOverlay');

    document.getElementById('cartBtn').addEventListener('click', () => {
        Cart.render();
        cartSidebar.classList.add('open');
        cartOverlay.classList.add('open');
    });
    document.getElementById('cartClose').addEventListener('click', closeCart);
    cartOverlay.addEventListener('click', closeCart);

    function closeCart() {
        cartSidebar.classList.remove('open');
        cartOverlay.classList.remove('open');
    }

    document.getElementById('cartCheckout').addEventListener('click', () => {
        const list = Cart.getAll();
        if (list.length === 0) {
            Toast.show('السلة فارغة', 'warning');
            return;
        }
        WhatsApp.order(list);
    });

    // ---------- Wishlist Button ----------
    document.getElementById('wishlistBtn').addEventListener('click', () => {
        const list = Wishlist.getAll();
        if (list.length === 0) {
            Toast.show('لا توجد منتجات في المفضلة', 'warning');
            return;
        }
        Toast.show(`لديك ${list.length} منتج في المفضلة`, 'success');
    });

    // ---------- Init ----------
    Cart.updateBadge();
    Cart.render();
    Wishlist.updateBadge();
    fetchFirstPage();

})();
</script>
</body>
