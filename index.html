        cartBtn.textContent = inCart ? 'في السلة' : 'أضف';
        cartBtn.setAttribute('aria-label', inCart ? `${item.name} في السلة` : `إضافة ${item.name} للسلة`);
        cartBtn.setAttribute('aria-pressed', inCart ? 'true' : 'false');
        cartBtn.addEventListener('click', () => {
            const added = Cart.toggle(item);
            cartBtn.textContent = added ? 'في السلة' : 'أضف';
            cartBtn.classList.toggle('in-cart', added);
            cartBtn.setAttribute('aria-pressed', added ? 'true' : 'false');
            cartBtn.setAttribute('aria-label', added ? `${item.name} في السلة` : `إضافة ${item.name} للسلة`);
            Toast.show(added ? 'تمت الإضافة للسلة' : 'حُذف من السلة', added ? 'success' : 'warning');
        });
        actions.appendChild(cartBtn);

        const wishBtn = document.createElement('button');
        wishBtn.type = 'button';
        const inWish = Wishlist.isIn(item.id);
        wishBtn.className = 'btn-wishlist' + (inWish ? ' in-wishlist' : '');
        wishBtn.innerHTML = svgWishlist(inWish);
        wishBtn.setAttribute('aria-label', inWish ? `إزالة ${item.name} من المفضلة` : `إضافة ${item.name} للمفضلة`);
        wishBtn.setAttribute('aria-pressed', inWish ? 'true' : 'false');
        wishBtn.addEventListener('click', () => {
            const added = Wishlist.toggle(item);
            wishBtn.innerHTML = svgWishlist(added);
            wishBtn.classList.toggle('in-wishlist', added);
            wishBtn.setAttribute('aria-pressed', added ? 'true' : 'false');
            wishBtn.setAttribute('aria-label', added ? `إزالة ${item.name} من المفضلة` : `إضافة ${item.name} للمفضلة`);
            Toast.show(added ? 'أُضيف للمفضلة' : 'حُذف من المفضلة', added ? 'success' : 'warning');
        });
        actions.appendChild(wishBtn);

        card.appendChild(actions);

        // اسم الزر لفتح الـ modal
        nameBtn.addEventListener('click', () => Modal.open(item));

        return card;
    }

    return { create };
})();

/* ================================================================
   [JS-13] MODAL - 🔥 FIX #2 (audit): خيارات كاش/قسط
   ================================================================ */
const Modal = (function() {
    'use strict';
    const modal = document.getElementById('productModal');
    const els = {
        imageWrap: document.getElementById('modalImageWrap'),
        image: document.getElementById('modalImage'),
        name: document.getElementById('modalName'),
        code: document.getElementById('modalCode'),
        cash: document.getElementById('modalCash'),
        inst: document.getElementById('modalInst'),
        qty: document.getElementById('modalQty'),
        status: document.getElementById('modalStatus'),
        waCashBtn: document.getElementById('modalWhatsappCash'),
        waInstBtn: document.getElementById('modalWhatsappInst'),
        cartBtn: document.getElementById('modalCart'),
        wishBtn: document.getElementById('modalWishlist'),
        closeBtn: document.getElementById('modalClose')
    };
    let lastFocused = null;

    function trapFocus(e) {
        if (e.key !== 'Tab') return;
        const focusable = modal.querySelectorAll(
            'button:not([disabled]), [tabindex]:not([tabindex="-1"])'
        );
        if (focusable.length === 0) return;
        const first = focusable[0];
        const last = focusable[focusable.length - 1];
        if (e.shiftKey && document.activeElement === first) {
            e.preventDefault(); last.focus();
        } else if (!e.shiftKey && document.activeElement === last) {
            e.preventDefault(); first.focus();
        }
    }

    function open(item) {
        lastFocused = document.activeElement;

        if (item.image && els.imageWrap && els.image) {
            els.imageWrap.classList.remove('hidden');
            els.imageWrap.classList.remove('no-image');
            els.image.src = item.image;
            els.image.alt = item.name || 'صورة المنتج';
            els.image.onerror = function() {
                this.src = 'data:image/svg+xml;utf8,' + encodeURIComponent(
                    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#bdc3c7" stroke-width="1"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>'
                );
                this.alt = 'صورة غير متاحة';
            };
        } else if (els.imageWrap) {
            els.imageWrap.classList.remove('hidden');
            els.imageWrap.classList.add('no-image');
            if (els.image) els.image.src = '';
        }

        if (els.name) els.name.textContent = item.name;
        if (els.code) els.code.textContent = item.id;
        if (els.cash) els.cash.textContent = Utils.formatNumber(item.cashPrice);
        if (els.inst) els.inst.textContent = Utils.formatNumber(item.installPrice);
        if (els.qty) els.qty.textContent = Utils.formatNumber(item.quantity);
        if (els.status) {
            els.status.textContent = item.available ? '✓ متوفر' : '✗ غير متوفر';
            els.status.style.color = item.available ? 'var(--color-success)' : 'var(--color-danger-light)';
        }

        // 🔥 FIX #2: زرّان منفصلان
        if (els.waCashBtn) {
            els.waCashBtn.onclick = () => WhatsApp.order(item, 'cash');
            els.waCashBtn.setAttribute('aria-label', `طلب ${item.name} كاش عبر واتساب`);
        }
        if (els.waInstBtn) {
            els.waInstBtn.onclick = () => WhatsApp.order(item, 'installment');
            els.waInstBtn.setAttribute('aria-label', `طلب ${item.name} تقسيط عبر واتساب`);
            els.waInstBtn.style.display = item.installPrice > 0 ? '' : 'none';
        }

        if (els.cartBtn) {
            const inCart = Cart.isIn(item.id);
            els.cartBtn.textContent = inCart ? '✓ في السلة' : 'إضافة للسلة';
            els.cartBtn.setAttribute('aria-label', inCart ? `${item.name} في السلة` : `إضافة ${item.name} للسلة`);
            els.cartBtn.onclick = () => {
                const added = Cart.toggle(item);
                els.cartBtn.textContent = added ? '✓ في السلة' : 'إضافة للسلة';
                els.cartBtn.setAttribute('aria-label', added ? `${item.name} في السلة` : `إضافة ${item.name} للسلة`);
                Toast.show(added ? 'تمت الإضافة للسلة' : 'حُذف من السلة', added ? 'success' : 'warning');
            };
        }
        if (els.wishBtn) {
            const inWish = Wishlist.isIn(item.id);
            els.wishBtn.textContent = inWish ? '✓ في المفضلة' : 'إضافة للمفضلة';
            els.wishBtn.setAttribute('aria-label', inWish ? `${item.name} في المفضلة` : `إضافة ${item.name} للمفضلة`);
            els.wishBtn.onclick = () => {
                const added = Wishlist.toggle(item);
                els.wishBtn.textContent = added ? '✓ في المفضلة' : 'إضافة للمفضلة';
                els.wishBtn.setAttribute('aria-label', added ? `${item.name} في المفضلة` : `إضافة ${item.name} للمفضلة`);
                Toast.show(added ? 'أُضيف للمفضلة' : 'حُذف من المفضلة', added ? 'success' : 'warning');
            };
        }

        modal.classList.add('open');
        modal.setAttribute('aria-hidden', 'false');
        document.body.style.overflow = 'hidden';
        modal.addEventListener('keydown', trapFocus);
        setTimeout(() => els.closeBtn && els.closeBtn.focus(), 50);
    }

    function close() {
        modal.classList.remove('open');
        modal.setAttribute('aria-hidden', 'true');
        document.body.style.overflow = '';
        modal.removeEventListener('keydown', trapFocus);
        if (els.image) els.image.src = '';
        if (lastFocused && lastFocused.focus) lastFocused.focus();
    }

    if (els.closeBtn) els.closeBtn.addEventListener('click', close);
    modal.addEventListener('click', (e) => { if (e.target === modal) close(); });
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && modal.classList.contains('open')) close();
    });

    return { open, close };
})();

/* ================================================================
   [JS-14] APP - ✅ FIX #72, #63, #64, #73, #75
   ================================================================ */
const App = (function() {
    'use strict';

    const state = State.get();
    const grid = document.getElementById('productGrid');
    const loadMoreArea = document.getElementById('loadMoreArea');
    const sentinel = document.getElementById('sentinel');
    const searchInput = document.getElementById('searchInput');
    const clearSearch = document.getElementById('clearSearch');
    const sortSelect = document.getElementById('sortSelect');
    const orderSelect = document.getElementById('orderSelect');
    const totalBadge = document.getElementById('totalBadge');
    const filterToggle = document.getElementById('filterToggle');
    const filtersPanel = document.getElementById('filtersPanel');
    const priceMin = document.getElementById('priceMin');
    const priceMax = document.getElementById('priceMax');
    const qtyMin = document.getElementById('qtyMin');
    const qtyMax = document.getElementById('qtyMax');
    const lowStockChip = document.getElementById('lowStockChip');
    const resetFilters = document.getElementById('resetFilters');
    const lastUpdateLabel = document.getElementById('lastUpdateLabel');
    const versionLabel = document.getElementById('versionLabel');

    function clearGrid() { Utils.clearElement(grid); }

    function showSkeletons(count = 6) {
        clearGrid();
        const fragment = document.createDocumentFragment();
        for (let i = 0; i < count; i++) {
            const sk = document.createElement('div');
            sk.className = 'skeleton-card';
            sk.setAttribute('aria-hidden', 'true');
            sk.innerHTML = '<div class="skeleton-line img"></div><div class="skeleton-line title"></div><div class="skeleton-line price"></div><div class="skeleton-line status"></div>';
            fragment.appendChild(sk);
        }
        grid.appendChild(fragment);
    }

    function updateTotalBadge() {
        if (!totalBadge) return;
        const filtered = state.filteredItems.length;
        const visible = state.visibleCount;
        const total = state.total;
        let text = `${Utils.formatNumber(visible)} / ${Utils.formatNumber(filtered)}`;
        if (filtered !== total) text += ` (من ${Utils.formatNumber(total)})`;
        totalBadge.textContent = text;
    }

    function updateLastUpdateLabel() {
        if (!lastUpdateLabel) return;
        if (state.lastUpdateFromServer) {
            lastUpdateLabel.textContent = 'آخر تحديث: ' + state.lastUpdateFromServer;
        } else if (state.lastSyncTime) {
            lastUpdateLabel.textContent = 'آخر تحديث: ' + Utils.timeAgo(state.lastSyncTime);
        } else {
            lastUpdateLabel.textContent = '';
        }
    }

    // ✅ FIX #72: finally { isRendering = false }
    function renderPage(append = false) {
        if (state.isRendering) return;
        state.isRendering = true;
        try {
            if (!append) {
                clearGrid();
                state.visibleCount = 0;
            }

            const start = state.visibleCount;
            const end = Math.min(start + CONFIG.PAGE_SIZE, state.filteredItems.length);
            const itemsToRender = state.filteredItems.slice(start, end);

            if (itemsToRender.length === 0 && state.filteredItems.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'no-results';
                empty.textContent = 'لا توجد منتجات تطابق البحث';
                empty.setAttribute('role', 'status');
                grid.appendChild(empty);
                renderLoadMoreButton();
                updateTotalBadge();
                return;
            }

            let chunkIndex = 0;
            const chunkSize = CONFIG.RENDER_CHUNK_SIZE;

            function renderChunk() {
                const chunkStart = chunkIndex * chunkSize;
                const chunkEnd = Math.min(chunkStart + chunkSize, itemsToRender.length);

                if (chunkStart >= itemsToRender.length) {
                    state.visibleCount = end;
                    renderLoadMoreButton();
                    updateTotalBadge();
                    state.isRendering = false;
                    return;
                }

                const fragment = document.createDocumentFragment();
                for (let i = chunkStart; i < chunkEnd; i++) {
                    fragment.appendChild(Card.create(itemsToRender[i], append ? 0 : i, state.filters.search));
                }
                grid.appendChild(fragment);

                chunkIndex++;

                if (chunkEnd < itemsToRender.length) {
                    Utils.scheduleIdle(renderChunk, 50);
                } else {
                    state.visibleCount = end;
                    renderLoadMoreButton();
                    updateTotalBadge();
                    state.isRendering = false;
                }
            }

            renderChunk();
        } catch (err) {
            // ✅ FIX #72: ضمان تحرير الراية
            state.isRendering = false;
            console.error('Render error:', err);
            Toast.show('خطأ في العرض', 'error');
        }
    }

    function renderLoadMoreButton() {
        if (!loadMoreArea) return;
        Utils.clearElement(loadMoreArea);
        if (state.visibleCount >= state.filteredItems.length) {
            if (state.filteredItems.length > 0) {
                const end = document.createElement('div');
                end.className = 'end-message';
                end.textContent = `✓ تم عرض جميع المنتجات (${Utils.formatNumber(state.filteredItems.length)})`;
                end.setAttribute('role', 'status');
                loadMoreArea.appendChild(end);
            }
            return;
        }
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'load-more-btn';
        const remaining = state.filteredItems.length - state.visibleCount;
        btn.textContent = `عرض المزيد (${Math.min(CONFIG.PAGE_SIZE, remaining)} من ${remaining})`;
        btn.setAttribute('aria-label', `تحميل ${Math.min(CONFIG.PAGE_SIZE, remaining)} منتج إضافي`);
        btn.addEventListener('click', () => renderPage(true));
        loadMoreArea.appendChild(btn);
    }

    function applyFiltersAndSort() {
        state.filteredItems = FilterSort.apply(
            state.allItems, state.filters, state.sort, state.order
        );
        // ✅ FIX #91: reset visibleCount
        state.visibleCount = 0;
        renderPage(false);
    }

    // ✅ FIX #63, #64: sequence + قائمة abort
    async function refreshFromServer() {
        const prevItems = state.allItems.slice();
        const prevTotal = state.total;
        const seq = ++state.fetchSequence;

        const controller = new AbortController();
        state.abortControllers.add(controller);
        // abort القديم
        state.abortControllers.forEach(c => {
            if (c !== controller) { try { c.abort(); } catch(_) {} }
        });

        try {
            const result = await Api.fetchAll(controller.signal);
            // ✅ FIX #64: تجاهل النتائج القديمة
            if (seq !== state.fetchSequence) return { success: false, reason: 'stale' };

            const newHash = Utils.itemsHash(result.items);
            const oldHash = await DB.getMeta('hash');

            state.allItems = result.items;
            state.total = result.total;
            state.lastSyncTime = Date.now();
            if (result.lastUpdate) state.lastUpdateFromServer = result.lastUpdate;

            // re-sync wishlist
            Wishlist.resync(result.items);

            // حفظ في DB
            Utils.scheduleIdle(async () => {
                await DB.saveProducts(result.items);
                await DB.setMeta('hash', newHash);
                await DB.setMeta('lastSync', state.lastSyncTime);
            }, 500);

            if (newHash !== oldHash && prevItems.length > 0) {
                Toast.show(`✓ تم تحديث ${result.items.length} منتج`, 'success');
            }

            applyFiltersAndSort();
            updateLastUpdateLabel();
            return { success: true, updated: newHash !== oldHash };
        } catch (err) {
            if (err.name === 'AbortError') return { success: false, reason: 'abort' };

            console.error('Fetch error:', err);

            if (prevItems.length > 0) {
                state.allItems = prevItems;
                state.total = prevTotal;
                applyFiltersAndSort();
            } else {
                const dbLoaded = await loadFromDB();
                if (!dbLoaded) showError(getErrorMessage(err));
            }
            return {
                success: false,
                reason: getErrorMessage(err) || 'unknown',
                fullError: err.message
            };
        } finally {
            state.abortControllers.delete(controller);
        }
    }

    function getErrorMessage(err) {
        const msg = err.message || '';
        if (msg.startsWith('TIMEOUT:')) return 'انتهت مهلة الاتصال';
        if (msg.startsWith('NETWORK:')) return 'تعذر الاتصال بالخادم';
        if (msg.startsWith('HTTP:')) return msg.substring(5);
        if (msg.startsWith('FORMAT:')) return msg.substring(7);
        if (msg.startsWith('SERVER:')) return msg.substring(7);
        return msg || 'حدث خطأ غير متوقع';
    }

    async function loadFromDB() {
        try {
            const items = await DB.getAllProducts();
            if (!items || items.length === 0) return false;
            state.allItems = items;
            state.total = items.length;
            const lastSync = await DB.getMeta('lastSync');
            state.lastSyncTime = lastSync;
            applyFiltersAndSort();
            updateLastUpdateLabel();
            return true;
        } catch (e) { return false; }
    }

    async function initLoad() {
        state.isLoading = true;
        showSkeletons(6);

        const loadedFromDB = await loadFromDB();
        const lastSync = await DB.getMeta('lastSync');
        const shouldSync = !lastSync ||
            (Date.now() - lastSync) > CONFIG.REVALIDATE_THRESHOLD ||
            !loadedFromDB;

        if (shouldSync) {
            if (loadedFromDB) {
                // ✅ FIX #65: await آمن
                refreshFromServer().then(res => {
                    if (res && res.success) Connection.setBanner('✓ تم تحديث البيانات', 'success', 2500);
                }).catch(() => {});
            } else {
                const res = await refreshFromServer();
                if (!res || !res.success) {
                    if (res && res.reason === 'stale') return;
                    showError(res && res.reason ? res.reason : 'تعذر تحميل البيانات');
                }
            }
        } else {
            updateLastUpdateLabel();
        }

        state.isLoading = false;
    }

    function showError(msg) {
        clearGrid();
        const box = document.createElement('div');
        box.className = 'error-box';
        box.setAttribute('role', 'alert');
        const p = document.createElement('p');
        p.textContent = msg;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = 'إعادة المحاولة';
        btn.setAttribute('aria-label', 'إعادة محاولة تحميل البيانات');
        btn.addEventListener('click', initLoad);
        box.appendChild(p);
        box.appendChild(btn);
        grid.appendChild(box);
    }

    /* -------- Events -------- */
    const debouncedFilter = Utils.debounce(applyFiltersAndSort, CONFIG.SEARCH_DEBOUNCE);

    searchInput.addEventListener('input', () => {
        state.filters.search = searchInput.value.trim();
        clearSearch.classList.toggle('show', state.filters.search.length > 0);
        debouncedFilter();
    });
    clearSearch.addEventListener('click', () => {
        searchInput.value = '';
        state.filters.search = '';
        clearSearch.classList.remove('show');
        debouncedFilter();
        searchInput.focus();
    });

    sortSelect.addEventListener('change', () => {
        state.sort = sortSelect.value;
        applyFiltersAndSort();
    });
    orderSelect.addEventListener('change', () => {
        state.order = orderSelect.value;
        applyFiltersAndSort();
    });

    filterToggle.addEventListener('click', () => {
        const isOpen = filtersPanel.classList.toggle('open');
        filterToggle.classList.toggle('active', isOpen);
        filterToggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    });

    // ✅ FIX #74: استخدام closest بدل querySelectorAll المتكرر
    document.getElementById('availChips').addEventListener('click', (e) => {
        const chip = e.target.closest('.chip');
        if (!chip) return;
        const chips = e.currentTarget.querySelectorAll('.chip');
        chips.forEach(c => {
            c.classList.remove('active');
            c.setAttribute('aria-checked', 'false');
        });
        chip.classList.add('active');
        chip.setAttribute('aria-checked', 'true');
        state.filters.availability = chip.dataset.avail;
        debouncedFilter();
    });

    function numOrNull(el) {
        const raw = el.value.trim();
        if (raw === '') return null;
        const n = Number(raw);
        return isNaN(n) ? null : n;
    }

    priceMin.addEventListener('input', () => { state.filters.priceMin = numOrNull(priceMin); debouncedFilter(); });
    priceMax.addEventListener('input', () => { state.filters.priceMax = numOrNull(priceMax); debouncedFilter(); });
    qtyMin.addEventListener('input', () => { state.filters.qtyMin = numOrNull(qtyMin); debouncedFilter(); });
    qtyMax.addEventListener('input', () => { state.filters.qtyMax = numOrNull(qtyMax); debouncedFilter(); });

    lowStockChip.addEventListener('click', () => {
        state.filters.lowStockOnly = !state.filters.lowStockOnly;
        lowStockChip.classList.toggle('active', state.filters.lowStockOnly);
        lowStockChip.setAttribute('aria-pressed', state.filters.lowStockOnly ? 'true' : 'false');
        debouncedFilter();
    });

    resetFilters.addEventListener('click', () => {
        state.filters = {
            search: '', availability: 'all',
            priceMin: null, priceMax: null,
            qtyMin: null, qtyMax: null, lowStockOnly: false
        };
        searchInput.value = '';
        clearSearch.classList.remove('show');
        priceMin.value = '';
        priceMax.value = '';
        qtyMin.value = '';
        qtyMax.value = '';
        lowStockChip.classList.remove('active');
        lowStockChip.setAttribute('aria-pressed', 'false');
        document.querySelectorAll('#availChips .chip').forEach(c => {
            c.classList.remove('active');
            c.setAttribute('aria-checked', 'false');
        });
        const allChip = document.querySelector('[data-avail="all"]');
        if (allChip) {
            allChip.classList.add('active');
            allChip.setAttribute('aria-checked', 'true');
        }
        sortSelect.value = 'priority';
        orderSelect.value = 'desc';
        state.sort = 'priority';
        state.order = 'desc';
        applyFiltersAndSort();
        Toast.show('تم إعادة تعيين الفلاتر', 'success');
    });

    /* -------- Infinite Scroll -------- */
    // ✅ FIX #75: نحفظ observer لإمكانية disconnect
    let observer = null;
    function setupObserver() {
        if (observer) observer.disconnect();
        observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting && state.visibleCount < state.filteredItems.length && !state.isRendering) {
                    renderPage(true);
                }
            });
        }, { rootMargin: '300px 0px' });
        observer.observe(sentinel);
    }

    /* -------- Cart Sidebar -------- */
    const cartSidebar = document.getElementById('cartSidebar');
    const cartOverlay = document.getElementById('cartOverlay');

    document.getElementById('cartBtn').addEventListener('click', () => {
        Cart.render();
        cartSidebar.classList.add('open');
        cartOverlay.classList.add('open');
        cartOverlay.setAttribute('aria-hidden', 'false');
    });
    document.getElementById('cartClose').addEventListener('click', closeCart);
    cartOverlay.addEventListener('click', closeCart);

    function closeCart() {
        cartSidebar.classList.remove('open');
        cartOverlay.classList.remove('open');
        cartOverlay.setAttribute('aria-hidden', 'true');
    }

    /* -------- Cart Type Toggle -------- */
    document.querySelectorAll('#cartTypeToggle button').forEach(btn => {
        btn.addEventListener('click', async () => {
            const newType = btn.dataset.type;
            const currentType = Cart.getType();
            if (newType === currentType) return;

            const cart = Cart.getAll();
            const newLabel = newType === 'installment' ? 'التقسيط' : 'الكاش';
            const currentLabel = currentType === 'installment' ? 'التقسيط' : 'الكاش';

            if (cart.length > 0) {
                const ok = await Confirm.ask(
                    'تأكيد تغيير نوع الدفع',
                    `سيتم تبديل السلة من "${currentLabel}" إلى "${newLabel}". هل تريد المتابعة؟`,
                    {
                        icon: '🔄',
                        okLabel: `تحويل إلى ${newLabel}`,
                        danger: newType === 'cash'
                    }
                );
                if (!ok) return;
            }

            Cart.setType(newType);
            Toast.show(`تم التحويل لوضع ${newLabel}`, 'success');
        });
    });

    /* -------- Plan Frequency -------- */
    document.querySelectorAll('#planFrequency button').forEach(btn => {
        btn.addEventListener('click', () => {
            Cart.setFrequency(btn.dataset.freq);
        });
    });

    /* -------- Plan Duration -------- */
    const durationSlider = document.getElementById('planDuration');
    if (durationSlider) {
        durationSlider.addEventListener('input', () => {
            Cart.setDuration(durationSlider.value);
        });
    }

    /* -------- Cart Checkout -------- */
    document.getElementById('cartCheckout').addEventListener('click', () => {
        const list = Cart.getAll();
        if (list.length === 0) {
            Toast.show('السلة فارغة', 'warning');
            return;
        }
        const type = Cart.getType();
        if (type === 'installment') {
            const calc = Cart.calculatePlan();
            if (!calc.meetsMinimum) {
                Toast.show(`الحد الأدنى للتقسيط ${CONFIG.INSTALLMENT_MIN_TOTAL} ج.م`, 'warning');
                return;
            }
            if (calc.payment < calc.minPayment) {
                Toast.show(`أقل قسط ${calc.frequency === 'daily' ? 'يومي' : 'شهري'} هو ${calc.minPayment} ج.م`, 'warning');
                return;
            }
        }
        WhatsApp.orderCart();
    });

    document.getElementById('wishlistBtn').addEventListener('click', () => {
        const list = Wishlist.getAll();
        if (list.length === 0) {
            Toast.show('لا توجد منتجات في المفضلة', 'warning');
            return;
        }
        Toast.show(`لديك ${list.length} منتج في المفضلة`, 'success');
    });

    return {
        init: async function() {
            // ✅ FIX #100: تحديث الإصدار ديناميكياً
            if (versionLabel) versionLabel.textContent = 'الإصدار ' + CONFIG.APP_VERSION;

            Cart.updateBadge();
            Cart.render();
            Wishlist.updateBadge();
            Connection.update();
            setupObserver();

            try {
                await initLoad();
            }
            catch (e) {
                showError('فشل بدء التطبيق: ' + (e.message || 'خطأ غير معروف'));
            }
        },
        refreshFromServer
    };
})();

/* ================================================================
   [JS-15] BOOTSTRAP
   ================================================================ */
window.App = App;

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => {
        if ('requestIdleCallback' in window) {
            requestIdleCallback(() => window.App.init(), { timeout: 200 });
        } else {
            setTimeout(() => window.App.init(), 0);
        }
    });
} else {
    if ('requestIdleCallback' in window) {
        requestIdleCallback(() => window.App.init(), { timeout: 200 });
    } else {
        setTimeout(() => window.App.init(), 0);
    }
}
</script>
